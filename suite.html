<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Suite</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:#2563eb;--ac:#16a34a;--bg:#f8fafc;--surf:#ffffff;--bd:#e8edf3;--tx:#1e293b;--mut:#64748b}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:36px 20px 56px}

/* Header */
.head{text-align:center;margin-bottom:24px}
.head img{max-height:48px;max-width:200px;object-fit:contain;margin-bottom:14px}
.head h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.head p{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.55;max-width:480px;margin-left:auto;margin-right:auto}

/* Progress */
.prog{margin:22px 0 18px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.prog-cnt{font-size:13px;font-weight:700;color:var(--p)}
.prog-track{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--ac));border-radius:99px;width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* List */
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;transition:border-color .15s,box-shadow .15s,transform .1s}
.item.done{border-color:#bbf7d0;background:#f6fdf9}
.item:not(.done):hover{border-color:var(--p);box-shadow:0 4px 16px rgba(37,99,235,.08)}
.mark{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:2px solid #cbd5e1;color:#94a3b8;background:#fff;transition:all .2s}
.item.done .mark{background:var(--ac);border-color:var(--ac);color:#fff}
.item-body{flex:1;min-width:0}
.item-title{font-size:15px;font-weight:650;line-height:1.3}
.item-desc{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.item-act{flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;text-decoration:none;white-space:nowrap;transition:opacity .12s,background .12s}
.btn:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{opacity:.88}
.btn-s{background:#fff;color:var(--tx);border-color:var(--bd)}.btn-s:hover{background:var(--bg)}
.done-tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ac)}

/* Footer / actions */
.foot{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot .who{font-size:12.5px;color:var(--mut)}
.foot .who b{color:var(--tx)}
.link-btn{background:none;border:none;color:var(--p);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.link-btn:hover{text-decoration:underline}

/* Complete banner */
.done-banner{text-align:center;background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1px solid #bbf7d0;border-radius:16px;padding:30px 24px;margin-bottom:22px}
.done-banner .ring{width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.done-banner h2{font-size:20px;font-weight:800}
.done-banner p{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.5}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

/* Gate (identity capture) */
.gate{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:28px 26px;max-width:460px;margin:0 auto}
.gate h2{font-size:17px;font-weight:700;margin-bottom:6px}
.gate p{font-size:13px;color:var(--mut);margin-bottom:14px;line-height:1.5}
.gate label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:5px;margin-top:14px}
.gate label .opt{text-transform:none;letter-spacing:0;font-weight:500;color:#94a3b8}
.gate input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;font-size:14px;font-family:inherit;color:var(--tx);background:#fff;outline:none}
.gate input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.gate .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gate .row2 label{margin-top:0}
.gate .btn-p{width:100%;justify-content:center;margin-top:22px;padding:11px}
.gate .err{color:#dc2626;font-size:12.5px;margin-top:8px;display:none}

/* States */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--mut);text-align:center;padding:30px}
.center h2{font-size:18px;font-weight:700;color:var(--tx)}
.spinner{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center i{font-size:44px;color:#cbd5e1}
.poweredby{text-align:center;font-size:11px;color:#94a3b8;margin-top:30px}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div><div>Loading…</div></div></div>

<!-- Optional: instance id injected by nginx (harmless 404 if served elsewhere) -->
<script src="/config.js" onerror="void 0"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   INFRASTRUCTURE CONFIG  ── matches player.html / your Supabase project
   ═══════════════════════════════════════════════════════════════════ */
const CFG = {
  supabaseUrl:  'https://owouiukkteoentgpbrlk.supabase.co',
  supabaseKey:  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93b3VpdWtrdGVvZW50Z3BicmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NjQxNzcsImV4cCI6MjA5NTM0MDE3N30.NOPj0iARb1bExfBv2t8KvFktLTisp2OPE95dM_C7TJw',
  playerOrigin: 'https://assessments.vitalspark.ai',   // where /a/{id} is served from
};

/* ═══════════════════════════════════════════════════════════════════
   RUNTIME — one file serves every client; the URL slug picks the suite.
     /s/acme   /suite/acme   /s?c=acme
   Each suite (brand, webhook, assessments) lives in the ab_suites table.
   ═══════════════════════════════════════════════════════════════════ */
const QPS  = new URLSearchParams(location.search);
const esc  = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const enc  = encodeURIComponent;

function parseSlug() {
  const m = location.pathname.match(/^\/s(?:uite)?\/([^/?#]+)/i);
  if (m) return decodeURIComponent(m[1]);
  return QPS.get('c') || QPS.get('suite') || '';
}
const SLUG  = parseSlug();
const STORE = 'vs_suite__' + SLUG;

let SUITE  = null;   // row from ab_suites
let ASSESS = [];     // [{id, title, description}] in suite order

const ST = {
  firstName: (QPS.get('first') || '').trim(),
  lastName:  (QPS.get('last')  || '').trim(),
  email:     (QPS.get('email') || '').trim().toLowerCase(),
  teamCode:  (QPS.get('team')  || '').trim(),
  status: {},   // { [assessmentId]: { done, responseId, completedAt } }
  loaded: false,
  busy: false,
};
const fullName = () => [ST.firstName, ST.lastName].filter(Boolean).join(' ').trim();

/* ── Supabase ── */
async function sbGet(table, params) {
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/${table}?${params}`, {
    headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey, Accept: 'application/json' },
  });
  if (!r.ok) throw new Error('Supabase GET ' + table + ' ' + r.status);
  return r.json();
}

// Completion = a response row for this assessment with this email
async function isComplete(assessmentId, email) {
  const params = `select=id,created_at&assessment_id=eq.${enc(assessmentId)}&contact->>Email=eq.${enc(email)}&order=created_at.asc&limit=1`;
  const rows = await sbGet('ab_responses', params).catch(() => []);
  return rows && rows.length ? { responseId: rows[0].id, completedAt: rows[0].created_at } : null;
}

async function refreshStatus(opts = {}) {
  if (!ST.email || ST.busy || !ASSESS.length) return;
  ST.busy = true;
  if (opts.spinner) render();
  await Promise.all(ASSESS.map(async a => {
    try {
      const hit = await isComplete(a.id, ST.email);
      ST.status[a.id] = hit ? { done: true, ...hit } : { done: false };
    } catch { /* keep prior status */ }
  }));
  ST.loaded = true;
  ST.busy = false;
  render();
  maybeFireWebhook();
}

/* ── Webhook (fires once when every assessment is complete) ── */
function allDone() { return ASSESS.length > 0 && ASSESS.every(a => ST.status[a.id]?.done); }
function firedKey() { return STORE + '__fired__' + ST.email; }

async function maybeFireWebhook() {
  if (!allDone() || !SUITE) return;
  if (localStorage.getItem(firedKey())) { maybeRedirect(); return; }
  localStorage.setItem(firedKey(), new Date().toISOString());   // guard against double-fire
  if (SUITE.webhook_url) {
    const payload = {
      event:      'suite_completed',
      suiteSlug:  SUITE.slug,
      suiteName:  SUITE.name,
      instanceId: (typeof window !== 'undefined' && window.VS_INSTANCE_ID) || null,
      contact: {
        firstName: ST.firstName, lastName: ST.lastName,
        name:      fullName(),   email: ST.email,
        teamCode:  ST.teamCode || null,
      },
      completedAt: new Date().toISOString(),
      assessments: ASSESS.map(a => ({
        id: a.id, title: a.title,
        responseId: ST.status[a.id]?.responseId || null,
        completedAt: ST.status[a.id]?.completedAt || null,
      })),
    };
    let headers = { 'Content-Type': 'application/json' };
    try { if (SUITE.webhook_headers) headers = { ...headers, ...(typeof SUITE.webhook_headers === 'string' ? JSON.parse(SUITE.webhook_headers) : SUITE.webhook_headers) }; } catch {}
    try {
      const res = await fetch(SUITE.webhook_url, { method: 'POST', headers, body: JSON.stringify(payload), keepalive: true });
      if (!res.ok) console.warn('Suite webhook returned', res.status);
    } catch (e) {
      try { await fetch(SUITE.webhook_url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }); }
      catch (e2) { console.error('Suite webhook failed:', e2.message); localStorage.removeItem(firedKey()); }
    }
  }
  render();
  maybeRedirect();
}
function maybeRedirect() {
  if (SUITE && SUITE.redirect_url) setTimeout(() => { try { (window.top || window).location.href = SUITE.redirect_url; } catch { location.href = SUITE.redirect_url; } }, 1800);
}

/* ── Identity ── */
function restoreIdentity() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE + '__id') || '{}');
    if (!ST.firstName && s.firstName) ST.firstName = s.firstName;
    if (!ST.lastName  && s.lastName)  ST.lastName  = s.lastName;
    if (!ST.email     && s.email)     ST.email     = s.email;
    if (!ST.teamCode  && s.teamCode)  ST.teamCode  = s.teamCode;
  } catch {}
}
function startSuite() {
  const fn = (document.getElementById('g-first')?.value || '').trim();
  const ln = (document.getElementById('g-last')?.value  || '').trim();
  const em = (document.getElementById('g-email')?.value || '').trim().toLowerCase();
  const tc = (document.getElementById('g-team')?.value  || '').trim();
  const err = document.getElementById('g-err');
  const fail = (msg) => { if (err) { err.textContent = msg; err.style.display = 'block'; } };
  if (!fn) return fail('Please enter your first name.');
  if (!ln) return fail('Please enter your last name.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return fail('Please enter a valid email address.');
  ST.firstName = fn; ST.lastName = ln; ST.email = em; ST.teamCode = tc;
  try { localStorage.setItem(STORE + '__id', JSON.stringify({ firstName: fn, lastName: ln, email: em, teamCode: tc })); } catch {}
  render();
  refreshStatus({ spinner: true });
}
function switchUser() {
  ST.firstName = ST.lastName = ST.email = ST.teamCode = '';
  ST.status = {}; ST.loaded = false;
  try { localStorage.removeItem(STORE + '__id'); } catch {}
  render();
}

/* ── Links — pass identity so each assessment records the same person ── */
function playerLink(id) {
  const p = new URLSearchParams();
  if (ST.email)    p.set('email', ST.email);
  if (fullName())  p.set('name',  fullName());
  if (ST.teamCode) p.set('team',  ST.teamCode);
  return `${CFG.playerOrigin}/a/${id}?${p.toString()}`;
}

/* ── Brand ── */
function applyBrand() {
  document.documentElement.style.setProperty('--p',  SUITE.primary_color || '#2563eb');
  document.documentElement.style.setProperty('--ac', SUITE.accent_color  || '#16a34a');
  document.title = SUITE.name || 'Assessment Suite';
}

/* ── Render ── */
function renderMessage(title, body, icon = 'ti-help-circle') {
  document.getElementById('app').innerHTML =
    `<div class="wrap"><div class="center"><i class="ti ${icon}"></i><h2>${esc(title)}</h2><div>${esc(body)}</div></div></div>`;
}

function render() {
  if (!SUITE) return;
  const app = document.getElementById('app');
  const header = `<div class="head">
    ${SUITE.logo_url ? `<img src="${esc(SUITE.logo_url)}" alt="" onerror="this.style.display='none'">` : ''}
    <h1>${esc(SUITE.name)}</h1>
    ${SUITE.intro ? `<p>${esc(SUITE.intro)}</p>` : ''}
  </div>`;

  if (!ASSESS.length) {
    app.innerHTML = `<div class="wrap">${header}<div class="center"><i class="ti ti-clipboard-off"></i><div>No assessments are attached to this suite yet.</div></div></div>`;
    return;
  }

  // Identity gate
  if (!ST.email) {
    app.innerHTML = `<div class="wrap">${header}
      <div class="gate">
        <h2>Let’s get started</h2>
        <p>Enter your details so we can save your progress across all ${ASSESS.length} assessments.</p>
        <div class="row2">
          <div><label for="g-first">First name</label><input id="g-first" type="text" value="${esc(ST.firstName)}" autocomplete="given-name" onkeydown="if(event.key==='Enter')document.getElementById('g-last').focus()"></div>
          <div><label for="g-last">Last name</label><input id="g-last" type="text" value="${esc(ST.lastName)}" autocomplete="family-name" onkeydown="if(event.key==='Enter')document.getElementById('g-email').focus()"></div>
        </div>
        <label for="g-email">Email</label>
        <input id="g-email" type="email" placeholder="you@company.com" value="${esc(ST.email)}" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('g-team').focus()">
        <label for="g-team">Team code <span class="opt">(optional)</span></label>
        <input id="g-team" type="text" value="${esc(ST.teamCode)}" autocomplete="off" onkeydown="if(event.key==='Enter')startSuite()">
        <div class="err" id="g-err"></div>
        <button class="btn btn-p" onclick="startSuite()"><i class="ti ti-arrow-right"></i> Begin</button>
      </div>
      ${powered()}
    </div>`;
    return;
  }

  const doneCount = ASSESS.filter(a => ST.status[a.id]?.done).length;
  const pct = Math.round((doneCount / ASSESS.length) * 100);
  const finished = allDone();

  const items = ASSESS.map((a, i) => {
    const done = !!ST.status[a.id]?.done;
    return `<div class="item ${done ? 'done' : ''}">
      <div class="mark">${done ? '<i class="ti ti-check"></i>' : (i + 1)}</div>
      <div class="item-body">
        <div class="item-title">${esc(a.title)}</div>
        ${a.description ? `<div class="item-desc">${esc(a.description)}</div>` : ''}
      </div>
      <div class="item-act">
        ${done
          ? `<span class="done-tag"><i class="ti ti-circle-check-filled"></i> Completed</span>`
          : `<a class="btn btn-p" href="${esc(playerLink(a.id))}" target="_blank" rel="noopener"><i class="ti ti-player-play"></i> Start</a>`}
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `<div class="wrap">
    ${header}
    ${finished ? `<div class="done-banner">
      <div class="ring"><i class="ti ti-check"></i></div>
      <h2>All assessments complete 🎉</h2>
      <p>Thanks${ST.firstName ? ', ' + esc(ST.firstName) : ''}! You’ve finished all ${ASSESS.length}. ${SUITE.webhook_url ? 'Your results are on their way.' : ''}</p>
    </div>` : ''}
    <div class="prog">
      <div class="prog-top"><span class="prog-lbl">Progress</span><span class="prog-cnt">${doneCount} of ${ASSESS.length} complete</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="list">${items}</div>
    <div class="foot">
      <span class="who">Tracking as <b>${esc(fullName() || ST.email)}</b>${ST.teamCode ? ` · team <b>${esc(ST.teamCode)}</b>` : ''}</span>
      <span style="display:flex;gap:14px;align-items:center">
        <button class="link-btn" onclick="refreshStatus({spinner:false})" ${ST.busy ? 'disabled' : ''}><i class="ti ti-refresh"></i> Refresh status</button>
        <button class="link-btn" onclick="switchUser()"><i class="ti ti-user-cog"></i> Not you?</button>
      </span>
    </div>
    ${powered()}
  </div>`;
}
function powered() { return `<div class="poweredby">Powered by VitalSpark</div>`; }

/* ── Boot ── */
async function boot() {
  if (!SLUG) { renderMessage('No suite specified', 'Add a suite to the URL, e.g. /s/your-client.', 'ti-link-off'); return; }
  try {
    const rows = await sbGet('ab_suites', `select=*&slug=eq.${enc(SLUG.toLowerCase())}&limit=1`);
    if (!rows.length) { renderMessage('Suite not found', `No suite matches “${SLUG}”.`, 'ti-search-off'); return; }
    SUITE = rows[0];
    applyBrand();
    const ids = Array.isArray(SUITE.assessment_ids) ? SUITE.assessment_ids : [];
    if (ids.length) {
      const fetched = await sbGet('ab_assessments', `select=id,title,description&id=in.(${ids.map(enc).join(',')})`);
      const byId = Object.fromEntries(fetched.map(a => [a.id, a]));
      ASSESS = ids.map(id => byId[id]).filter(Boolean);   // preserve suite order
    }
    restoreIdentity();
    render();
    if (ST.email) refreshStatus({ spinner: true });
  } catch (e) {
    renderMessage('Could not load suite', e.message || String(e), 'ti-alert-triangle');
  }
}
boot();

/* Re-check completion when the user returns from finishing an assessment */
window.addEventListener('focus', () => { if (SUITE && ST.email && !allDone()) refreshStatus(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && SUITE && ST.email && !allDone()) refreshStatus(); });
setInterval(() => { if (!document.hidden && SUITE && ST.email && !allDone()) refreshStatus(); }, 15000);
</script>
</body>
</html>
