<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// CONFIG — injected at deploy time via envsubst in Dockerfile
// Replace __VARS__ with your actual values before serving.
// ═══════════════════════════════════════════════════════════════════
const CFG = {
  supabaseUrl:  'https://owouiukkteoentgpbrlk.supabase.co',
  supabaseKey:  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93b3VpdWtrdGVvZW50Z3BicmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NjQxNzcsImV4cCI6MjA5NTM0MDE3N30.NOPj0iARb1bExfBv2t8KvFktLTisp2OPE95dM_C7TJw',
  playerOrigin: 'https://assessments.vitalspark.ai',
};

// ═══════════════════════════════════════════════════════════════════
// URL PARSING
// Supports: /a/{id}  and  ?id={id}
// Embed params: ?embed=1&redirect=https://...&bgcolor=...
// ═══════════════════════════════════════════════════════════════════
const QPS       = new URLSearchParams(window.location.search);
const pathMatch = window.location.pathname.match(/\/a\/([^/?#]+)/);
const ASM_ID    = pathMatch?.[1] || QPS.get('id') || '';
const IS_EMBED  = QPS.get('embed') === '1';
const REDIRECT  = QPS.get('redirect') || '';

// ═══════════════════════════════════════════════════════════════════
// SUPABASE REST HELPERS
// ═══════════════════════════════════════════════════════════════════
async function sbGet(table, params = '') {
  const url = `${CFG.supabaseUrl}/rest/v1/${table}${params ? '?' + params : ''}`;
  const r = await fetch(url, {
    headers: {
      'apikey': CFG.supabaseKey,
      'Authorization': 'Bearer ' + CFG.supabaseKey,
      'Accept': 'application/json',
    }
  });
  if (!r.ok) throw new Error(`Supabase GET ${table} failed: ${r.status}`);
  return r.json();
}

async function sbInsert(table, data) {
  const url = `${CFG.supabaseUrl}/rest/v1/${table}`;
  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': CFG.supabaseKey,
      'Authorization': 'Bearer ' + CFG.supabaseKey,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    },
    body: JSON.stringify(data),
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error(`Supabase INSERT ${table} failed: ${r.status} ${err}`);
  }
  const rows = await r.json();
  return Array.isArray(rows) ? rows[0] : rows;
}

// ═══════════════════════════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════════════════════════
let ASM, DIMS, SECS, QS_MAP, QS_ORDERED;

async function loadAssessment() {
  if (!ASM_ID) throw new Error('No assessment ID provided.');
  const [asms, dims, secs, qs] = await Promise.all([
    sbGet('ab_assessments', `id=eq.${ASM_ID}&status=eq.published&select=*`),
    sbGet('ab_dimensions',  `assessment_id=eq.${ASM_ID}&order=order_index&select=*`),
    sbGet('ab_sections',    `assessment_id=eq.${ASM_ID}&order=order_index&select=*`),
    sbGet('ab_questions',   `assessment_id=eq.${ASM_ID}&order=order_index&select=*`),
  ]);
  if (!asms.length) throw new Error('Assessment not found or not published.');
  ASM  = asms[0];
  DIMS = dims;
  SECS = secs;

  // Build ordered question list: by section order then question order
  const secOrder = Object.fromEntries(secs.map((s, i) => [s.id, i]));
  QS_ORDERED = [...qs].sort((a, b) => {
    const si = a.section_id ? (secOrder[a.section_id] ?? 999) : 999;
    const sj = b.section_id ? (secOrder[b.section_id] ?? 999) : 999;
    if (si !== sj) return si - sj;
    return (a.order_index || 0) - (b.order_index || 0);
  });
  QS_MAP = Object.fromEntries(qs.map(q => [q.id, q]));
}

// ═══════════════════════════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════════════════════════
function calcScores(answers) {
  const s = Object.fromEntries(DIMS.map(d => [d.id, 0]));
  QS_ORDERED.forEach(q => {
    if (q.type === 'multiple_choice' && answers[q.id]) {
      const opt = (q.options || []).find(o => o.id === answers[q.id]);
      if (opt?.scores) Object.entries(opt.scores).forEach(([k, v]) => { if (s[k] !== undefined) s[k] += Number(v); });
    }
    if (q.type === 'multi_select' && Array.isArray(answers[q.id])) {
      answers[q.id].forEach(oid => {
        const opt = (q.options || []).find(o => o.id === oid);
        if (opt?.scores) Object.entries(opt.scores).forEach(([k, v]) => { if (s[k] !== undefined) s[k] += Number(v); });
      });
    }
    if (q.type === 'ranking' && Array.isArray(answers[q.id]) && answers[q.id].length) {
      const order = answers[q.id]; const n = order.length;
      const weights = q.position_weights?.length === n ? q.position_weights : Array.from({length: n}, (_, i) => n - i);
      order.forEach((optId, idx) => {
        const opt = (q.options || []).find(o => o.id === optId);
        const w = Number(weights[idx]) || 0;
        if (opt?.scores) Object.entries(opt.scores).forEach(([k, v]) => { if (s[k] !== undefined) s[k] += Number(v) * w; });
      });
    }
  });
  return s;
}

function getRanks(scores) {
  return Object.fromEntries(DIMS.map(d => {
    const s = scores[d.id] || 0;
    const r = (d.ranges || []).find(r => s >= r.min && s <= r.max);
    return [d.id, r || { label: 'N/A', description: '', recommendation: '' }];
  }));
}

function getTied(scores) {
  const vals = Object.values(scores);
  if (!vals.length) return [];
  const mx = Math.max(...vals);
  return Object.entries(scores).filter(([, v]) => v === mx).map(([id]) => id);
}

// ═══════════════════════════════════════════════════════════════════
// CLASSIFICATION ENGINE
// Applies dynamic formulas (PT delta, Relative Max) that can't be
// expressed as static min/max ranges.
// Sections set classification_formula: 'pt_delta' | 'relative_max' | 'ranges'
// ═══════════════════════════════════════════════════════════════════
const PT_MAX_SCORES = { 'Adventurer': 28 };
const PT_DEFAULT_MAX = 32;

function evalFormula(formula, dimId, rawScores, dims, dimMaxes) {
  if (!formula || !formula.trim()) return false;
  var expr = formula.trim();
  var selfScore = rawScores[dimId] || 0;

  // Current dim max — use question-computed max if available
  var dimObj = dims.find(function(d){ return d.id===dimId; });
  var dimMax = (dimMaxes && dimMaxes[dimId]) ||
    (dimObj && dimObj.ranges && dimObj.ranges.length
      ? Math.max.apply(null, dimObj.ranges.map(function(r){ return r.max||0; })) : 100);

  // Pct(<DimName>) — each dim uses its OWN max (matches PHP per-dim percentage)
  dims.forEach(function(d) {
    var dMax = d.ranges && d.ranges.length
      ? Math.max.apply(null, d.ranges.map(function(r){ return r.max||0; })) : 100;
    var sc = rawScores[d.id] || 0;
    // Replace Pct(<DimName>) before raw <DimName> to avoid double-substitution
    var escapedName = d.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    expr = expr.replace(new RegExp('Pct\\(<' + escapedName + '>\\)', 'gi'), '(' + sc + '/' + dMax + '*100)');
  });
  expr = expr.replace(/Pct\(<self>\)/gi, '(' + selfScore + '/' + dimMax + '*100)');
  expr = expr.replace(/Pct\(([^)]+)\)/gi, function(_, inner) {
    return '(' + inner + '/' + dimMax + '*100)';
  });

  // Replace remaining <DimName> raw score references
  dims.forEach(function(d) {
    var re = new RegExp('<' + d.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '>', 'gi');
    expr = expr.replace(re, String(rawScores[d.id] || 0));
  });
  expr = expr.replace(/<self>/gi, String(selfScore));

  expr = expr.replace(/\bAND\b/gi, '&&').replace(/\bOR\b/gi, '||');
  expr = expr.replace(/\bMax\(/gi, 'Math.max(')
             .replace(/\bMin\(/gi, 'Math.min(')
             .replace(/\bAvg\(/gi, '__avg(')
             .replace(/\bSum\(/gi, '__sum(')
             .replace(/\bAbs\(/gi, 'Math.abs(');
  if (/^\s*[><!=]/.test(expr)) expr = selfScore + ' ' + expr;
  expr = expr.replace(/([^><!=])=([^>=])/g, '$1==$2');
  try {
    var fn = new Function('__avg','__sum','return (' + expr + ')');
    return Boolean(fn(
      function() { var a=Array.from(arguments); return a.reduce(function(s,v){return s+v;},0)/a.length; },
      function() { var a=Array.from(arguments); return a.reduce(function(s,v){return s+v;},0); }
    ));
  } catch(e) { return false; }
}



// Compute max possible score for a dimension from questions
function mxSc(qs, dId) {
  var m = 0;
  (qs || []).forEach(function(q) {
    if (q.type === 'multiple_choice') {
      var sc = (q.options||[]).map(function(o){ return Number((o.scores||{})[dId]||0); });
      if (sc.length) m += Math.max.apply(null, [0].concat(sc));
    }
    if (q.type === 'multi_select') {
      (q.options||[]).forEach(function(o){ var s=Number((o.scores||{})[dId]||0); if(s>0) m+=s; });
    }
    if (q.type === 'ranking') {
      var weights = q.positionWeights || [];
      var maxW = weights.length ? Math.max.apply(null, weights) : 1;
      (q.options||[]).forEach(function(o){ var s=Number((o.scores||{})[dId]||0); if(s>0) m+=s*maxW; });
    }
  });
  return m;
}

function classifyAll(rawScores) {
  const overrides = {};
  if (!S._hiddenDims) S._hiddenDims = new Set();

  (SECS || []).forEach(sec => {
    const formula = sec.classification_formula || sec.classificationFormula || 'ranges';
    const fl = sec.formula_labels || sec.formulaLabels || {};
    const secDimIds2 = sec.active_dim_ids || sec.activeDimIds || [];
    const secDimsAll = DIMS.filter(d => secDimIds2.includes(d.id));

    // formulaTiers takes priority — user-written expressions
    const formulaTiers = fl.formulaTiers;
    if (formulaTiers && formulaTiers.length) {
      // Pre-compute max possible score per dim from questions
      const dimMaxes = {};
      secDimsAll.forEach(d => { dimMaxes[d.id] = mxSc(QS_ORDERED, d.id) || 100; });
      // Evaluate tiers in order; first match wins per dimension
      const matched = new Set();
      formulaTiers.forEach(tier => {
        if (!tier.formula || !tier.label) return;
        secDimsAll.forEach(d => {
          if (matched.has(d.id)) return; // already classified by higher-priority tier
          if (evalFormula(tier.formula, d.id, rawScores, secDimsAll, dimMaxes)) {
            overrides[d.id] = { label: tier.label, description: tier.description||'', recommendation: tier.recommendation||'' };
            matched.add(d.id);
          }
        });
      });
      return;
    }

    if (formula === 'ranges') {
      const staticTiers = fl.staticTiers;
      if (!staticTiers || !staticTiers.length) return;
      secDimsAll.forEach(d => {
        const s = rawScores[d.id] || 0;
        const ranges = (d.ranges || []).slice().sort((a,b) => a.min - b.min);
        let rIdx = ranges.findIndex(r => s >= r.min && s <= r.max);
        if (rIdx < 0) rIdx = s < (ranges[0]?.min||0) ? 0 : ranges.length - 1;
        const tier = staticTiers[rIdx];
        if (tier && tier.label) {
          overrides[d.id] = { label: tier.label, description: tier.description||'', recommendation: tier.recommendation||'' };
        }
      });
      return;
    }

    const secDimIds = secDimIds2;
    const secDims = secDimsAll;
    if (!secDims.length) return;

    // ── PT Delta Formula ───────────────────────────────────────────
    if (formula === 'pt_delta') {
      const pcts = {};
      secDims.forEach(d => {
        const mx = PT_MAX_SCORES[d.name] || PT_DEFAULT_MAX;
        pcts[d.id] = ((rawScores[d.id] || 0) / mx) * 100;
      });
      const maxPct = Math.max(...Object.values(pcts));

      secDims.forEach(d => {
        const pct = pcts[d.id];
        let label = null, desc = '', rec = '';
        if (pct >= maxPct - 1.5) {
          label = 'Personality Type';
          desc  = 'Core expression of who you are';
          rec   = 'Own this type fully — it is your natural strength and signature.';
        } else if (pct >= 65) {
          label = 'Highly Impacting Type';
          desc  = 'Significantly shapes your behavior and decisions';
          rec   = 'Lean into this type in contexts where it is an asset.';
        } else if (pct >= 37) {
          label = 'Secondary Type';
          desc  = 'A background influence on how you show up';
          rec   = 'Notice when this type activates and leverage it intentionally.';
        }
        if (label) {
          overrides[d.id] = { label, description: desc, recommendation: rec };
        } else {
          S._hiddenDims.add(d.id); // below threshold — suppress from results
        }
      });
    }

    // ── Relative Max Formula ───────────────────────────────────────
    else if (formula === 'relative_max') {
      const rawSec = {};
      secDims.forEach(d => { rawSec[d.id] = rawScores[d.id] || 0; });
      const maxRaw = Math.max(...Object.values(rawSec));
      const THRESHOLD = 4;
      const SIG_FLOOR = maxRaw * 0.4;
      const belowMax = Object.values(rawSec).filter(v => v < maxRaw && v > SIG_FLOOR);
      const secondMax = belowMax.length ? Math.max(...belowMax) : -1;

      secDims.forEach(d => {
        const s = rawSec[d.id];
        let label = null;
        if (s >= maxRaw - THRESHOLD) {
          label = 'Primary';
        } else if (secondMax > -1 && s >= secondMax - THRESHOLD && s < maxRaw - THRESHOLD) {
          label = 'Secondary';
        }
        if (label) {
          overrides[d.id] = {
            label,
            description: `${label} ${d.name} expression`,
            recommendation: label === 'Primary'
              ? `This is your dominant pattern — understand it deeply to improve your relationships.`
              : `This secondary pattern activates in certain situations — notice when it shows up.`
          };
        }
      });

      // ── Attachment special combos ──────────────────────────────
      const byName = Object.fromEntries(secDims.map(d => [d.name, d]));
      const primaryIds = secDims.filter(d => overrides[d.id]?.label === 'Primary').map(d => d.name);
      if (primaryIds.includes('Anxious') && primaryIds.includes('Avoidant')) {
        ['Anxious','Avoidant'].forEach(n => { if (byName[n]) delete overrides[byName[n].id]; });
        const target = byName['Anxious'] || secDims[0];
        overrides[target.id] = { label: 'Anxious-Avoidant', description: 'Primary mixed attachment: both anxious and avoidant tendencies are dominant', recommendation: 'Working with a therapist on attachment patterns will be highly impactful for you.' };
      } else if (primaryIds.includes('Anxious-Secure') && primaryIds.includes('Avoidant-Secure')) {
        ['Anxious-Secure','Avoidant-Secure'].forEach(n => { if (byName[n]) delete overrides[byName[n].id]; });
        const target = byName['Anxious-Secure'] || secDims[0];
        overrides[target.id] = { label: 'Anxious-Avoidant / Secure', description: 'A complex blend showing both anxious-secure and avoidant-secure tendencies', recommendation: 'Explore your attachment patterns with a coach or therapist.' };
      }
    }
  });

  return overrides;
}


function visibleDims() {
  return DIMS.filter(d => d.show_in_results !== false);
}
function maxScore(dimId) {
  let m = 0;
  QS_ORDERED.forEach(q => {
    if (q.type === 'multiple_choice') {
      const sc = (q.options || []).map(o => Number(o.scores?.[dimId] || 0));
      if (sc.length) m += Math.max(0, ...sc);
    }
    if (q.type === 'multi_select') {
      (q.options || []).forEach(o => { const s = Number(o.scores?.[dimId] || 0); if (s > 0) m += s; });
    }
    if (q.type === 'ranking') {
      const opts = q.options || []; const n = opts.length;
      const weights = q.position_weights?.length === n ? q.position_weights : Array.from({length: n}, (_, i) => n - i);
      const maxW = n ? Math.max(...weights) : 0;
      const maxS = Math.max(0, ...opts.map(o => Number(o.scores?.[dimId] || 0)));
      m += maxS * maxW;
    }
  });
  return m || 1;
}

// SHUFFLE
function seededShuffle(arr, seed) {
  const a = [...arr]; let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getOpts(q) {
  const opts = q.options || [];
  if (!q.shuffle_options || !opts.length) return opts;
  if (!S.shuffledOrders[q.id]) {
    const seed = q.id.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0) + Date.now() % 9999;
    S.shuffledOrders[q.id] = seededShuffle(opts.map(o => o.id), seed);
  }
  return S.shuffledOrders[q.id].map(id => opts.find(o => o.id === id)).filter(Boolean);
}

// ═══════════════════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════════════════
function selOpt(qId, optId) { S.answers[qId] = optId; render(); }
function togMulti(qId, optId) {
  const cur = Array.isArray(S.answers[qId]) ? [...S.answers[qId]] : [];
  const i = cur.indexOf(optId);
  if (i >= 0) cur.splice(i, 1); else cur.push(optId);
  S.answers[qId] = cur; render();
}
function mvRk(qId, optId, dir) {
  const order = [...(S.answers[qId] || [])];
  const i = order.indexOf(optId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  S.answers[qId] = order;
  render();
}

// ── Drag and drop — robust version ──
// _drag declared at top of SHUFFLE section
function dSt(e, qId, optId) {
  _drag = { qId, optId };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', optId); // required for Firefox
  // Use setTimeout so dragging class applies after clone is taken
  setTimeout(() => {
    const el = document.querySelector('[data-opt="' + optId + '"]');
    if (el) el.classList.add('dragging');
  }, 0);
}
function dOv(e, qId, optId) {
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.rank-item').forEach(el => el.classList.remove('drag-over'));
  const el = document.querySelector('[data-opt="' + optId + '"]');
  if (el) el.classList.add('drag-over');
}
function dDr(e, qId, targetId) {
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.rank-item').forEach(el => el.classList.remove('drag-over', 'dragging'));
  if (!_drag || _drag.optId === targetId || _drag.qId !== qId) { _drag = null; return; }
  const order = [...(S.answers[qId] || [])];
  const fi = order.indexOf(_drag.optId);
  const ti = order.indexOf(targetId);
  if (fi < 0 || ti < 0) { _drag = null; return; }
  order.splice(fi, 1);
  order.splice(ti, 0, _drag.optId);
  S.answers[qId] = order;
  _drag = null;
  render();
}
function dEnd() {
  document.querySelectorAll('.rank-item').forEach(el => el.classList.remove('drag-over', 'dragging'));
  _drag = null;
}

function prevStep() { if (S.step > 0) { S.step--; render(); window.scrollTo(0, 0); } }
function nextStep() {
  const q = QS_ORDERED[S.step];
  if (q.required) {
    if (q.type === 'multiple_choice' && !S.answers[q.id]) { toast('Please select an answer', 'err'); return; }
    if (q.type === 'multi_select' && (!S.answers[q.id] || !S.answers[q.id].length)) { toast('Please select at least one option', 'err'); return; }
    if (q.type === 'contact_form') {
      (q.contact_fields || []).forEach(f => {
        const el = document.getElementById(`cf_${f.label.replace(/\s+/g,'_')}`);
        if (el) S.contact[f.label] = el.value;
      });
      for (const f of (q.contact_fields || [])) {
        if (f.required && !S.contact[f.label]) { toast(`Please fill in "${f.label}"`, 'err'); return; }
      }
    }
  } else if (q.type === 'contact_form') {
    (q.contact_fields || []).forEach(f => {
      const el = document.getElementById(`cf_${f.label.replace(/\s+/g,'_')}`);
      if (el) S.contact[f.label] = el.value;
    });
  }
  if (S.step < QS_ORDERED.length - 1) { S.step++; render(); window.scrollTo(0, 0); }
  else { submitAssessment(); }
}

async function submitAssessment() {
  const scores    = calcScores(S.answers);
  const ranks     = getRanks(scores);
  const tiedTop   = getTied(scores);
  S._hiddenDims = new Set();
  const overrides = classifyAll(scores);
  // Merge overrides into ranks (dynamic formulas beat static ranges)
  const finalRanks = { ...ranks };
  Object.entries(overrides).forEach(([dimId, r]) => { finalRanks[dimId] = r; });
  S._scores = scores; S._ranks = finalRanks; S._tiedTop = tiedTop;

  // Build response record
  const response = {
    assessment_id:  ASM.id,
    tenant_id:      ASM.tenant_id || null,
    team_code:      S.contact['Team Code (Optional):'] || null,
    contact:        { ...S.contact },
    answers:        { ...S.answers },
    scores:         Object.fromEntries(DIMS.map(d => [d.name, scores[d.id] || 0])),
    ranks:          Object.fromEntries(DIMS.map(d => [d.name, ranks[d.id] || {}])),
    tied_top:       tiedTop,
    webhook_status: ASM.webhook_url ? 'pending' : 'not_configured',
  };

  let savedId = null;
  let saveError = null;
  try {
    const saved = await sbInsert('ab_responses', response);
    savedId = saved?.id;
  } catch (e) {
    console.error('Could not save response:', e);
    saveError = e.message;
  }

  S.submitted = true;
  S._saveError = saveError;
  S._savedId = savedId;
  render();
  notifyComplete();

  // Fire webhook async (don't block results display)
  if (ASM.webhook_url && savedId) {
    fireWebhook(ASM, { ...response, id: savedId });
  }
}

async function fireWebhook(asm, resp) {
  const dimNameMap = Object.fromEntries(DIMS.map(d => [d.id, d.name]));
  const payload = {
    responseId:      resp.id,
    assessmentId:    asm.id,
    assessmentTitle: asm.title,
    submittedAt:     new Date().toISOString(),
    contact:         resp.contact,
    scores:          resp.scores,
    ranks:           resp.ranks,
    tiedTopDimensions: (resp.tied_top || []).map(id => dimNameMap[id] || id),
    topDimension:    dimNameMap[(resp.tied_top || [])[0]] || null,
  };
  try {
    const headers = { 'Content-Type': 'application/json' };
    try { if (asm.webhook_headers) Object.assign(headers, JSON.parse(asm.webhook_headers)); } catch {}
    await fetch(asm.webhook_url, { method: 'POST', headers, body: JSON.stringify(payload) });
  } catch (e) { console.error('Webhook failed:', e); }
}

function restart() {
  S.step = 0; S.answers = {}; S.contact = {}; S.submitted = false; S.shuffledOrders = {};
  S._scores = null; S._ranks = null; S._tiedTop = null;
  render();
  window.scrollTo(0, 0);
}

function toast(msg, type = 'ok') {
  const r = document.getElementById('toast-r');
  if (!r) return;
  r.innerHTML = `<div class="toast ${type === 'err' ? 'terr' : 'tok'}"><i class="ti ${type==='err'?'ti-alert-circle':'ti-circle-check'}"></i> ${esc(msg)}</div>`;
  setTimeout(() => { r.innerHTML = ''; }, 3500);
}

function showError(msg) {
  document.getElementById('root').innerHTML = `
    <div class="vs-error">
      <i class="ti ti-alert-circle"></i>
      <h2>Assessment Unavailable</h2>
      <p>${esc(String(msg))}</p>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
if (!CFG.supabaseUrl || !CFG.supabaseKey) {
  showError('Player not configured. Set SUPABASE_URL and SUPABASE_KEY in your deployment.');
} else if (!ASM_ID) {
  showError('No assessment ID provided. Use /a/{id} or ?id={id}.');
} else {
  loadAssessment()
    .then(render)
    .catch(err => {
      console.error(err);
      showError(err.message || 'Could not load assessment.');
    });
}

// Notify parent on resize events (for dynamic content)
if (IS_EMBED) {
  const ro = new ResizeObserver(() => notifyResize());
  ro.observe(document.body);
}
</script>
</body>
</html>
