server {
  listen 80;
  server_name _;

  # Inject instance ID into a JS config endpoint
  location = /config.js {
    default_type application/javascript;
    return 200 'window.VS_INSTANCE_ID = "$INSTANCE_ID";';
  }

  # Assessment player: /a/{id}
  location ~ ^/a/(.+)$ {
    alias /usr/share/nginx/html/player.html;
    add_header Cache-Control "no-cache";
  }

  # Embed resize script
  location = /embed.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "max-age=3600";
  }

  # Builder (root)
  location / {
    root /usr/share/nginx/html;
    try_files $uri /assessment-builder.html;
    add_header Cache-Control "no-cache";
  }
}
