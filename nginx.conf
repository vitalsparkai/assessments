server {
  listen 80;
  server_name _;

  # Inject instance ID into a JS config endpoint
  location = /config.js {
    default_type application/javascript;
    return 200 'window.VS_INSTANCE_ID = "$INSTANCE_ID";';
  }

  # Assessment player: /a/{id} → serve player.html AS HTML (never a download).
  # Must use try_files (not alias) so nginx rewrites the URI to /player.html
  # and infers text/html from the .html extension. default_type is a safety net.
  location ~ ^/a/ {
    root /usr/share/nginx/html;
    try_files /player.html =404;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
  }

  # Assessment suite / progress tracker: /s or /suite.
  # Proxy to the Node SSR renderer so each suite's link-preview (Open Graph)
  # image/title/description is injected per slug. If the renderer is down,
  # fall back to the static suite.html so the page always loads.
  location ~ ^/s(uite)?(/|$) {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @suite_static;
    add_header Cache-Control "no-cache";
  }
  location @suite_static {
    root /usr/share/nginx/html;
    try_files /suite.html =404;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache";
  }

  # Embed resize script
  location = /embed.js {
    root /usr/share/nginx/html;
    default_type application/javascript;
    add_header Cache-Control "max-age=3600";
  }

  # Builder (root)
  location / {
    root /usr/share/nginx/html;
    try_files $uri /assessment-builder.html;
    add_header Cache-Control "no-cache";
  }
}
