server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Builder (admin) ───────────────────────────────────────────
    # Served at / — OAuth2 auth handled inside the HTML via Supabase JS
    location = / {
        try_files /index.html =404;
    }

    # OAuth callback route — must reach index.html (SPA handles it)
    location = /auth/callback {
        try_files /index.html =404;
    }

    # ── Assessment Player (public) ────────────────────────────────
    # /a/{id} → player.html — assessment ID read by JS from URL
    location /a/ {
        try_files $uri /player.html;

        # Allow embedding in iframes from any domain
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Embed script (public) ─────────────────────────────────────
    location = /embed.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /embed.js =404;
    }

    # ── Static assets ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
