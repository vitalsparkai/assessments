function rTest(asm) {
  const dims = gDs().filter(function(d){ return !d.name.startsWith('Spectrum — '); });
  const secs = gSecs();
  if (!dims.length) return '<div class="content"><div class="card"><p class="tm">Add dimensions first.</p></div></div>';
  if (!S._test) S._test = {};

  var secGroups = secs.map(function(sec){
    return { sec: sec, dims: dims.filter(function(d){ return (sec.activeDimIds||[]).includes(d.id); }) };
  }).filter(function(g){ return g.dims.length; });

  var inputsHtml = '';
  secGroups.forEach(function(g){
    inputsHtml += '<div style="margin-bottom:20px">';
    inputsHtml += '<div class="fgl mb2" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em">' + esc(g.sec.title) + '</div>';
    g.dims.forEach(function(d){
      var val = (S._test[d.id] !== undefined) ? S._test[d.id] : '';
      inputsHtml += '<div style="display:grid;grid-template-columns:1fr 110px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">';
      inputsHtml += '<div class="fx ic g2"><div style="width:9px;height:9px;border-radius:50%;background:' + esc(d.color||'#94a3b8') + ';flex-shrink:0"></div>';
      inputsHtml += '<span style="font-size:13px;font-weight:500">' + esc(d.name) + '</span></div>';
      inputsHtml += '<input type="number" id="ts-' + esc(d.id) + '" value="' + val + '" min="0" max="9999" placeholder="0"';
      inputsHtml += ' style="text-align:center;font-size:15px;font-weight:700;border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:100%">';
      inputsHtml += '</div>';
    });
    inputsHtml += '</div>';
  });

  var resultHtml = '';
  if (S._testResults) {
    var scores = S._testResults.scores;
    var ranks  = S._testResults.ranks;
    var maxScore = Math.max.apply(null, Object.values(scores).filter(Boolean).concat([1]));
    var anyResult = dims.some(function(d){ return ranks[d.id] && ranks[d.id].label && ranks[d.id].label !== 'N/A'; });
    if (!anyResult) {
      resultHtml = '<div class="card" style="margin-top:16px"><p class="tm tsm">No dimensions met classification threshold. Try higher scores.</p></div>';
    } else {
      resultHtml = '<div class="card" style="margin-top:16px"><div class="fgl mb3">Classification Preview</div>';
      secGroups.forEach(function(g){
        var secClassified = g.dims.filter(function(d){ return ranks[d.id] && ranks[d.id].label && ranks[d.id].label !== 'N/A'; });
        if (!secClassified.length) return;
        resultHtml += '<div style="margin-bottom:16px"><div class="tm tsm mb2" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em">' + esc(g.sec.title) + '</div>';
        secClassified.forEach(function(d){
          var score = scores[d.id]||0;
          var rank  = ranks[d.id];
          var pct   = Math.min(100, Math.round((score/maxScore)*100));
          var lbl   = rank.label||'';
          var bc    = lbl.toLowerCase().includes('primary')||lbl==='Personality Type' ? 'bbl' : lbl.toLowerCase().includes('highly')||lbl.toLowerCase().includes('high') ? 'bdft' : 'bpur';
          resultHtml += '<div style="padding:12px;border-radius:8px;margin-bottom:8px;border-left:4px solid ' + esc(d.color||'#94a3b8') + ';background:var(--bg)">';
          resultHtml += '<div class="fx ic jb mb2"><div class="fx ic g2"><div style="width:9px;height:9px;border-radius:50%;background:' + esc(d.color||'#94a3b8') + '"></div>';
          resultHtml += '<strong style="font-size:13px">' + esc(d.name) + '</strong></div>';
          resultHtml += '<div class="fx g2 ic"><span class="bdg ' + bc + '">' + esc(lbl) + '</span><span class="tm tsm">' + score + ' pts</span></div></div>';
          resultHtml += '<div class="sbb"><div class="sbf" style="width:' + pct + '%;background:' + esc(d.color||'#94a3b8') + '"></div></div>';
          if (rank.recommendation) resultHtml += '<p class="tsm tm mt2">' + esc(rank.recommendation) + '</p>';
          resultHtml += '</div>';
        });
        resultHtml += '</div>';
      });
      resultHtml += '</div>';
    }
  }

  return '<div class="content">'
    + '<div class="ph" style="margin-bottom:16px">'
    + '<div><h2>Test Score Simulator</h2><p class="tm tsm mt1">Enter raw dimension scores and preview how formulas classify them.</p></div>'
    + '<div class="fx g2"><button class="btn bs" onclick="fillTestZero()"><i class="ti ti-eraser"></i> Clear</button>'
    + '<button class="btn bp" onclick="runTestScores()"><i class="ti ti-player-play"></i> Run</button></div></div>'
    + '<div class="card" style="max-width:560px">' + inputsHtml + '</div>'
    + resultHtml
    + '</div>';
}

function runTestScores() {
  var dims = gDs().filter(function(d){ return !d.name.startsWith('Spectrum — '); });
  var secs = gSecs();
  var scores = {};
  dims.forEach(function(d){
    var el = document.getElementById('ts-' + d.id);
    var val = el ? Number(el.value)||0 : (S._test[d.id]||0);
    scores[d.id] = val;
    S._test[d.id] = val;
  });
  var ranks = getRanks(dims, scores);
  secs.forEach(function(sec){
    var formula = sec.classificationFormula || 'ranges';
    var fl = sec.formulaLabels || {};
    var secDims = dims.filter(function(d){ return (sec.activeDimIds||[]).includes(d.id); });
    if (!secDims.length) return;
    // If formulaTiers defined, they take priority — skip built-in formulas
    if (fl.formulaTiers && fl.formulaTiers.length) return;
    if (formula === 'pt_delta') {
      var PT_MAX = {Adventurer:28};
      var pcts = {};
      secDims.forEach(function(d){ pcts[d.id] = (scores[d.id]||0)/(PT_MAX[d.name]||32)*100; });
      var maxPct = Math.max.apply(null, Object.values(pcts));
      var delta=fl.delta1!=null?fl.delta1:1.5, t2=fl.delta2!=null?fl.delta2:65, t3=fl.delta3!=null?fl.delta3:37;
      secDims.forEach(function(d){
        var pct=pcts[d.id], label=null, desc='', rec='';
        if (pct >= maxPct-delta)      { label=fl.tier1||'Personality Type'; desc='Core expression of who you are'; rec='Own this type fully.'; }
        else if (pct >= t2)           { label=fl.tier2||'Highly Impacting Type'; desc='Significantly shapes behavior'; rec='Lean into this type where it serves you.'; }
        else if (pct >= t3)           { label=fl.tier3||'Secondary Type'; desc='Background influence'; rec='Notice when this activates.'; }
        ranks[d.id] = label ? {label:label,description:desc,recommendation:rec} : {label:'N/A',description:'',recommendation:''};
      });
    } else if (formula === 'relative_max') {
      var raw = {};
      secDims.forEach(function(d){ raw[d.id]=scores[d.id]||0; });
      var mx = Math.max.apply(null, Object.values(raw).concat([0]));
      var rdelta=fl.delta1!=null?fl.delta1:4, floor=(fl.delta2!=null?fl.delta2:40)/100;
      var sig=mx*floor;
      var belowMx=Object.values(raw).filter(function(v){ return v<mx&&v>sig; });
      var secMax=belowMx.length?Math.max.apply(null,belowMx):-1;
      secDims.forEach(function(d){
        var s=raw[d.id], label=null;
        if (s>=mx-rdelta) label=fl.tier1||'Primary';
        else if (secMax>-1&&s>=secMax-rdelta&&s<mx-rdelta) label=fl.tier2||'Secondary';
        ranks[d.id]=label?{label:label,description:label+' '+d.name,recommendation:label===(fl.tier1||'Primary')?'Your dominant pattern.':'Secondary pattern.'}:{label:'N/A',description:'',recommendation:''};
      });
    }
  });
  // Pre-compute max possible score per dim — use stored maxScore first
  var _qs = orderedQs();
  var dimMaxes = {};
  dims.forEach(function(d){
    if (d.maxScore && d.maxScore > 0) { dimMaxes[d.id] = d.maxScore; return; }
    var mx = mxSc(_qs, d.id);
    if (mx > 0) { dimMaxes[d.id] = mx; return; }
    if (d.ranges && d.ranges.length) {
      var rMax = Math.max.apply(null, d.ranges.map(function(r){ return r.max||0; }));
      if (rMax > 0) { dimMaxes[d.id] = rMax; return; }
    }
    dimMaxes[d.id] = 100;
  });
  var _inv = dims.find(function(d){ return d.name==='Innovator'; });

  // Apply formulaTiers (user-written expressions) — highest priority
  secs.forEach(function(sec){
    var fl = sec.formulaLabels || {};
    var formulaTiers = fl.formulaTiers;
    if (!formulaTiers || !formulaTiers.length) return;
    var secDims = dims.filter(function(d){ return (sec.activeDimIds||[]).includes(d.id); });
    var matched = {};
    formulaTiers.forEach(function(tier){
      if (!tier.formula || !tier.label) return;
      secDims.forEach(function(d){
        if (matched[d.id]) return;
        var result = evalFormula(tier.formula, d.id, scores, secDims, dimMaxes);
        if (result) {
          ranks[d.id] = {label:tier.label, description:tier.description||'', recommendation:tier.recommendation||''};
          matched[d.id] = true;
        }
      });
    });
  });

  // Apply static tiers from formulaLabels if defined
  secs.forEach(function(sec){
    var formula = sec.classificationFormula || 'ranges';
    if (formula !== 'ranges') return;
    var fl = sec.formulaLabels || {};
    var staticTiers = fl.staticTiers;
    if (!staticTiers || !staticTiers.length) return;
    var secDims = dims.filter(function(d){ return (sec.activeDimIds||[]).includes(d.id); });
    secDims.forEach(function(d){
      var s = scores[d.id]||0;
      var ranges = (d.ranges||[]).slice().sort(function(a,b){ return a.min-b.min; });
      var rIdx = ranges.findIndex(function(r){ return s>=r.min&&s<=r.max; });
      if (rIdx<0) rIdx = s<(ranges[0]&&ranges[0].min||0)?0:ranges.length-1;
      var tier = staticTiers[rIdx];
      if (tier&&tier.label) ranks[d.id]={label:tier.label,description:tier.description||'',recommendation:tier.recommendation||''};
    });
  });
  S._testResults = {scores:scores, ranks:ranks};
  render();
}

function fillTestZero() {
  var dims = gDs().filter(function(d){ return !d.name.startsWith('Spectrum — '); });
  dims.forEach(function(d){ S._test[d.id]=0; });
  S._testResults = null;
  render();
}

// ═══════════════════════════════════════════════════════════════════
// FORMULA ENGINE
// Evaluates user-written expressions per dimension
// Variables: <DimName> = raw score, <self> = current dim score
// Functions: Max(...), Min(...), Avg(...), Sum(...), Pct(<DimName>)
// Operators: >, <, >=, <=, =, +, -, *, /
// If formula starts with operator, <self> is prepended automatically
// ═══════════════════════════════════════════════════════════════════
function evalFormula(formula, dimId, scores, dims, dimMaxes) {
  if (!formula || !formula.trim()) return false;
  var expr = formula.trim();
  var selfScore = scores[dimId] || 0;

  // Build score lookup by name
  var byName = {};
  dims.forEach(function(d) { byName[d.name] = scores[d.id] || 0; });


  // Current dim max — use computed max from questions if available, else ranges, else 100
  var dimObj = dims.find(function(d){ return d.id===dimId; });
  var dimMax = (dimMaxes && dimMaxes[dimId]) ||
    (dimObj && dimObj.ranges && dimObj.ranges.length
      ? Math.max.apply(null, dimObj.ranges.map(function(r){ return r.max||0; })) : 100);

  // Pct(<DimName>) — each referenced dim uses its OWN max from question scoring
  dims.forEach(function(d) {
    var dMax = (dimMaxes && dimMaxes[d.id]) ||
      (d.ranges && d.ranges.length
        ? Math.max.apply(null, d.ranges.map(function(r){ return r.max||0; })) : 100);
    var sc = scores[d.id] || 0;
    var rePct = new RegExp('Pct\\(<' + d.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '>\\)', 'gi');
    expr = expr.replace(rePct, '(' + sc + '/' + dMax + '*100)');
  });
  // Pct(<self>) uses current dim max
  expr = expr.replace(/Pct\(<self>\)/gi, '(' + selfScore + '/' + dimMax + '*100)');
  // Any remaining Pct(expr)
  expr = expr.replace(/Pct\(([^)]+)\)/gi, function(_, inner) {
    return '(' + inner + '/' + dimMax + '*100)';
  });

  // Replace remaining <DimName> raw score references (after Pct substitution)
  dims.forEach(function(d) {
    var re = new RegExp('<' + d.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '>', 'gi');
    expr = expr.replace(re, String(scores[d.id] || 0));
  });
  expr = expr.replace(/<self>/gi, String(selfScore));

  // AND / OR support
  expr = expr.replace(/\bAND\b/gi, '&&').replace(/\bOR\b/gi, '||');

  expr = expr.replace(/\bMax\(/gi, 'Math.max(');
  expr = expr.replace(/\bMin\(/gi, 'Math.min(');
  expr = expr.replace(/\bAvg\(/gi, '__avg(');
  expr = expr.replace(/\bSum\(/gi, '__sum(');
  expr = expr.replace(/\bAbs\(/gi, 'Math.abs(');
  expr = expr.replace(/\bCount\(/gi, '__count(');
  expr = expr.replace(/\bCountMax\(/gi, '__countMax(');
  expr = expr.replace(/\bCountMin\(/gi, '__countMin(');

  // Implicit <self>: if expr starts with comparison operator, prepend self score
  if (/^\s*[><!=]/.test(expr)) {
    expr = selfScore + ' ' + expr;
  }

  // = not preceded by > < ! = → convert to ==
  expr = expr.replace(/([^><!=])=([^>=])/g, '$1==$2');

  try {
    var fn = new Function('__avg','__sum','__count','__countMax','__countMin','return (' + expr + ')');
    var result = fn(
      function() { var a=Array.from(arguments); return a.reduce(function(s,v){return s+v;},0)/a.length; },
      function() { var a=Array.from(arguments); return a.reduce(function(s,v){return s+v;},0); },
      function() { var a=Array.from(arguments); return a.filter(function(v){return v!==0;}).length; },
      function() { var a=Array.from(arguments); var mx=Math.max.apply(null,a); return a.filter(function(v){return v===mx;}).length; },
      function() { var a=Array.from(arguments); var mn=Math.min.apply(null,a); return a.filter(function(v){return v===mn;}).length; }
    );
    return Boolean(result);
  } catch(e) {
    return false;
  }
}

  });

  html += '</div>';
  return html;
}

function svAllFormulas() {
  var secs = gSecs();
  var aId = S.asmId;
  if (!aId) return;
  var errs = [];
  var saves = secs.map(function(sec){
    if (!db.sections[aId]) db.sections[aId] = [];
    var i = db.sections[aId].findIndex(function(s){ return s.id===sec.id; });
    if (i>=0) db.sections[aId][i]=sec;
    var payload = secToDb(sec, aId);
    console.log('[svAllFormulas] saving section:', sec.title, 'formula_labels:', JSON.stringify(payload.formula_labels));
    return sbUpsert('ab_sections', payload).catch(function(e){
      errs.push(sec.title + ': ' + e.message);
      console.error('[svAllFormulas] error saving', sec.title, e);
    });
  });
  Promise.all(saves).then(function(){
    sv();
    if (errs.length) toast('Save errors: ' + errs.join(' | '), 'err');
    else toast('Formulas saved!');
  }).catch(function(e){ toast('Save error: '+e.message,'err'); });
}






/* ══ CSV PARSER ══ */
function parseCSV(text){
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
  if(!lines.length)return[];
  const headers=parseCSVRow(lines[0]);
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals=parseCSVRow(line);
    return Object.fromEntries(headers.map((h,i)=>[h.trim(),(vals[i]||'').trim()]));
  });
}
function parseCSVRow(line){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(ch===','&&!inQ){result.push(cur);cur='';}
    else cur+=ch;
  }
  result.push(cur);return result;
}
function csvQ(v){
  const s=String(v??'');
  return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s;
}
function dlFile(content,filename,mime='text/plain'){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

  });
  return{

    questions:sortedQs.map(q=>({

      ...((q.options||[]).length?{options:(q.options||[]).map(o=>({text:o.text,scores:Object.fromEntries(Object.entries(o.scores||{}).map(([k,v])=>[dimIdToName[k]||k,v]))}))}:{}),

/* ══ JSON IMPORT ══ */
async function importJSONObj(obj){
  const id=uid();
  const a=obj.assessment||{};
  const dimNameToId={};
  const dims=(obj.dimensions||[]).map((d,i)=>{
    const newId=uid();dimNameToId[d.name]=newId;
    return{id:newId,aId:id,name:d.name,description:d.description||'',color:d.color||'#3b82f6',orderIndex:i,ranges:(d.ranges||[]).map(r=>({id:uid(),...r}))};
  });
  const secNameToId={};
  const secs=(obj.sections||[]).map((s,i)=>{
    const newId=uid();secNameToId[s.title]=newId;
    return{id:newId,aId:id,title:s.title,description:s.description||'',orderIndex:s.orderIndex??i,
      activeDimIds:(()=>{
          // Support both formats:
          // - activeDimensions: ['DimName', ...] (names, preferred)
          // - activeDimIds: ['uuid', ...] (old format with UUIDs — remap if possible, else all)
          if(s.activeDimensions&&s.activeDimensions.length){
            return s.activeDimensions.map(n=>dimNameToId[n]).filter(Boolean);
          }
          if(s.activeDimIds&&s.activeDimIds.length){
            // Try mapping old UUIDs via name lookup — won't work but gives us all as fallback
            const mapped = dims.map(d=>d.id); // default: all dims
            return mapped;
          }
          return dims.map(d=>d.id); // no activeDimIds at all — use all
        })(),
      classificationFormula:s.classificationFormula||'ranges',
      formulaLabels:s.formulaLabels||{}};
  });
  const qs=(obj.questions||[]).map((q,i)=>({
    id:uid(),aId:id,sectionId:q.section?secNameToId[q.section]||null:null,
    type:q.type||'multiple_choice',title:q.title||'',description:q.description||'',
    required:q.required!==false,orderIndex:q.orderIndex??i,
    positionWeights:q.positionWeights||[],
    contactFields:(q.contactFields||[]).map(f=>({id:uid(),...f})),
    options:(q.options||[]).map(o=>({id:uid(),text:o.text||'',scores:Object.fromEntries(Object.entries(o.scores||{}).map(([n,v])=>[dimNameToId[n]||n,v]))})),
  }));
    // Compute maxScore per dim from questions (IDs guaranteed consistent here)
  dims.forEach(function(d){
    var mx=0;
    qs.forEach(function(q){
      if(q.type==='ranking'){var mxW=q.positionWeights&&q.positionWeights.length?Math.max.apply(null,q.positionWeights):1;(q.options||[]).forEach(function(o){var s=Number((o.scores||{})[d.id]||0);if(s>0)mx+=s*mxW;});}
      else if(q.type==='multiple_choice'){var sc=(q.options||[]).map(function(o){return Number((o.scores||{})[d.id]||0);});if(sc.length)mx+=Math.max.apply(null,[0].concat(sc));}
    });
    d.maxScore=mx||null;
  });
  db.assessments.push({id,title:a.title||'Imported Assessment',description:a.description||'',status:a.status||'draft',showResults:a.showResults!==false,allowRetakes:a.allowRetakes!==false,brand:obj.brand||{...DB0},webhookUrl:obj.webhookUrl||'',webhookHeaders:obj.webhookHeaders||'{"Content-Type":"application/json"}',createdAt:now(),folder_id:S.folderId&&S.folderId!=="__none__"?S.folderId:null,project_id:S.projectId||null});
  db.questions[id]=qs;db.dimensions[id]=dims;
  if(!db.sections)db.sections={};db.sections[id]=secs;db.responses[id]=[];
  // Sync immediately to Supabase (don't wait for sv() which only syncs S.asmId)
  if(_session&&_tenantId){
    const syncErrs = await syncAsm(id, true); // silent=true, we handle errors in import modal
    if(syncErrs && syncErrs.length){
      throw new Error('Sync failed: '+syncErrs.join('; '));
    }
  }
  return id;
}

  const txt=document.getElementById('json-paste')?.value?.trim();
  if(!txt){toast('Paste JSON first','err');return;}
  try{

function doExportQsCSV(asmId){
  const dims=(db.dimensions[asmId]||[]).sort((a,b)=>a.orderIndex-b.orderIndex);
  const secs=((db.sections||{})[asmId]||[]).sort((a,b)=>a.orderIndex-b.orderIndex);
  const secOrder=Object.fromEntries(secs.map((s,i)=>[s.id,i]));
  const secIdToTitle=Object.fromEntries(secs.map(s=>[s.id,s.title]));
  const dimIdToName=Object.fromEntries(dims.map(d=>[d.id,d.name]));
  const sortedQs=[...(db.questions[asmId]||[])].sort((a,b)=>{
    const si=(a.sectionId!=null?secOrder[a.sectionId]:9999)??9999;
    const sj=(b.sectionId!=null?secOrder[b.sectionId]:9999)??9999;
    if(si!==sj)return si-sj;
    return(a.orderIndex||0)-(b.orderIndex||0);
  });
  if(!sortedQs.length){toast('No questions to export','err');return;}
  const dimNames=dims.map(d=>d.name);
  const headers=['section','type','title','description','required','position_weights','option_text',...dimNames];
  const rows=[headers];
  sortedQs.forEach(q=>{
    const sec=q.sectionId?secIdToTitle[q.sectionId]||'':'';
    const pw=q.positionWeights?.length?q.positionWeights.join('|'):'';
    if(!q.options||!q.options.length){
      rows.push([sec,q.type,q.title,q.description||'',q.required?'true':'false',pw,'',...dimNames.map(()=>'')]);
    }else{
      q.options.forEach(opt=>{
        const scores=dims.map(d=>String(opt.scores?.[d.id]??''));
        rows.push([sec,q.type,q.title,q.description||'',q.required?'true':'false',pw,opt.text,...scores]);
      });
    }
  });
  const asm=db.assessments.find(a=>a.id===asmId);
  const fn=(asm?.title||'assessment').replace(/[^a-z0-9]/gi,'-').toLowerCase()+'-questions.csv';
  dlFile(rows.map(r=>r.map(csvQ).join(',')).join('\n'),fn,'text/csv');
}

/* ══ CSV IMPORT ══ */
function handleDimsCSVFile(input,asmId){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>importDimsCSV(e.target.result,asmId);

}
function importDimsCSV(text,asmId){
  const rows=parseCSV(text);if(!rows.length){toast('No data in CSV','err');return;}
  if(!db.dimensions[asmId])db.dimensions[asmId]=[];
  const existing=db.dimensions[asmId];
  const existingNames=new Set(existing.map(d=>d.name.toLowerCase()));
  const groups={};const order=[];
  rows.forEach(row=>{
    const name=(row.name||row.Name||'').trim();if(!name)return;
    const key=name.toLowerCase();
    if(!groups[key]){groups[key]={name,description:row.description||'',color:row.color||'#3b82f6',ranges:[]};order.push(key);}
    const mn=Number(row.range_min);const mx=Number(row.range_max);
    if(!isNaN(mn)&&!isNaN(mx)&&row.range_label){
      groups[key].ranges.push({id:uid(),min:mn,max:mx,label:row.range_label||'',description:row.range_description||'',recommendation:row.range_recommendation||''});
    }
  });
  let added=0,updated=0;
  order.forEach(key=>{
    const g=groups[key];const g_name_lower=g.name.toLowerCase();
    const ex=existing.find(d=>d.name.toLowerCase()===g_name_lower);
    if(ex){
      // Merge ranges
      g.ranges.forEach(r=>{if(!ex.ranges.find(er=>er.label===r.label))ex.ranges.push(r);});
      updated++;
    }else{
      existing.push({id:uid(),aId:asmId,name:g.name,description:g.description,color:g.color,orderIndex:existing.length,ranges:g.ranges});
      added++;
    }
  });
  sv();toast(`Dimensions: ${added} added, ${updated} updated`);render();
}
function handleQsCSVFile(input,asmId){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>importQsCSV(e.target.result,asmId);
  reader.readAsText(file);
}
function importQsCSV(text,asmId){
  const rows=parseCSV(text);if(!rows.length){toast('No data in CSV','err');return;}
  const fixed=['section','type','title','description','required','position_weights','option_text'];
  const allKeys=Object.keys(rows[0]);
  const dimCols=allKeys.filter(h=>!fixed.includes(h.toLowerCase().trim()));
  const dims=db.dimensions[asmId]||[];
  const secs=((db.sections||{})[asmId]||[]);
  const dimColToId={};
  dimCols.forEach(col=>{const m=dims.find(d=>d.name.toLowerCase()===col.toLowerCase().trim());if(m)dimColToId[col]=m.id;});
  const secTitleToId=Object.fromEntries(secs.map(s=>[s.title.toLowerCase(),s.id]));
  const groups={};const groupOrder=[];
  // Track last known question context for continuation rows
  let lastKey='';
  rows.forEach(row=>{
    const rawTitle=(row.title||'').trim();
    const rawType=(row.type||'').trim();
    const rawSec=(row.section||'').trim();
    // If title+type are blank, it's a continuation of the last question
    const key=rawTitle&&rawType?`${rawSec}|||${rawTitle}|||${rawType}`:lastKey;
    if(!key)return;
    if(!groups[key]){
      groups[key]={section:rawSec||groups[lastKey]?.section||'',type:rawType||'multiple_choice',title:rawTitle,description:row.description||'',required:(row.required||'true').toLowerCase()!=='false',positionWeights:row.position_weights||'',options:[]};
      groupOrder.push(key);
    }
    lastKey=key;
    const optText=(row.option_text||'').trim();
    if(optText){
      const scores={};
      dimCols.forEach(col=>{if(dimColToId[col]&&row[col]!=='')scores[dimColToId[col]]=Number(row[col])||0;});
      groups[key].options.push({id:uid(),text:optText,scores});
    }
  });
  if(!db.questions[asmId])db.questions[asmId]=[];
  const existing=db.questions[asmId];
  let added=0;
  groupOrder.forEach((key,i)=>{
    const g=groups[key];
    const secId=g.section?secTitleToId[g.section.toLowerCase()]||null:null;
    const weights=g.positionWeights?g.positionWeights.split('|').map(Number).filter(n=>!isNaN(n)):[];
    existing.push({id:uid(),aId:asmId,sectionId:secId,type:g.type,title:g.title,description:g.description,required:g.required,orderIndex:existing.length,positionWeights:weights,contactFields:[],options:g.options});
    added++;
  });
  sv();toast(`Imported ${added} question${added!==1?'s':''} \u2713`);render();
}

      _userEmail=session.user.email||'';

      _userId=session.user.id||null;
      try{

        await loadAll();

      }catch(e){
        console.error('App load error:',e);
        document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:system-ui,sans-serif;color:#64748b;text-align:center;padding:40px">
          <i class="ti ti-alert-circle" style="font-size:40px;color:#ef4444"></i>
          <h2 style="color:#1e293b;font-size:18px">Failed to load</h2>
          <p style="font-size:14px">${e.message}</p>
          <button onclick="location.reload()" style="margin-top:8px;padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">Retry</button>
        </div>`;
      }
    }else if(event==='SIGNED_OUT'||(!session&&event==='INITIAL_SESSION')){
      _session=null;_tenantId=null;
      document.getElementById('app').innerHTML=rLogin();
    }
  });
  // Also check for existing session on page load (handles refresh)
  const{data:{session}}=await _sb.auth.getSession();
  if(session){
    _session=session;
    _userEmail=session.user.email||'';
    _userName=session.user.user_metadata?.full_name||session.user.user_metadata?.name||_userEmail;
    try{
      _tenantId=await ensureTenant();
      showLoading();
      await loadAll();
      render();
    }catch(e){
      console.error('Initial load error:',e);
      document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:system-ui,sans-serif;color:#64748b;text-align:center;padding:40px"><i class="ti ti-alert-circle" style="font-size:40px;color:#ef4444"></i><h2 style="color:#1e293b;font-size:18px">Failed to load</h2><p style="font-size:14px;max-width:400px">${e.message}</p><button onclick="location.reload()" style="margin-top:8px;padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit">Reload</button></div>`;

async function sbDelete(table, query) {

// ═══════════════════════════════════════════════════
// VARIANTS — clone a source assessment (dimensions, formulas, brand,
// webhook) and swap in a new question set from a JSON file. Used to build
// Personal / Young Adult versions that share everything with Business
// except the questions.
// ═══════════════════════════════════════════════════

// Pick the best source to inherit from: an assessment whose dimension NAME
// set is identical to the import's. Prefer a "VitalSpark … Business" title.
function matchSourceForImport(obj){
  const names=new Set((obj.dimensions||[]).map(d=>d.name));
  if(!names.size) return null;
  const cands=db.assessments.filter(a=>{
    const dn=(db.dimensions[a.id]||[]).map(d=>d.name);
    return dn.length===names.size && dn.every(n=>names.has(n));
  });
  return cands.find(a=>/vitalspark/i.test(a.title)&&/business/i.test(a.title))
      || cands.find(a=>/business/i.test(a.title))
      || cands[0] || null;
}

// Clone `sourceId`, keep everything, replace questions with obj.questions.
async function buildVariantFromImport(sourceId, obj, opts={}){
  const src=db.assessments.find(a=>a.id===sourceId);
  if(!src) throw new Error('source not found');
  const newId=uid();
  const srcDims=db.dimensions[sourceId]||[];
  const srcSecs=(db.sections||{})[sourceId]||[];
  // Clone dimensions (keep ranges/labels/recommendations); remap by name
  const dimNameToId={}, oldDimIdToName={};
  const dims=srcDims.map(d=>{ const nid=uid(); dimNameToId[d.name]=nid; oldDimIdToName[d.id]=d.name;
    return {...d, id:nid, aId:newId, ranges:(d.ranges||[]).map(r=>({...r,id:uid()}))}; });
  // Clone sections (keep classification formula + tuned formulaLabels); map by title
  const secTitleToId={};
  const secs=srcSecs.map(s=>{ const nid=uid(); secTitleToId[s.title]=nid;
    return {...s, id:nid, aId:newId,
      activeDimIds:(s.activeDimIds||[]).map(x=>dimNameToId[oldDimIdToName[x]]).filter(Boolean),
      formulaLabels:JSON.parse(JSON.stringify(s.formulaLabels||{}))}; });
  const firstSecId=secs[0]?.id||null;
  // Build new questions from the import (scores keyed by dim NAME → new dim id)
  const qs=(obj.questions||[]).map((q,i)=>({
    id:uid(), aId:newId,
    sectionId: q.section ? (secTitleToId[q.section]||firstSecId) : firstSecId,
    type:q.type||'multiple_choice', title:q.title||'', description:q.description||'',
    required:q.required!==false, orderIndex:q.orderIndex??i,
    positionWeights:q.positionWeights||[],
    contactFields:(q.contactFields||[]).map(f=>({id:uid(),...f})),
    options:(q.options||[]).map(o=>({id:uid(), text:o.text||'',
      scores:Object.fromEntries(Object.entries(o.scores||{}).map(([n,v])=>[dimNameToId[n]||n, v]))})),
  }));
  // Recompute maxScore per dim from the NEW questions (keeps % formulas correct)
  dims.forEach(d=>{ let mx=0; qs.forEach(q=>{
      if(q.type==='ranking'){ const mxW=q.positionWeights&&q.positionWeights.length?Math.max(...q.positionWeights):1;
        (q.options||[]).forEach(o=>{ const s=Number((o.scores||{})[d.id]||0); if(s>0) mx+=s*mxW; }); }
      else if(q.type==='multiple_choice'){ const sc=(q.options||[]).map(o=>Number((o.scores||{})[d.id]||0)); if(sc.length) mx+=Math.max(0,...sc); }
    }); d.maxScore=mx||null; });
  const asm={ id:newId,
    title: opts.title || obj.assessment?.title || src.title,
    description: (obj.assessment&&obj.assessment.description) || src.description || '',
    status:'draft',
    brand: JSON.parse(JSON.stringify(src.brand||{})),
    webhookUrl: src.webhookUrl||'', webhookHeaders: src.webhookHeaders||'{"Content-Type":"application/json"}',
    showResults: src.showResults!==false, allowRetakes: src.allowRetakes!==false,
    createdAt: now(), folder_id: opts.folderId!==undefined?opts.folderId:null, project_id: S.projectId||null };
  db.assessments.push(asm); db.questions[newId]=qs; db.dimensions[newId]=dims;
  if(!db.sections) db.sections={}; db.sections[newId]=secs; db.responses[newId]=[];
  if(_session&&_tenantId){ const errs=await syncAsm(newId,true); if(errs&&errs.length) throw new Error(errs.join('; ')); }
  return newId;
}

// File picker → parse → auto-match sources → open the review modal
function pickVariantFiles(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json'; inp.multiple=true;
  inp.onchange=async function(){
    const files=[...inp.files]; if(!files.length) return;
    const rows=[];
    for(const file of files){
      try{
        const obj=JSON.parse(await file.text());
        const match=matchSourceForImport(obj);
        rows.push({ name:file.name, obj, sourceId:match?match.id:'',
          title:(obj.assessment&&obj.assessment.title)||file.name.replace(/\.json$/i,''),
          dimCount:(obj.dimensions||[]).length, qCount:(obj.questions||[]).length, error:null });
      }catch(e){ rows.push({ name:file.name, obj:null, sourceId:'', title:file.name, error:e.message }); }
    }
    S.modal={ type:'variants', rows, folderMode:'new', newFolderName:'', folderId:'', running:false, progress:'' };
    render();
  };
  inp.click();
}

async function runVariants(){
  const m=S.modal; if(!m) return;
  const rows=m.rows.filter(r=>r.obj && r.sourceId);
  if(!rows.length){ toast('Nothing to build — assign a source to each file','err'); return; }
  // Destination folder
  let folderId=null;
  if(m.folderMode==='new'){
    const fname=(m.newFolderName||'').trim();
    if(!fname){ toast('Name the destination folder','err'); return; }
    const f={id:uid(), name:fname, project_id:S.projectId||null, instance_id:getInstanceId(), owner_id:_userId, sort_order:db.folders.length, created_at:now()};
    try{ await sbUpsert('ab_folders',f); }catch(e){ toast('Folder save failed: '+e.message,'err'); return; }
    db.folders.push(f); folderId=f.id; svLocal();
  } else if(m.folderMode==='existing'){ folderId=m.folderId||null; }
  m.running=true; render();
  let ok=0; const errs=[];
  for(let i=0;i<rows.length;i++){
    m.progress=`Building ${i+1} of ${rows.length}: ${rows[i].title}`; render();
    try{ await buildVariantFromImport(rows[i].sourceId, rows[i].obj, {title:rows[i].title, folderId}); ok++; }
    catch(e){ errs.push(rows[i].title+': '+(e.message||e)); }
  }
  sv();
  S.modal=null; S.view='home'; if(folderId) S.folderId=folderId;
  render();
  toast(`Built ${ok} variant${ok!==1?'s':''}`+(errs.length?` · ${errs.length} failed`:''), errs.length?'err':'ok');
  if(errs.length) console.warn('Variant errors:', errs);
}

// Project reordering via drag-drop in sidebar
let _dragProjId = null;
function dProjStart(e, id) { _dragProjId = id; e.dataTransfer.effectAllowed = 'move'; }
function dProjOver(e, id)  { e.preventDefault(); }
function dProjDrop(e, id)  {
  e.preventDefault();
  if (!_dragProjId || _dragProjId === id) { _dragProjId=null; return; }
  const from = db.projects.findIndex(p=>p.id===_dragProjId);
  const to   = db.projects.findIndex(p=>p.id===id);
  if (from<0||to<0) { _dragProjId=null; return; }
  const [item] = db.projects.splice(from,1);
  db.projects.splice(to,0,item);
  _dragProjId=null; svLocal(); render();
}


// ═══════════════════════════════════════════════════════════════
// CHECKOUT / LOCK SYSTEM
// ═══════════════════════════════════════════════════════════════
let _lockToken    = null;
let _lockAsmId    = null;
let _heartbeatInt = null;
const LOCK_TTL_MIN = 15; // minutes before lock auto-expires

async function acquireLock(asmId) {
  if (_lockAsmId === asmId) return true; // already have it
  const token = uid();
  const now_  = new Date().toISOString();
  const exp   = new Date(Date.now() + LOCK_TTL_MIN * 60000).toISOString();
  const name  = _userName || _userEmail || 'Unknown';
  try {
    // Try to insert — will fail if locked by someone else whose lock hasn't expired
    const r = await fetch(`${SUPABASE_URL}/rest/v1/ab_locks`, {
      method: 'POST',
      headers: _hdrs({
        Prefer: 'resolution=merge-duplicates,return=representation',
        Accept: 'application/json'
      }),
      body: JSON.stringify({
        assessment_id: asmId, locked_by_id: _userId,
        locked_by_name: name, instance_id: getInstanceId(),
        lock_token: token, locked_at: now_, expires_at: exp
      })
    });
    if (!r.ok) {
      const err = await r.json().catch(()=>({}));
      throw new Error(err.message || 'Lock failed');
    }
    const rows = await r.json();
    const row  = Array.isArray(rows) ? rows[0] : rows;
    // Confirm WE hold the lock (merge-duplicates returns existing if conflict)
    if (row && row.locked_by_id !== _userId) {
      const since = row.locked_at ? new Date(row.locked_at).toLocaleString() : '?';
      const expdt = row.expires_at ? new Date(row.expires_at) : null;
      if (expdt && expdt > new Date()) {
        // Still locked by someone else
        return { lockedBy: row.locked_by_name || 'Another user', since, expires: expdt.toLocaleString() };
      }
      // Their lock expired — force-release and retry
      await sbDelete('ab_locks', `assessment_id=eq.${asmId}`).catch(()=>{});
      return acquireLock(asmId);
    }
    _lockToken = token;
    _lockAsmId = asmId;
    startHeartbeat(asmId);
    return true;
  } catch(e) {
    console.warn('acquireLock error:', e.message);
    return true; // fail open — don't block editing if lock system is unavailable
  }
}

async function startHeartbeat(asmId) {
  stopHeartbeat();
  _heartbeatInt = setInterval(async function() {
    if (!_lockToken || !_lockAsmId) return stopHeartbeat();
    const exp = new Date(Date.now() + LOCK_TTL_MIN * 60000).toISOString();
    await sbDelete('ab_locks', `assessment_id=eq.${asmId}&lock_token=eq.${_lockToken}`).catch(()=>{});
    // Re-acquire to refresh expiry
    const token = uid();
    const name  = _userName || _userEmail || 'Unknown';
    await fetch(`${SUPABASE_URL}/rest/v1/ab_locks`, {
      method: 'POST',
      headers: _hdrs({Prefer:'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify({
        assessment_id: asmId, locked_by_id: _userId, locked_by_name: name,
        instance_id: getInstanceId(), lock_token: token,
        locked_at: new Date().toISOString(), expires_at: exp
      })
    }).then(()=>{ _lockToken = token; }).catch(()=>{});
  }, 5 * 60 * 1000); // every 5 minutes
}

function stopHeartbeat() {
  if (_heartbeatInt) { clearInterval(_heartbeatInt); _heartbeatInt = null; }
}

async function releaseLock(asmId) {
  if (!asmId || !_lockToken) return;
  stopHeartbeat();
  await sbDelete('ab_locks', `assessment_id=eq.${asmId}&lock_token=eq.${_lockToken}`).catch(()=>{});
  _lockToken = null; _lockAsmId = null;
}

async function checkoutAsm(asmId) {
  const result = await acquireLock(asmId);
  if (result === true) return true; // got it
  if (result && result.lockedBy) {
    // Show who has it
    const proceed = confirm(
      `⚠️ This assessment is currently checked out by ${result.lockedBy}\n` +
      `Since: ${result.since}\n` +
      `Auto-releases: ${result.expires}\n\n` +
      `Force check out anyway? (Only do this if they're done editing)`
    );
    if (proceed) {
      await sbDelete('ab_locks', `assessment_id=eq.${asmId}`).catch(()=>{});
      return acquireLock(asmId);
    }
    return false;
  }
  return true; // fail open
}

// Release lock on tab/window close
window.addEventListener('beforeunload', function() {
  if (_lockAsmId && _lockToken) {
    // Synchronous beacon — most reliable for beforeunload
    const url = `${SUPABASE_URL}/rest/v1/ab_locks?assessment_id=eq.${_lockAsmId}&lock_token=eq.${_lockToken}`;
    navigator.sendBeacon(url, new Blob([JSON.stringify({_method:'DELETE'})], {type:'application/json'}));
    // Fallback fetch (may not complete)
    fetch(url, {method:'DELETE', headers:_hdrs(), keepalive:true}).catch(()=>{});
  }
});


function rImportProgressMod(){
  const {current,total,currentFile,errors}=S.modal;
  const pct=total>0?Math.round(current/total*100):0;
  return '<div class="mov" style="display:flex;align-items:center;justify-content:center">'
    +'<div style="background:#1e293b;border-radius:12px;padding:28px 32px;min-width:380px;max-width:480px">'
    +'<h3 style="font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:18px"><i class="ti ti-upload" style="color:#DDB84E"></i> Importing Assessments...</h3>'
    +'<div style="background:#0f172a;border-radius:6px;height:8px;margin-bottom:12px;overflow:hidden">'
    +'<div style="background:#DDB84E;height:100%;border-radius:6px;transition:width .3s;width:'+pct+'%"></div>'
    +'</div>'
    +'<div style="font-size:13px;color:#64748b;margin-bottom:8px">'+current+' of '+total+' files</div>'
    +(currentFile?'<div style="font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(currentFile)+'</div>':'')
    +(errors&&errors.length?'<div style="margin-top:12px;font-size:12px;color:#ef4444"><i class="ti ti-alert-circle"></i> '+errors.length+' error'+(errors.length!==1?'s':'')+' so far</div>':'')
    +'</div></div>';
}

function rImportResultMod(){
  const {ok,total,errors}=S.modal;
  const allGood=errors.length===0;
  return '<div class="mov" onclick="if(event.target===this){S.modal=null;render()}" style="display:flex;align-items:center;justify-content:center">'
    +'<div style="background:#1e293b;border-radius:12px;padding:28px 32px;min-width:380px;max-width:520px">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">'
    +'<i class="ti '+(allGood?'ti-circle-check" style="font-size:24px;color:#22c55e"':'ti-alert-circle" style="font-size:24px;color:#ef4444"')+' ></i>'
    +'<h3 style="font-size:16px;font-weight:700;color:#f1f5f9;margin:0">Import '+(allGood?'Complete':'Completed with Errors')+'</h3>'
    +'</div>'
    +'<div style="font-size:14px;color:#94a3b8;margin-bottom:16px">'
    +'<span style="color:#22c55e;font-weight:600">'+ok+'</span> of '+total+' imported successfully'
    +(errors.length?' &nbsp;·&nbsp; <span style="color:#ef4444;font-weight:600">'+errors.length+'</span> failed':'')
    +'</div>'
    +(errors.length?'<div style="background:#0f172a;border-radius:8px;padding:12px;max-height:240px;overflow-y:auto;margin-bottom:16px">'
      +errors.map(e=>'<div style="padding:8px 0;border-bottom:1px solid #1e293b;last-child:border:none">'
        +'<div style="font-size:12px;font-weight:600;color:#fbbf24;margin-bottom:3px">'+esc(e.file)+'</div>'
        +'<div style="font-size:12px;color:#ef4444;word-break:break-word">'+esc(e.error)+'</div>'
        +'</div>').join('')
      +'</div>':'')
    +'<button onclick="S.modal=null;render()" class="btn bp" style="width:100%;padding:10px">Done</button>'
    +'</div></div>';
}

</script>
