<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Builder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--primary:#2563eb;--ph:#1d4ed8;--ok:#059669;--err:#dc2626;--sb:#0f172a;--r:8px}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sb);color:#94a3b8;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:18px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:8px;color:#e2e8f0;font-weight:700;font-size:14px}
.sidebar-logo i{font-size:18px;color:var(--primary)}
.sidebar-nav{padding:10px;flex:1}
.si{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .12s,color .12s;margin-bottom:2px}
.si:hover,.si.on{background:rgba(255,255,255,.09);color:#e2e8f0}
.s-foot{padding:14px 16px;border-top:1px solid #1e293b;font-size:11px;color:#475569}
.main{flex:1;overflow:auto}
.content{padding:24px;max-width:1100px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.ph h1{font-size:20px;font-weight:700}
.ph-sub{font-size:13px;color:var(--muted);margin-top:3px}
.fx{display:flex}.ic{align-items:center}.jb{justify-content:space-between}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.f1{flex:1}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s;border:1px solid transparent;font-family:inherit;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bp{background:var(--primary);color:#fff;border-color:var(--primary)}.bp:hover:not(:disabled){background:var(--ph)}
.bs{background:transparent;color:var(--text);border-color:var(--border)}.bs:hover:not(:disabled){background:var(--bg)}
.bg{background:transparent;color:var(--muted);border-color:transparent}.bg:hover:not(:disabled){background:var(--bg);color:var(--text)}
.bd{background:transparent;color:var(--err);border-color:transparent}.bd:hover:not(:disabled){background:#fef2f2}
.bsm{padding:4px 9px;font-size:12px}.bic{padding:5px 7px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.ctit{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .15s,box-shadow .15s;position:relative}
.acard:hover{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.07)}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bpub{background:#d1fae5;color:#065f46}.bdft{background:#f1f5f9;color:#475569}
.bbl{background:#dbeafe;color:#1e40af}.byw{background:#fef3c7;color:#92400e}.bpur{background:#ede9fe;color:#5b21b6}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color .12s,border-color .12s}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}.tab:hover:not(.on){color:var(--text)}
.fg{margin-bottom:14px}
.fg label,.fgl{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=tel],textarea,select{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:13.5px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:72px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--border);border-radius:2px;outline:none;border:none;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer}
input[type=color]{width:38px;height:36px;padding:2px;border:1px solid var(--border);border-radius:6px;cursor:pointer}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
/* SECTIONS */
.sec-wrap{margin-bottom:14px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bg);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sec-head:hover{background:#f1f5f9}
.sec-caret{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.sec-caret.open{transform:rotate(90deg)}
.sec-title{font-size:13.5px;font-weight:600;flex:1}
.sec-dimtags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dim-tag{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--border)}
.sec-body{padding:10px}
.sec-empty{text-align:center;padding:16px;color:var(--muted);font-size:13px}
.ungrouped{border:1px dashed var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ungrouped-head{padding:10px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg)}
/* QUESTION ITEMS */
.qi{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);margin-bottom:6px}
.qi-ico{width:28px;height:28px;border-radius:6px;background:#eff6ff;display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;font-size:14px}
.qi-inf{flex:1;min-width:0}
.qi-tit{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi-sub{font-size:11px;color:var(--muted)}
.qi-act{display:flex;gap:3px}
/* SCORE ROWS (option dimension scoring) */
.score-row{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--bg);border-radius:7px;margin-bottom:5px}
.score-row select{flex:1;min-width:0;font-size:13px;padding:5px 8px}
.score-row input[type=number]{width:70px;flex-shrink:0;font-size:13px;padding:5px 8px;text-align:center}
/* POSITION WEIGHTS */
.pw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.pw-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.pw-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.pw-item input{text-align:center;font-size:16px;font-weight:700;border:none;background:transparent;padding:2px;outline:none;color:var(--primary)}
/* OPTION BLOCK */
.opt-block{border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px;background:var(--surface)}
.opt-block-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.opt-block-num{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
.rrow{display:grid;grid-template-columns:68px 68px 110px 1fr 1fr auto;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px}
.rrow .fg{margin-bottom:0}
.cfr{display:flex;gap:7px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;background:var(--bg)}
.cfr input{flex:2}.cfr select{flex:1}
.ib{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:13px;color:#1e40af;margin-bottom:14px;display:flex;align-items:flex-start;gap:7px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.slbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.sval{font-size:24px;font-weight:700}.sval.grn{color:var(--ok)}.sval.red{color:var(--err)}
.tw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:none;user-select:none}
.tw input{display:none}
.tt{width:36px;height:20px;background:#cbd5e1;border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.tw input:checked+.tt{background:var(--primary)}
.tk{position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tw input:checked+.tt .tk{left:19px}
.tm{color:var(--muted)}.tsm{font-size:12.5px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty i{font-size:38px;margin-bottom:12px;display:block;color:#cbd5e1}
/* dim checkboxes in section modal */
.dim-checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px}
.dc-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .1s}
.dc-item:hover{background:var(--bg)}
.dc-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
.dc-label{font-size:13px;font-weight:500}
.dc-sub{font-size:11px;color:var(--muted)}
/* Modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:1000;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:680px;max-width:98vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mw{width:960px}
.mhd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mhd h2{font-size:15px;font-weight:600}
.mbd{padding:20px;overflow-y:auto;max-height:74vh}
.mft{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
/* Take */
.tw-wrap{min-height:100vh;display:flex;flex-direction:column}
.tw-bar{flex-shrink:0}
.tw-prog{height:4px;border-radius:2px;overflow:hidden}
.tw-pf{height:100%;border-radius:2px;transition:width .35s}
.tw-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:44px 20px}
.qcard{border-radius:14px;padding:36px;max-width:640px;width:100%}
.opt-btn{width:100%;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .12s;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1.5px solid;outline:none}
.opt-c{width:18px;height:18px;border-radius:50%;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt-ck{width:18px;height:18px;border-radius:4px;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.tw-nav{flex-shrink:0;padding:14px 24px}
.tw-ni{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;background:transparent;border:none;font-size:14px;cursor:pointer;font-family:inherit;border-radius:8px}
.tg:disabled{opacity:.35;cursor:not-allowed}.tg:hover:not(:disabled){background:rgba(0,0,0,.06)}
.tp{display:inline-flex;align-items:center;gap:5px;padding:10px 22px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff}
.tp:hover{opacity:.88}.tp:disabled{opacity:.45;cursor:not-allowed}
.pdots{display:flex;gap:5px;align-items:center}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid;border-radius:12px;cursor:grab;transition:all .15s;user-select:none;-webkit-user-select:none}
.rank-item:active{cursor:grabbing}
.rank-item.drag-over{border-style:dashed;opacity:.65}
.rank-item.dragging{opacity:.3}
.rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.rank-hdl{font-size:18px;opacity:.35;flex-shrink:0;line-height:1;pointer-events:none}
.rank-txt{flex:1;font-size:14px;font-weight:500;pointer-events:none}
.rank-arr{display:flex;flex-direction:column;gap:1px;pointer-events:none}
.rarr{background:none;border:none;cursor:pointer;padding:2px 4px;line-height:1;border-radius:3px;color:inherit;opacity:.5;font-size:13px;pointer-events:all}
.rarr:hover:not(:disabled){background:rgba(0,0,0,.08);opacity:1}
.rarr:disabled{opacity:.15;cursor:default}
.cw{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px}
.ci{max-width:660px;width:100%}
.dr{border-radius:12px;padding:20px;margin-bottom:10px;border:1px solid var(--border);background:var(--surface)}
.sbb{height:7px;background:var(--border);border-radius:4px;margin:8px 0 5px;overflow:hidden}
.sbf{height:100%;border-radius:4px;transition:width .7s}
.bpb{border:1px solid var(--border);border-radius:10px;overflow:hidden;position:sticky;top:20px}
.sw{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color .1s;display:inline-block}
.sw:hover,.sw.sl{border-color:#1e293b}
.swr{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;top:16px;right:16px;z-index:9999;padding:11px 15px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px rgba(0,0,0,.14);animation:ts .2s ease}
.tok{background:#022c22;color:#34d399}.terr{background:#450a0a;color:#f87171}.tinf{background:#1e3a5f;color:#93c5fd}
@keyframes ts{from{transform:translateX(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sp{animation:spin .7s linear infinite;display:inline-block}
@media(max-width:768px){.sgrid{grid-template-columns:1fr 1fr}.rrow{grid-template-columns:1fr 1fr 1fr}}

/* ── PROJECTS ─────────────────────────────────────── */
.pj-item {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 8px; border-radius: 6px;
  font-size: 13px; color: #94a3b8;
  cursor: pointer; transition: background .15s;
  margin-bottom: 2px; position: relative;
}
.pj-item:hover { background: #1e293b; color: #e2e8f0; }
.pj-item.on { background: #1e3a5f; color: #60a5fa; font-weight: 600; }
.pj-item.drag-over { background: #1e3a5f !important; }
.pj-actions { display: none; gap: 2px; }
.pj-item:hover .pj-actions { display: flex; }
.pj-actions button { background: transparent; border: none; cursor: pointer; padding: 2px 3px; border-radius: 3px; font-size: 12px; color: inherit; }
.pj-actions button:hover { background: #334155; }

/* ── FOLDER BREADCRUMB ────────────────────────────── */
.fcrumb {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 20px;
  background: #1e293b; border: 1px solid #334155;
  color: #94a3b8; font-size: 12px; cursor: pointer;
  font-family: inherit; transition: all .15s;
}
.fcrumb:hover { background: #263548; color: #e2e8f0; }
.fcrumb.on { background: #1e3a5f; border-color: #3b82f6; color: #60a5fa; font-weight: 600; }
.fcrumb-count { background: #334155; border-radius: 10px; padding: 0 6px; font-size: 10px; }
.fcrumb.on .fcrumb-count { background: #2563eb; color: #fff; }
.fcrumb-del { opacity: 0; margin-left: 2px; font-size: 10px; }
.fcrumb:hover .fcrumb-del { opacity: 1; }

/* ── FOLDER CARDS ─────────────────────────────────── */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
.fcard {
  background: #1e293b; border: 2px solid #334155;
  border-radius: 10px; padding: 20px 16px;
  text-align: center; cursor: pointer;
  transition: all .15s; position: relative;
  min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.fcard:hover { border-color: #DDB84E; background: #263040; }
.fcard.drag-over { border-color: #DDB84E; background: #2a2000; }
.fcard-actions { display: none; position: absolute; top: 6px; right: 6px; gap: 3px; }
.fcard:hover .fcard-actions { display: flex; }
.fcard-actions button { background: #334155; border: none; border-radius: 4px; padding: 3px 5px; cursor: pointer; font-size: 12px; color: #94a3b8; }
.fcard-actions button:hover { background: #475569; color: #e2e8f0; }

/* ── ASSESSMENT DRAG ──────────────────────────────── */
.acard.drag-over { border-color: #DDB84E !important; }
.acard[draggable=true] { cursor: grab; }
.acard[draggable=true]:active { cursor: grabbing; opacity: .85; }

/* ── EMPTY STATE ──────────────────────────────────── */
.empty-state { text-align: center; padding: 60px 20px; }

/* ── FOLDER MODAL ─────────────────────────────────── */
.fmod { background: #1e293b; border-radius: 10px; padding: 24px; min-width: 320px; max-width: 400px; }
.fmod h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.fmod .folder-list { max-height: 280px; overflow-y: auto; }
.fmod .flist-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 7px;
  cursor: pointer; transition: background .12s; margin-bottom: 3px;
  font-size: 14px; border: 2px solid transparent;
}
.fmod .flist-item:hover { background: #263548; }
.fmod .flist-item.selected { border-color: #3b82f6; background: #1e3a5f; }
.fmod .flist-item i { color: #DDB84E; font-size: 18px; }
</style>

<script>
'use strict';

let STORE='ab_v7'; // re-scoped to tenant after login
// Instance ID: scopes all data to this specific deployment

// ── MARKDOWN RENDERER (no external deps) ────────────────────────
function inlineFmt(s) {
  return String(s||'')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMd(s, inline) {
  if (!s) return '';
  let t = String(s)
    .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
    .replace(/\\n/g, '\n')
    .replace(/<p>\s*<\/p>/gi, '\n\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p>\s*<p[^>]*>/gi, '\n\n')
    .replace(/<p[^>]*>/gi, '').replace(/<\/p>/gi, '\n\n');
  if (inline) return inlineFmt(t);
  return t.split(/\n\n+/).map(para => {
    para = para.trim(); if (!para) return '';
    if (/^### /.test(para)) return '<h3>'+inlineFmt(para.slice(4))+'</h3>';
    if (/^## /.test(para))  return '<h2>'+inlineFmt(para.slice(3))+'</h2>';
    if (/^# /.test(para))   return '<h1>'+inlineFmt(para.slice(2))+'</h1>';
    if (/^[-*] /m.test(para)) return '<ul>'+para.split('\n').filter(l=>l.trim()).map(l=>'<li>'+inlineFmt(l.replace(/^[-*] /,''))+'</li>').join('')+'</ul>';
    if (/^\d+\. /m.test(para)) return '<ol>'+para.split('\n').filter(l=>l.trim()).map(l=>'<li>'+inlineFmt(l.replace(/^\d+\. /,''))+'</li>').join('')+'</ol>';
    return '<p style="margin:0 0 0.8em">'+inlineFmt(para.replace(/\n/g,'<br>'))+'</p>';
  }).join('');
}

const md  = s => renderMd(s, false);
const mdi = s => renderMd(s, true);

/* ── SUPABASE HELPERS ────────────────────────────────────────────── */
function _hdrs(extra={}){
  return{apikey:SUPABASE_ANON_KEY,'Authorization':'Bearer '+(_session?.access_token||SUPABASE_ANON_KEY),'Content-Type':'application/json',...extra};
}
async function sbGet(table,qs=''){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${qs?'?'+qs:''}`,{headers:_hdrs({'Accept':'application/json'})});
  if(!r.ok)throw new Error(`GET ${table} ${r.status}`);return r.json();
}
async function sbUpsert(table,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:_hdrs({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(data)});
  if(!r.ok){const e=await r.text();throw new Error(`UPSERT ${table} ${r.status}: ${e}`);}
}

async function sbInsert(table,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:_hdrs({Prefer:'return=representation',Accept:'application/json'}),body:JSON.stringify(data)});
  if(!r.ok){const e=await r.text();throw new Error(`INSERT ${table} ${r.status}: ${e}`);}
  const rows=await r.json();
  return Array.isArray(rows)?rows[0]:rows;
}

async function sbUpdate(table,query,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`,{method:'PATCH',headers:_hdrs({Prefer:'return=minimal'}),body:JSON.stringify(data)});
  if(!r.ok){const e=await r.text();throw new Error(`UPDATE ${table} ${r.status}: ${e}`);}
}
async function sbUpsertReturn(table,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:_hdrs({Prefer:'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(data)});
  if(!r.ok){const e=await r.text();throw new Error(`UPSERT ${table} ${r.status}: ${e}`);}
  const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;
}
async function sbDel(table,id){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:'DELETE',headers:_hdrs()});
  if(!r.ok)throw new Error(`DELETE ${table} ${r.status}`);
}

/* ── FIELD MAPPING: Builder (camelCase) ↔ Supabase (snake_case) ── */
function asmToDb(a){
  // Only include project_id/folder_id if they exist in Supabase-synced lists
  // Prevents FK errors from stale localStorage-only IDs
  const knownProjects=new Set((db.projects||[]).map(p=>p.id));
  const knownFolders=new Set((db.folders||[]).map(f=>f.id));
  const pid=a.project_id&&knownProjects.has(a.project_id)?a.project_id:null;
  const fid=a.folder_id&&knownFolders.has(a.folder_id)?a.folder_id:null;
  return{id:a.id,tenant_id:_tenantId,instance_id:getInstanceId(),title:a.title,description:a.description||'',status:a.status||'draft',brand:a.brand||{},webhook_url:a.webhookUrl||'',webhook_headers:a.webhookHeaders||'{"Content-Type":"application/json"}',show_results:a.showResults!==false,allow_retakes:a.allowRetakes!==false,created_at:a.createdAt||now(),project_id:pid,folder_id:fid};}
function dbToAsm(r){return{id:r.id,title:r.title,description:r.description||'',status:r.status||'draft',brand:r.brand||{},webhookUrl:r.webhook_url||'',webhookHeaders:r.webhook_headers||'{"Content-Type":"application/json"}',showResults:r.show_results!==false,allowRetakes:r.allow_retakes!==false,createdAt:r.created_at,folder_id:r.folder_id||null,project_id:r.project_id||null};}
function qToDb(q,aId){return{id:q.id,assessment_id:aId||q.aId,section_id:q.sectionId||null,type:q.type,title:q.title||'',description:q.description||'',required:q.required!==false,order_index:q.orderIndex||0,position_weights:q.positionWeights||[],contact_fields:q.contactFields||[],options:q.options||[]};}
function dbToQ(r){return{id:r.id,aId:r.assessment_id,sectionId:r.section_id,type:r.type,title:r.title||'',description:r.description||'',required:r.required!==false,orderIndex:r.order_index||0,positionWeights:r.position_weights||[],contactFields:r.contact_fields||[],options:r.options||[]};}
function dimToDb(d,aId){return{id:d.id,assessment_id:aId||d.aId,name:d.name,description:d.description||'',color:d.color||'#3b82f6',order_index:d.orderIndex||0,ranges:d.ranges||[],show_in_results:d.showInResults!==false,max_score:d.maxScore||null};}

/* ── DB LOAD ─────────────────────────────────────────────────────── */
let db;
async function loadAll(){
  // Core assessments — must succeed
  const iid = getInstanceId();
  const asms = await sbGet('ab_assessments',`tenant_id=eq.${_tenantId}&instance_id=eq.${iid}&order=created_at.desc`);
  db = {
    assessments: asms.map(dbToAsm),
    questions:   {},
    dimensions:  {},
    sections:    {},
    responses:   {},
    projects:    [],
    folders:     [],
    suites:      [],
    suiteSignins:[],
  };
  // Projects/folders — optional, fail silently
  db.projects = await sbGet('ab_projects',`owner_id=eq.${_userId||_session?.user?.id}&instance_id=eq.${iid}&order=created_at`).catch(()=>[]);
  db.folders  = await sbGet('ab_folders', `owner_id=eq.${_userId||_session?.user?.id}&instance_id=eq.${iid}&order=order_index`).catch(()=>[]);
  if (!Array.isArray(db.projects)) db.projects = [];
  if (!Array.isArray(db.folders))  db.folders  = [];
  // White-label suites — optional, fail silently
  db.suites = await sbGet('ab_suites', `tenant_id=eq.${_tenantId}&order=created_at.desc`).catch(()=>[]);
  if (!Array.isArray(db.suites)) db.suites = [];
  // Suite sign-ins (people who started a suite, incl. before submitting anything)
  db.suiteSignins = await sbGet('ab_suite_signins', `tenant_id=eq.${_tenantId}&order=created_at.desc`).catch(()=>[]);
  if (!Array.isArray(db.suiteSignins)) db.suiteSignins = [];
  // Restore locally-stored projects/folders (they live in localStorage, not Supabase)
  loadLocal();
  // Per-assessment data — each wrapped individually so one bad assessment can't crash all
  await Promise.all(asms.map(async a => {
    try {
      const [dims, secs, qs, rs] = await Promise.all([
        sbGet('ab_dimensions',`assessment_id=eq.${a.id}&order=order_index`),
        sbGet('ab_sections',  `assessment_id=eq.${a.id}&order=order_index`),
        sbGet('ab_questions', `assessment_id=eq.${a.id}&order=order_index`),
        sbGet('ab_responses', `assessment_id=eq.${a.id}&order=created_at.desc&limit=500`),
      ]);
      db.dimensions[a.id] = (dims||[]).map(dbToDim);
      db.sections[a.id]   = (secs||[]).map(dbToSec);
      db.questions[a.id]  = (qs||[]).map(dbToQ);
      db.responses[a.id]  = rs||[];
    } catch(e) {
      console.warn(`Failed to load data for assessment ${a.id}:`, e.message);
      db.dimensions[a.id] = [];
      db.sections[a.id]   = [];
      db.questions[a.id]  = [];
      db.responses[a.id]  = [];
    }
  }));
}

/* ── SYNC TO SUPABASE (debounced background write) ───────────────── */
function svLocal(){
  // Save projects+folders to a separate localStorage key (local-only feature)
  try {
    localStorage.setItem(STORE+'_pf', JSON.stringify({projects: db.projects||[], folders: db.folders||[]}));
  } catch(e) {}
}

function loadLocal(){
  // Restore projects+folders from localStorage
  try {
    const pf = JSON.parse(localStorage.getItem(STORE+'_pf')||'{}');
    if (Array.isArray(pf.projects)) db.projects = pf.projects;
    if (Array.isArray(pf.folders))  db.folders  = pf.folders;
  } catch(e) {}
}

function sv(){
  // Local backup (instant)
  try{localStorage.setItem(STORE,JSON.stringify(db));}catch{}
  // Supabase sync (debounced 600ms)
  if(_session&&_tenantId&&S.asmId){
    _syncQueue.add(S.asmId);
    clearTimeout(_syncTimer);
    _syncTimer=setTimeout(flushSync,600);
  }
}
async function flushSync(){
  const ids=[..._syncQueue];_syncQueue.clear();
  for(const aId of ids){if(aId)await syncAsm(aId).catch(e=>console.warn('Sync failed:',e));}
}
async function syncAsm(aId, silent=false){
  const asm=db.assessments.find(a=>a.id===aId);if(!asm)return [];
  const errs=[];
  const safe=p=>p.catch(e=>{errs.push(e.message);console.error('Sync error:',e);});
  // Phase 1: assessment row first (questions/dims/secs all FK to this)
  await safe(sbUpsert('ab_assessments', asmToDb(asm)));
  // Phase 2: dimensions + sections in parallel (no FK between them)
  await Promise.all([
    ...((db.dimensions[aId]||[]).map(d=>safe(sbUpsert('ab_dimensions',dimToDb(d,aId))))),
    ...((db.sections[aId]||[]).map(s=>safe(sbUpsert('ab_sections',secToDb(s,aId))))),
  ]);
  // Phase 3: questions last — they FK to sections, so sections must exist first
  await Promise.all([
    ...((db.questions[aId]||[]).map(q=>safe(sbUpsert('ab_questions',qToDb(q,aId))))),
  ]);
  if(errs.length && !silent) toast('⚠ Sync errors: '+errs.join(' | '),'err');
  return errs;
}

const gAsm=()=>db.assessments.find(a=>a.id===S.asmId);
const gQs=()=>[...(db.questions[S.asmId]||[])];
const gDs=()=>[...(db.dimensions[S.asmId]||[])].sort((a,b)=>a.orderIndex-b.orderIndex);

function getActiveDims(secId){
  const sec=gSecs().find(s=>s.id===secId);
  const all=gDs();
  if(!sec||!sec.activeDimIds||!sec.activeDimIds.length)return all;
  const active=all.filter(d=>sec.activeDimIds.includes(d.id));
  return active.length?active:all;
}

// Sort questions for take flow: by section order then question order within section
function orderedQs(){
  const secs=gSecs();
  const sIdx=Object.fromEntries(secs.map((s,i)=>[s.id,i]));
  return [...gQs()].sort((a,b)=>{
    const si=(a.sectionId!=null?sIdx[a.sectionId]:9999)??9999;
    const sj=(b.sectionId!=null?sIdx[b.sectionId]:9999)??9999;
    if(si!==sj)return si-sj;
    return (a.orderIndex||0)-(b.orderIndex||0);
  });
}

// Questions grouped by section for editor
function qsBySec(){
  const secs=gSecs();
  const all=gQs().sort((a,b)=>(a.orderIndex||0)-(b.orderIndex||0));
  const grouped={};
  secs.forEach(s=>grouped[s.id]=[]);
  const ungrouped=[];
  all.forEach(q=>{
    if(q.sectionId&&grouped[q.sectionId])grouped[q.sectionId].push(q);
    else ungrouped.push(q);
  });
  return{secs,grouped,ungrouped};
}

/* ══ SCORING ══ */
function calcScores(qs,dims,answers){
  const s=Object.fromEntries(dims.map(d=>[d.id,0]));
  qs.forEach(q=>{
    if(q.type==='multiple_choice'&&answers[q.id]){
      const opt=(q.options||[]).find(o=>o.id===answers[q.id]);
      if(opt?.scores)Object.entries(opt.scores).forEach(([k,v])=>{if(s[k]!==undefined)s[k]+=Number(v);});
    }
    if(q.type==='multi_select'&&Array.isArray(answers[q.id])){
      answers[q.id].forEach(oid=>{const opt=(q.options||[]).find(o=>o.id===oid);if(opt?.scores)Object.entries(opt.scores).forEach(([k,v])=>{if(s[k]!==undefined)s[k]+=Number(v);});});
    }
    if(q.type==='ranking'&&Array.isArray(answers[q.id])&&answers[q.id].length){
      const order=answers[q.id];const n=order.length;
      const weights=q.positionWeights&&q.positionWeights.length===n?q.positionWeights:Array.from({length:n},(_,i)=>n-i);
      order.forEach((optId,idx)=>{
        const opt=(q.options||[]).find(o=>o.id===optId);
        const w=Number(weights[idx])||0;
        if(opt?.scores)Object.entries(opt.scores).forEach(([k,v])=>{if(s[k]!==undefined)s[k]+=Number(v)*w;});
      });
    }
  });
  return s;
}
function getRanks(dims,scores){return Object.fromEntries(dims.map(d=>{const s=scores[d.id]||0;const r=(d.ranges||[]).find(r=>s>=r.min&&s<=r.max);return[d.id,r||{label:'N/A',description:'',recommendation:''}];}));}
function getTied(scores){const vals=Object.values(scores);if(!vals.length)return[];const mx=Math.max(...vals);return Object.entries(scores).filter(([,v])=>v===mx).map(([id])=>id);}
function mxSc(qs,dId){let m=0;qs.forEach(q=>{
  if(q.type==='multiple_choice'){const sc=(q.options||[]).map(o=>Number(o.scores?.[dId]||0));if(sc.length)m+=Math.max(0,...sc);}
  if(q.type==='multi_select'){(q.options||[]).forEach(o=>{const s=Number(o.scores?.[dId]||0);if(s>0)m+=s;});}
  if(q.type==='ranking'){const opts=q.options||[];const n=opts.length;const weights=q.positionWeights&&q.positionWeights.length===n?q.positionWeights:Array.from({length:n},(_,i)=>n-i);const maxW=n?Math.max(...weights):0;const maxSc=Math.max(0,...opts.map(o=>Number(o.scores?.[dId]||0)));m+=maxSc*maxW;}
});return m||1;}

/* ══ WEBHOOK ══ */
async function fireWH(asm,resp,dims){
  if(!asm?.webhookUrl)return{status:'no_url'};
  const dm=Object.fromEntries(dims.map(d=>[d.id,d.name]));
  const p={responseId:resp.id,assessmentId:asm.id,assessmentTitle:asm.title,submittedAt:resp.createdAt,contact:resp.contact||{},scores:Object.fromEntries(Object.entries(resp.scores||{}).map(([k,v])=>[dm[k]||k,v])),ranks:Object.fromEntries(Object.entries(resp.ranks||{}).map(([k,v])=>[dm[k]||k,v])),tiedTopDimensions:(resp.tiedTop||[]).map(id=>dm[id]||id),topDimension:dm[(resp.tiedTop||[])[0]]||null};
  try{const hd={'Content-Type':'application/json'};try{if(asm.webhookHeaders)Object.assign(hd,JSON.parse(asm.webhookHeaders));}catch{}const r=await fetch(asm.webhookUrl,{method:'POST',headers:hd,body:JSON.stringify(p)});return{status:r.ok?'success':'error',code:r.status};}catch(e){return{status:'error',message:e.message};}

  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.rank-item').forEach(el=>el.classList.remove('drag-over','dragging'));

function mvRk(qId,optId,dir){
  const order=[...(S.answers[qId]||[])];
  const i=order.indexOf(optId),j=i+dir;
  if(i<0||j<0||j>=order.length)return;
  [order[i],order[j]]=[order[j],order[i]];

}

/* ══ RENDER ══ */
function seededShuffle(arr, seed) {
  // Simple seeded shuffle — consistent per question per session
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getOpts(q) {
  const opts = q.options || [];
  if (!q.shuffleOptions || !opts.length) return opts;
  if (!S.shuffledOrders[q.id]) {
    // Generate a seed from question ID characters
    const seed = q.id.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0) + Date.now() % 9999;
    S.shuffledOrders[q.id] = seededShuffle(opts.map(o => o.id), seed);
  }
  const order = S.shuffledOrders[q.id];
  return order.map(id => opts.find(o => o.id === id)).filter(Boolean);
}

// Deep-copy one assessment (dimensions, sections, questions + scoring) with
// fresh IDs. opts: {title, brand, folderId, projectId, status}. Responses are
// NOT copied. Returns the new assessment id (or null).
async function deepCopyAsm(srcId, opts={}){
  const src=db.assessments.find(a=>a.id===srcId);
  if(!src) return null;
  const newId=uid();
  // Dimensions — remap old dim id → new dim id (referenced by sections + option scores)
  const dimIdMap={};
  const dims=(db.dimensions[srcId]||[]).map(d=>{
    const nid=uid(); dimIdMap[d.id]=nid;
    return {...d, id:nid, aId:newId, ranges:(d.ranges||[]).map(r=>({...r, id:uid()}))};
  });
  // Sections — remap old sec id → new sec id; remap activeDimIds via dimIdMap
  const secIdMap={};
  const secs=((db.sections||{})[srcId]||[]).map(s=>{
    const nid=uid(); secIdMap[s.id]=nid;
    return {...s, id:nid, aId:newId,
      activeDimIds:(s.activeDimIds||[]).map(x=>dimIdMap[x]).filter(Boolean),
      formulaLabels:JSON.parse(JSON.stringify(s.formulaLabels||{}))};
  });
  // Questions — remap sectionId + option score keys (dim ids)
  const qs=(db.questions[srcId]||[]).map(q=>({
    ...q, id:uid(), aId:newId,
    sectionId: q.sectionId ? (secIdMap[q.sectionId]||null) : null,
    contactFields:(q.contactFields||[]).map(f=>({...f, id:uid()})),
    options:(q.options||[]).map(o=>({...o, id:uid(),
      scores:Object.fromEntries(Object.entries(o.scores||{}).map(([k,v])=>[dimIdMap[k]||k, v]))})),
  }));
  const asm={
    id:newId,
    title: opts.title!=null ? opts.title : src.title,
    description: src.description||'',
    status: opts.status!=null ? opts.status : (src.status||'draft'),
    brand: opts.brand!=null ? opts.brand : JSON.parse(JSON.stringify(src.brand||{})),
    webhookUrl: src.webhookUrl||'',
    webhookHeaders: src.webhookHeaders||'{"Content-Type":"application/json"}',
    showResults: src.showResults!==false,
    allowRetakes: src.allowRetakes!==false,
    createdAt: now(),
    folder_id: opts.folderId!==undefined ? opts.folderId : (src.folder_id||null),
    project_id: opts.projectId!==undefined ? opts.projectId : (src.project_id||null),
  };
  db.assessments.push(asm);
  db.questions[newId]=qs; db.dimensions[newId]=dims;
  if(!db.sections) db.sections={};
  db.sections[newId]=secs; db.responses[newId]=[];
  if(_session&&_tenantId){ await syncAsm(newId, true); }
  return newId;
}

// Compute a copy's title from the active rename rule (live + at run time)
function wlApplyRename(orig){
  const mode=document.getElementById('wl-rn-mode')?.value||'none';
  if(mode==='prefix') return (document.getElementById('wl-rn-prefix')?.value||'')+orig;
  if(mode==='suffix') return orig+(document.getElementById('wl-rn-suffix')?.value||'');
  if(mode==='replace'){
    const f=document.getElementById('wl-rn-find')?.value||'';
    const r=document.getElementById('wl-rn-repl')?.value||'';
    return f ? orig.split(f).join(r) : orig;
  }
  return orig;
}
function wlResolveBrand(src){
  const mode=document.getElementById('wl-br-mode')?.value||'keep';
  if(mode==='keep') return JSON.parse(JSON.stringify(src.brand||{}));
  if(mode==='preset'){
    const p=getBrandPresets().find(x=>x.id===(document.getElementById('wl-br-preset')?.value));
    return p ? {...p.brand} : JSON.parse(JSON.stringify(src.brand||{}));
  }
  const g=(id,d)=>document.getElementById(id)?.value||d;
  return {
    primaryColor:g('wl-bc-p',DB0.primaryColor), bgColor:g('wl-bc-bg',DB0.bgColor),
    textColor:g('wl-bc-t',DB0.textColor), surfaceColor:g('wl-bc-s',DB0.surfaceColor),
    borderColor:g('wl-bc-b',DB0.borderColor), logoUrl:g('wl-bc-logo',''),
    fontFamily:g('wl-bc-f',DB0.fontFamily),
    btnRadius:String(g('wl-bc-br','8')), cardRadius:String(g('wl-bc-cr','12')),
  };
}

async function runWhitelabel(){
  const srcs=db.assessments.filter(a=>S.sel.includes(a.id));
  if(!srcs.length){ toast('Nothing selected','err'); return; }
  // Resolve destination folder
  let folderId=null;
  const destMode=document.querySelector('input[name="wl-dest"]:checked')?.value||'new';
  if(destMode==='new'){
    const fname=(document.getElementById('wl-folder-name')?.value||'').trim();
    if(!fname){ toast('Enter a name for the new folder','err'); return; }
    const f={id:uid(), name:fname, project_id:S.projectId||null, instance_id:getInstanceId(), owner_id:_userId, sort_order:db.folders.length, created_at:now()};
    try{ await sbUpsert('ab_folders', f); }catch(e){ toast('Folder save failed: '+e.message,'err'); return; }
    db.folders.push(f); folderId=f.id; svLocal();
  } else if(destMode==='existing'){
    folderId=document.getElementById('wl-folder-existing')?.value||null;
  } // destMode==='none' → folderId stays null (unfiled)
  const statusMode=document.getElementById('wl-status')?.value||'keep';
  const btn=document.getElementById('wl-run');
  if(btn){ btn.disabled=true; btn.innerHTML='<i class="ti ti-loader"></i> Copying…'; }
  let ok=0; const errs=[];
  for(const src of srcs){
    try{
      const newId=await deepCopyAsm(src.id,{
        title: wlApplyRename(src.title),
        brand: wlResolveBrand(src),
        folderId, projectId: S.projectId||null,
        status: statusMode==='keep' ? undefined : statusMode,
      });
      if(newId) ok++; else errs.push(src.title);
    }catch(e){ errs.push(src.title+': '+(e.message||e)); }
  }
  sv();
  S.whitelabel=null; S.selMode=false; S.sel=[];
  if(folderId) S.folderId=folderId;       // jump to the new folder
  render();
  toast(`Whitelabeled ${ok} assessment${ok!==1?'s':''}`+(errs.length?` · ${errs.length} failed`:''), errs.length?'err':'ok');
  if(errs.length) console.warn('Whitelabel errors:', errs);
}

// Per-suite progress from loaded responses: a person is "complete" when they
// have a response for every assessment in the suite, "in progress" with 1+ but
// not all. Counts by (lower-cased) contact email across the suite's assessments.
// Complete = a response for every assessment in the suite.
// In progress = at least one response OR signed in, but not complete.
function suiteStats(suite){
  const {ids, people}=suiteRespondents(suite);
  const total=ids.length;
  let complete=0, inProgress=0;
  people.forEach(p=>{ if(total && p.done.size>=total) complete++; else if(p.done.size>0||p.signedIn) inProgress++; });
  return {total, complete, inProgress};
}

// Per-respondent breakdown: one entry per person (by email) with the set of
// assessments they've completed within the suite.
function suiteRespondents(suite){
  const ids=(suite.assessment_ids||[]).filter(id=>db.assessments.some(a=>a.id===id));
  const people={};
  const get=em=>people[em]||(people[em]={email:em, name:'', team:'', done:new Set(), last:null, signedIn:false});
  ids.forEach(aid=>{
    (db.responses[aid]||[]).forEach(r=>{
      const c=r.contact||{};
      const em=((c.Email||c.email)||'').trim().toLowerCase();
      if(!em) return;
      const p=get(em);
      p.done.add(aid);
      const nm=[c['First Name'],c['Last Name']].filter(Boolean).join(' ').trim();
      if(nm && !p.name) p.name=nm;
      const tc=(c['Team Code (Optional):']||c.teamCode||'').trim();
      if(tc && !p.team) p.team=tc;
      const t=r.created_at||r.createdAt;
      if(t && (!p.last || new Date(t)>new Date(p.last))) p.last=t;
    });
  });
  // Fold in sign-ins (people who started the suite, maybe before submitting)
  (db.suiteSignins||[]).forEach(si=>{
    if(si.suite_slug!==suite.slug) return;
    const em=(si.email||'').trim().toLowerCase(); if(!em) return;
    const p=get(em); p.signedIn=true;
    const nm=[si.first_name,si.last_name].filter(Boolean).join(' ').trim();
    if(nm && !p.name) p.name=nm;
    if(!p.team && si.team_code) p.team=si.team_code;
    if(si.created_at && (!p.last || new Date(si.created_at)>new Date(p.last))) p.last=si.created_at;
  });
  return { ids, people:Object.values(people) };
}

      ${chip(S.suiteViewFilter==='inprogress','In progress',nProg,"suiteViewFilterSet('inprogress')",{bg:'#451a03',bd:'#d97706',tx:'#fcd34d'})}
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">

          ${cols.map(a=>`<th style="text-align:center" title="${esc(a.title)}">${esc(shortT(a.title))}</th>`).join('')}
          <th style="text-align:center">Status</th>
        </tr></thead>
        <tbody>
          ${filtered.length?filtered.map(p=>{const st=statusOf(p);return `<tr>
            <td style="font-weight:600">${esc(p.name||'—')}</td>

/* ══ HOME ══ */
function rHome(){
  if (!db || !db.assessments) return '<div style="padding:40px;text-align:center;color:#64748b">Loading...</div>';
  if (!Array.isArray(db.projects)) db.projects = [];
  if (!Array.isArray(db.folders))  db.folders  = [];
  const curProject = db.projects.find(p=>p.id===S.projectId)||null;
  const folders = db.folders.filter(f=>f.project_id===S.projectId);
  // Assessments in this project
  const allAsms = db.assessments.filter(a=>!S.projectId||(a.project_id===S.projectId));
  // Current folder filter
  const viewAsms = S.folderId==='__none__'
    ? allAsms.filter(a=>!a.folder_id)
    : S.folderId
      ? allAsms.filter(a=>a.folder_id===S.folderId)
      : allAsms;

  return `<div class="content">
  <!-- Page header -->
  <div class="ph">
    <div>
      <h1>${curProject?esc(curProject.name):'All Assessments'}</h1>
      <p class="ph-sub">${curProject?esc(curProject.description||''):'Build, brand, and deploy scoring experiences'}</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn" onclick="toggleSelMode()" style="background:${S.selMode?'#1e3a5f':'#1e293b'};border:1px solid ${S.selMode?'#3b82f6':'#334155'};color:${S.selMode?'#60a5fa':'#94a3b8'}" title="Select multiple"><i class="ti ti-${S.selMode?'square-check':'checkbox'}"></i> ${S.selMode?'Done':'Select'}</button>
      <button class="btn" onclick="crtFolder()" style="background:#1e293b;border:1px solid #334155;color:#94a3b8" title="New folder"><i class="ti ti-folder-plus"></i> New Folder</button>
      <button class="btn bp" onclick="crtAsm()"><i class="ti ti-plus"></i> New Assessment</button>
    </div>
  </div>

  ${S.selMode?`<div style="display:flex;align-items:center;gap:10px;background:#1e3a5f;border:1px solid #3b82f6;border-radius:8px;padding:10px 14px;margin-bottom:16px">
    <span style="font-size:13px;font-weight:600;color:#e2e8f0">${S.sel.length} selected</span>
    <button class="btn bsm" onclick="selAllVisible()" style="background:#1e293b;border:1px solid #334155;color:#94a3b8"><i class="ti ti-list-check"></i> Select all visible</button>
    <button class="btn bsm" onclick="selClear()" style="background:#1e293b;border:1px solid #334155;color:#94a3b8" ${S.sel.length?'':'disabled'}>Clear</button>
    <button class="btn bp bsm" style="margin-left:auto" onclick="openWhitelabel()" ${S.sel.length?'':'disabled'}><i class="ti ti-wand"></i> Whitelabel / Copy…</button>
  </div>`:''}

  <!-- Folder breadcrumb / filter bar -->
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap">
    <button onclick="S.folderId=null;render()" class="fcrumb ${!S.folderId?'on':''}"><i class="ti ti-home-2"></i> All</button>
    <button onclick="S.folderId='__none__';render()" class="fcrumb ${S.folderId==='__none__'?'on':''}"><i class="ti ti-file"></i> Unfiled</button>
    ${folders.map(f=>`<button onclick="S.folderId='${f.id}';render()" class="fcrumb ${S.folderId===f.id?'on':''}" draggable="false">
      <i class="ti ti-folder"></i> ${esc(f.name)}
      <span class="fcrumb-count">${allAsms.filter(a=>a.folder_id===f.id).length}</span>
      <span class="fcrumb-del" onclick="event.stopPropagation();delFolder('${f.id}')" title="Delete folder"><i class="ti ti-x"></i></span>
    </button>`).join('')}
  </div>

  <!-- Folder cards when viewing "All" -->
  ${!S.folderId&&folders.length?`<div style="margin-bottom:24px">
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:10px;font-weight:600">Folders</div>
    <div class="fgrid">
      ${folders.map(f=>{
        const cnt = allAsms.filter(a=>a.folder_id===f.id).length;
        return `<div class="fcard" draggable="true" data-folder-id="${f.id}"
          ondragstart="dFolderStart(event,'${f.id}')"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="event.preventDefault();this.classList.remove('drag-over')"
          onclick="S.folderId='${f.id}';render()">
          <i class="ti ti-folder" style="font-size:28px;color:#DDB84E;margin-bottom:8px"></i>
          <div style="font-weight:600;font-size:14px;margin-bottom:4px">${esc(f.name)}</div>
          <div style="font-size:12px;color:#64748b">${cnt} assessment${cnt!==1?'s':''}</div>
          <div class="fcard-actions" onclick="event.stopPropagation()">
            <button onclick="renameFolder('${f.id}')" title="Rename"><i class="ti ti-pencil"></i></button>
            <button onclick="delFolder('${f.id}')" title="Delete" style="color:#ef4444"><i class="ti ti-trash"></i></button>
          </div>
        </div>`;
      }).join('')}

  <!-- Assessment grid -->
  ${viewAsms.length?`<div>
    ${S.folderId?`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:10px;font-weight:600">
      ${S.folderId==='__none__'?'Unfiled Assessments':esc(folders.find(f=>f.id===S.folderId)?.name||'')}
    </div>`:'<div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:10px;font-weight:600">Assessments</div>'}
    <div class="agrid" id="asm-grid">
      ${viewAsms.map(a=>{const b=gb(a);const qs=db.questions[a.id]||[];const rs=db.responses[a.id]||[];const secs=(db.sections||{})[a.id]||[];
        const folderName = db.folders.find(f=>f.id===a.folder_id)?.name||'';

          ${S.selMode?'':'draggable="true"'}
          ${S.selMode?`onclick="selToggle('${a.id}')"`:''}
          ondragstart="dAsmStart(event,'${a.id}')"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="event.preventDefault();this.classList.remove('drag-over');dropOnAsm(event,'${a.id}')">
          ${S.selMode?`<div style="position:absolute;top:10px;right:10px"><input type="checkbox" ${isSel?'checked':''} onclick="event.stopPropagation();selToggle('${a.id}')" style="width:18px;height:18px;accent-color:#3b82f6;cursor:pointer"></div>`:''}
          ${b.logoUrl?`<img src="${esc(b.logoUrl)}" style="height:24px;object-fit:contain;margin-bottom:10px" onerror="this.style.display='none'" alt="">`:'' }
          <div class="fx ic jb mb2"><div style="font-size:15px;font-weight:600">${esc(a.title)}</div>${S.selMode?'':`<span class="bdg ${a.status==='published'?'bsuc':'bwrn'}">${a.status||'draft'}</span>`}</div>
          ${folderName?`<div style="font-size:11px;color:#64748b;margin-bottom:4px"><i class="ti ti-folder" style="font-size:10px"></i> ${esc(folderName)}</div>`:''}
          <div class="fx g2 mb2" style="font-size:12px;color:#64748b"><span><i class="ti ti-list-check"></i> ${qs.length} q</span><span><i class="ti ti-users"></i> ${rs.length} resp</span><span><i class="ti ti-layout-columns"></i> ${secs.length} sec</span></div>
          ${S.selMode?'':`<div class="acard-actions fx g2">
            <button class="btn bsm" onclick="editAsm('${a.id}')"><i class="ti ti-pencil"></i> Edit</button>
            <button class="btn bsm" onclick="S.asmId='${a.id}';goTo('res')"><i class="ti ti-users"></i> Results</button>
            <button class="btn bsm" onclick="dupAsm('${a.id}')" title="Duplicate"><i class="ti ti-copy"></i></button>
            <button class="btn bsm" style="margin-left:auto" onclick="openMoveAsm('${a.id}')" title="Move to folder"><i class="ti ti-folder-arrow-right"></i></button>
            <button class="btn bsm" style="color:#ef4444" onclick="dlAsm('${a.id}')"><i class="ti ti-trash"></i></button>
          </div>`}
        </div>`;
      }).join('')}
    </div>
  </div>`:`<div class="empty-state"><i class="ti ti-folder-open" style="font-size:48px;color:#334155;margin-bottom:12px"></i><p style="color:#64748b">${S.folderId&&S.folderId!=='__none__'?'No assessments in this folder':'No assessments yet'}</p>${S.folderId?`<button class="btn" onclick="S.folderId=null;render()" style="margin-top:12px;background:#1e293b;border:1px solid #334155;color:#94a3b8">View all</button>`:''}</div>`}

  ${rFolderModal()}
  ${rWhitelabelModal()}
  `;
}

  <div class="fg"><label>Description</label><textarea id="g-d" rows="3">${asm.description||''} </textarea></div>
  <div class="fg"><label>Status</label><select id="g-s"><option value="draft" ${asm.status==='draft'?'selected':''}>Draft</option><option value="published" ${asm.status==='published'?'selected':''}>Published</option></select></div>

/* ══ SECTIONS & QUESTIONS TAB ══ */
function rQsTab(){
  const{secs,grouped,ungrouped}=qsBySec();
  const dims=gDs();
  return `<div>
    <div class="fx ic jb mb4">
      <div><h2 style="font-size:16px;font-weight:600">Sections & Questions</h2><p class="tm tsm mt1">Sections group questions and scope dimension dropdowns to keep scoring manageable.</p></div>
      <button class="btn bp" onclick="opSecMod(null)"><i class="ti ti-plus"></i> Add Section</button>
    </div>
    ${!dims.length?`<div class="ib"><i class="ti ti-info-circle" style="flex-shrink:0"></i> Add <strong>Dimensions</strong> first (in the Dimensions tab) before configuring section scoring.</div>`:''}
    ${secs.map(sec=>{
      const secDims=sec.activeDimIds?.length?dims.filter(d=>sec.activeDimIds.includes(d.id)):dims;
      const isOpen=S.expandedSecs[sec.id]!==false;
      const qs2=grouped[sec.id]||[];
      return `<div class="sec-wrap">
        <div class="sec-head" onclick="togSec('${sec.id}')">
          <i class="ti ti-chevron-right sec-caret ${isOpen?'open':''}" style="font-size:13px;color:var(--muted)"></i>
          <div class="sec-title">${mdi(sec.title)||'Untitled Section'}</div>
          <div class="sec-dimtags">
            ${secDims.slice(0,4).map(d=>`<span class="dim-tag"><span style="width:7px;height:7px;border-radius:50%;background:${esc(d.color||'#94a3b8')};display:inline-block"></span>${esc(d.name)}</span>`).join('')}
            ${secDims.length>4?`<span class="bdg bdft">+${secDims.length-4} more</span>`:''}
            ${!sec.activeDimIds?.length?`<span class="bdg byw">All dims</span>`:''}

          ${b.logoUrl?`<img src="${esc(b.logoUrl)}" style="height:24px;object-fit:contain" onerror="this.style.display='none'" alt="">`:`<div style="font-weight:700;font-size:13px;color:${esc(b.primaryColor)}">${esc(asm.title)}</div>`}
          <div class="fx ic g2">${S.preview?`<span class="bdg byw"><i class="ti ti-eye"></i> Preview</span>`:''}<span style="font-size:12px;color:${esc(b.textColor)};opacity:.5">${S.step+1} / ${qs.length}</span></div>

function rQ(q,b,cr,br){
  const cs=`background:${esc(b.surfaceColor)};border:1px solid ${esc(b.borderColor)};border-radius:${cr}px;`;
  if(q.type==='instruction')return`<div class="qcard" style="${cs}"><h2 style="font-size:22px;font-weight:700;color:${esc(b.textColor)};margin-bottom:12px">${mdi(q.title)}</h2><p style="font-size:15px;line-height:1.75;color:${esc(b.textColor)};opacity:.7"><div class="md-content">${md(q.description)}</div></div>`;

  if(q.type==='contact_form'){
    return `<div class="qcard" style="${cs}"><h2 style="font-size:19px;font-weight:700;color:${esc(b.textColor)};margin-bottom:14px">${mdi(q.title)}</h2>
    ${(q.contactFields||[]).map(f=>renderCF(f,b,function(lbl){return S.contact[lbl]||'';},function(lbl,v){return "S.contact['"+esc(lbl)+"']="+v;})).join('')}</div>`;
  }
  if(q.type==='ranking'){
    const opts=getOpts(q);
    if(!Array.isArray(S.answers[q.id])||S.answers[q.id].length!==opts.length)S.answers[q.id]=opts.map(o=>o.id);
    const order=S.answers[q.id];const oMap=Object.fromEntries(opts.map(o=>[o.id,o]));const n=order.length;
    return `<div class="qcard" style="${cs}">
      <h2 style="font-size:18px;font-weight:700;color:${esc(b.textColor)};margin-bottom:6px">${mdi(q.title)}</h2>
      <p style="font-size:13px;color:${esc(b.textColor)};opacity:.55;margin-bottom:18px">${q.description ? mdi(q.description) : 'Drag to reorder \u2014 most important at the top'}</p>
      <div class="rank-list">
        ${order.map((optId,idx)=>{const opt=oMap[optId]||{text:optId};
          return `<div class="rank-item" data-opt="${optId}" draggable="true"
            ondragstart="dSt(event,'${q.id}','${optId}')" ondragover="dOv(event,'${q.id}','${optId}')"
            ondrop="dDr(event,'${q.id}','${optId}')" ondragend="dEnd()"
            ondragleave="this.classList.remove('drag-over')"
            style="border-color:${idx===0?b.primaryColor:b.borderColor};background:${idx===0?b.primaryColor+'14':b.surfaceColor}">
            <div class="rank-num" style="background:${idx===0?b.primaryColor:b.borderColor};color:${idx===0?'#fff':b.textColor}">${idx+1}</div>
            <div class="rank-hdl" style="color:${b.textColor}">\u2807</div>
            <div class="rank-txt" style="color:${idx===0?b.primaryColor:b.textColor}">${esc(opt.text)}</div>
            <div class="rank-arr">
              <button class="rarr" onclick="mvRk('${q.id}','${optId}',-1)" ${idx===0?'disabled':''} style="color:${b.textColor}"><i class="ti ti-chevron-up" style="font-size:13px"></i></button>
              <button class="rarr" onclick="mvRk('${q.id}','${optId}',1)" ${idx===n-1?'disabled':''} style="color:${b.textColor}"><i class="ti ti-chevron-down" style="font-size:13px"></i></button>
            </div>
          </div>`;}).join('')}
      </div>
      <p style="font-size:11px;color:${esc(b.textColor)};opacity:.35;margin-top:12px;text-align:center"><i class="ti ti-arrows-up-down" style="font-size:12px"></i> Drag or use arrows to reorder</p>
    </div>`;
  }
  if(q.type==='multiple_choice'){
    const sel=S.answers[q.id];

/* ── RESPONSE MODAL ── */
function rRMod(){
  const resp=S.modal.data;const dims=gDs();const asm=gAsm();const qs=orderedQs();
  // Normalize field names — handle both camelCase (local db) and snake_case (Supabase direct)
  const createdAt  = resp.createdAt || resp.created_at;
  const webhookSt  = resp.webhookStatus || resp.webhook_status || 'not_configured';
  const tiedTop    = resp.tiedTop || resp.tied_top || [];
  // Parse scores/ranks/contact — may be string (if Supabase stored as text) or object
  const parseJ = v => { try { return typeof v==='string' ? JSON.parse(v) : (v||{}); } catch{ return {}; } };
  const scores  = parseJ(resp.scores);
  const storedRanks = parseJ(resp.ranks);
  const contact = parseJ(resp.contact);
  // Re-apply current formulaTiers to stored scores (overrides stale stored ranks)
  const secs = gSecs();
  const allDims = gDs();
  const allQs = orderedQs();
  // Build score map keyed by dim id
  const scoreById = {};
  allDims.forEach(d => { scoreById[d.id] = Number(scores[d.name] || scores[d.id] || 0); });
  // Compute dimMaxes
  const dimMaxesR = {};
  allDims.forEach(d => {
    if (d.maxScore) { dimMaxesR[d.id]=d.maxScore; return; }
    var mx=mxSc(allQs,d.id); if(mx>0){dimMaxesR[d.id]=mx;return;}
    if(d.ranges&&d.ranges.length){var rm=Math.max.apply(null,d.ranges.map(r=>r.max||0));if(rm>0){dimMaxesR[d.id]=rm;return;}}
    dimMaxesR[d.id]=100;
  });
  // Apply formulaTiers per section
  const liveRanks = {};
  secs.forEach(sec => {
    const fl = sec.formulaLabels || {};
    const tiers = fl.formulaTiers;
    if (!tiers || !tiers.length) return;
    const secDims = allDims.filter(d => (sec.activeDimIds||[]).includes(d.id));
    const matched = {};
    tiers.forEach(tier => {
      if (!tier.formula || !tier.label) return;
      secDims.forEach(d => {
        if (matched[d.id]) return;
        if (evalFormula(tier.formula, d.id, scoreById, secDims, dimMaxesR)) {
          liveRanks[d.name] = {label:tier.label, description:tier.description||'', recommendation:tier.recommendation||''};
          matched[d.id] = true;
        }
      });
    });
  });
  // Merge: liveRanks (formulaTiers) beats storedRanks (static)
  const ranks = { ...storedRanks, ...liveRanks };

        <div><p class="fgl mb2">Webhook</p><div class="fx ic g1 mb2"><i class="ti ${webhookSt==='success'?'ti-circle-check':'ti-minus'}" style="${webhookSt==='success'?'color:var(--ok)':'color:var(--muted)'}"></i><span class="tsm">${esc(webhookSt)}</span></div></div>
      </div>
      <p class="fgl mb2">Scores</p>
      ${dims.map(d=>{
        const score=Number(scores[d.name]||0);
        const rank=ranks[d.name];
        const isTied=tiedTop.includes(d.id);
        const mx=mxSc(qs,d.id);
        const pct=mx>0?Math.min(100,Math.round((score/mx)*100)):0;
        return `<div style="padding:12px;border-radius:8px;margin-bottom:8px;border-left:4px solid ${esc(d.color||'#94a3b8')};background:var(--bg)">
          <div class="fx ic jb mb2"><div class="fx ic g2"><div style="width:9px;height:9px;border-radius:50%;background:${esc(d.color||'#94a3b8')}"></div><strong>${esc(d.name)}</strong>${isTied?`<span class="bdg bbl">Top</span>`:''}</div><div class="fx g2 ic">${rank?`<span class="bdg bdft">${esc(rank.label||'')}</span>`:''}<span class="tm tsm">${score} pts</span></div></div>
          <div class="sbb"><div class="sbf" style="width:${pct}%;background:${esc(d.color||'#94a3b8')}"></div></div>
          ${rank?.recommendation?`<p class="tsm tm mt2"><strong>Rec:</strong> ${esc(rank.recommendation)}</p>`:''}
        </div>`;}).join('')}
    </div>
  </div></div>`;
}

async function doImportAsms(){
  S.modal=null; render();
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json'; inp.multiple=true;
  inp.onchange=async function(){
    const files=[...inp.files];
    if(!files.length) return;
    let ok=0;
    const errors=[];
    // Show live progress modal
    function showProgress(current, total, currentFile){
      S.modal={type:'import_progress', current, total, currentFile, errors:[...errors]};
      render();
    }
    showProgress(0, files.length, '');
    for(let i=0;i<files.length;i++){
      const file=files[i];
      showProgress(i+1, files.length, file.name);
      try{
        const txt=await file.text();
        let data;
        try{ data=JSON.parse(txt); }
        catch(e){ throw new Error('Invalid JSON: '+e.message); }
        await importJSONObj(data);
        ok++;
      }catch(e){
        const msg=e.message||String(e);
        errors.push({file:file.name, error:msg});
        console.error('Import failed:', file.name, e);
      }
    }
    // Show final summary — stays open until dismissed
    S.modal={type:'import_result', ok, total:files.length, errors};
    render();
  };
  inp.click();
}

async function dlAsm(id){
  if(!confirm('Delete this assessment and all responses?'))return;
  try {
    // Questions first — they FK to sections (SET NULL but safer to delete explicitly)
    await sbDelete('ab_questions',  `assessment_id=eq.${id}`);
    // Dims, sections, responses in parallel — no deps between them
    await Promise.all([
      sbDelete('ab_dimensions', `assessment_id=eq.${id}`),
      sbDelete('ab_sections',   `assessment_id=eq.${id}`),
      sbDelete('ab_responses',  `assessment_id=eq.${id}`),
    ]);
    // Assessment last
    await sbDelete('ab_assessments',`id=eq.${id}`);
  } catch(e){
    const msg = e.message||'';
    if (msg.includes('23503') || msg.includes('foreign key')) {
      toast('⚠ Delete blocked: run the SQL policy fix in Supabase (see console)','err');
      console.error('Missing RLS DELETE policy. Run: CREATE POLICY "authenticated delete responses" ON public.ab_responses FOR DELETE TO authenticated USING (true);');
    } else {
      toast('Delete failed: '+msg,'err');
    }
    return;
  }
  db.assessments=db.assessments.filter(a=>a.id!==id);
  delete db.questions[id]; delete db.dimensions[id];
  if(db.sections) delete db.sections[id];
  delete db.responses[id];
  if(S.asmId===id){S.asmId=null;S.view='home';}
  sv(); render();
}

function renderCF(f, brand, getVal, setVal) {
  var br2 = Math.max(2, parseInt(brand.btnRadius||8) - 2);
  var bc  = brand.borderColor;
  var tc  = brand.textColor;
  var bg  = brand.bgColor;
  var pc  = brand.primaryColor;
  var baseStyle = 'width:100%;padding:10px 12px;border:1px solid '+bc+';border-radius:'+br2+'px;font-size:14px;font-family:inherit;color:'+tc+';background:'+bg+';outline:none;box-sizing:border-box';
  var lbl = '<label style="display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:'+tc+';opacity:.5;margin-bottom:4px">'+esc(f.label)+(f.required?' *':'')+'</label>';
  var val = getVal(f.label) || '';
  var opts = (f.options||'').split(',').map(function(o){ return o.trim(); }).filter(Boolean);
  var id = 'cf-'+f.id;
  var input = '';

  if (f.type === 'textarea') {
    var sv = String(setVal(f.label,'this.value'));
    input = '<textarea id="'+id+'" rows="3" placeholder="'+esc(f.label)+'" style="'+baseStyle+';resize:vertical" oninput="'+sv+'">'+esc(val)+'</textarea>';
  } else if (f.type === 'date') {
    input = '<input type="date" id="'+id+'" value="'+esc(val)+'" style="'+baseStyle+'" onchange="S.contact[\''+esc(f.label)+'\']=this.value">';
  } else if (f.type === 'radio') {
    input = '<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">'+opts.map(function(o){
      return '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:'+tc+'">'
        +'<input type="radio" name="'+id+'" value="'+esc(o)+'" '+(val===o?'checked':'')+' onchange="S.contact[\''+esc(f.label)+'\']=this.value" style="accent-color:'+pc+'"> '+esc(o)+'</label>';
    }).join('')+'</div>';
  } else if (f.type === 'select') {
    input = '<select id="'+id+'" style="'+baseStyle+'" onchange="S.contact[\''+esc(f.label)+'\']=this.value">'
      +'<option value="">Select...</option>'
      +opts.map(function(o){ return '<option value="'+esc(o)+'" '+(val===o?'selected':'')+'>'+esc(o)+'</option>'; }).join('')
      +'</select>';
  } else if (f.type === 'multiselect' || f.type === 'checkbox') {
    var selArr = val ? val.split('||') : [];
    var wrapStyle = f.type === 'multiselect'
      ? 'border:1px solid '+bc+';border-radius:'+br2+'px;overflow:hidden'
      : 'display:flex;flex-direction:column;gap:6px;margin-top:4px';
    var itemStyle = f.type === 'multiselect'
      ? 'display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:14px;color:'+tc+';border-bottom:1px solid '+bc
      : 'display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:'+tc;
    input = '<div style="'+wrapStyle+'">'+opts.map(function(o){
      var chk = selArr.indexOf(o) >= 0;
      return '<label style="'+itemStyle+'">'
        +'<input type="checkbox" class="cf-multi" data-field="'+esc(f.label)+'" value="'+esc(o)+'" '+(chk?'checked':'')+' onchange="cfMultiChange(this)" style="accent-color:'+pc+'"> '+esc(o)+'</label>';
    }).join('')+'</div>';
  } else {
    input = '<input type="'+esc(f.type||'text')+'" id="'+id+'" value="'+esc(val)+'" placeholder="'+esc(f.label)+'" style="'+baseStyle+'" oninput="S.contact[\''+esc(f.label)+'\']=this.value">';
  }
  return '<div style="margin-bottom:14px">'+lbl+input+'</div>';
}

function getBrandPresets() {

}
function saveBrandPresets(presets) {
  try { localStorage.setItem(STORE+'_brandPresets', JSON.stringify(presets)); } catch(e){}
}
function saveAsPreset() {
  const name = prompt('Name this brand preset:');
  if (!name || !name.trim()) return;
  const presets = getBrandPresets();
  const preset = { id: uid(), name: name.trim(), brand: gBV(), createdAt: now() };

function applyPreset(id) {
  const preset = getBrandPresets().find(p => p.id === id);

function nxSt(){
  const qs=orderedQs();const q=qs[S.step];
  if(q.required){
    if(q.type==='multiple_choice'&&!S.answers[q.id]){toast('Please select an answer','err');return;}
    if(q.type==='multi_select'&&(!S.answers[q.id]||!S.answers[q.id].length)){toast('Please select at least one option','err');return;}
    if(q.type==='contact_form'){(q.contactFields||[]).forEach(f=>{
    const id='cf-'+f.id;
    if(f.type==='textarea'||f.type==='date'||f.type==='select'||f.type==='email'||f.type==='tel'||f.type==='text'||!f.type){
      const el=document.getElementById(id);if(el)S.contact[f.label]=el.value;
    }else if(f.type==='radio'){const el=document.querySelector('input[name="'+id+'"]:checked');if(el)S.contact[f.label]=el.value;}
  });for(const f of(q.contactFields||[])){if(f.required&&!S.contact[f.label]){toast(`Please fill in "${f.label}"`,'err');return;}}}
  }else if(q.type==='contact_form')(q.contactFields||[]).forEach(f=>{const el=document.getElementById('cf-'+f.id);if(el)S.contact[f.label]=el.value;});

/* ══════════════════════════════════════════
   SCHEMA SPEC (AI-ready system prompt)
══════════════════════════════════════════ */
const SCHEMA_SPEC = `ASSESSMENT BUILDER — JSON SCHEMA SPECIFICATION
=============================================
Use this spec to generate valid assessment JSON for import.
All dimension/section references use NAMES (strings), not internal IDs.

ROOT OBJECT
-----------
{
  "assessment": { title, description, status, showResults },
  "dimensions": Dimension[],
  "sections": Section[],
  "questions": Question[],
  "webhookUrl": string (optional),
  "webhookHeaders": string (optional — JSON-stringified headers object)
}

DIMENSION
---------
{
  "name": string,           // Required. Used as key in all option scores.
  "description": string,    // What this dimension measures.
  "color": string,          // Hex color e.g. "#3b82f6"
  "ranges": [
    {
      "min": number,        // Inclusive lower bound
      "max": number,        // Inclusive upper bound
      "label": string,      // e.g. "Emerging" | "Developing" | "Advanced"
      "description": string,
      "recommendation": string
    }
  ]
}
RANGE NOTE: Ranking questions multiply scores by position weights.
  Example: weight [10,6,3,1], top option score 8 → contributes 80 pts.
  Set range max values to accommodate the maximum weighted total across
  all questions. A safe ceiling = max_option_score × max_weight × num_ranking_questions.

SECTION
-------
{
  "title": string,              // Required. Referenced by questions.
  "description": string,
  "orderIndex": number,         // 0-based display order
  "activeDimensions": string[]  // Dimension names scoped to this section.
                                // Empty [] = all dimensions shown.
}

QUESTION
--------
{
  "section": string | null,     // Section title. null = ungrouped.
  "type": string,               // See QUESTION TYPES below.
  "title": string,              // Required.
  "description": string,
  "required": boolean,
  "orderIndex": number,

  // RANKING only:
  "positionWeights": number[],  // One weight per option. Index 0 = Rank #1.
                                // Must match options array length.
                                // Example: [10, 6, 3, 1]

  // CONTACT_FORM only:
  "contactFields": [
    { "label": string, "type": "text|email|tel|number", "required": boolean }
  ],

  // MULTIPLE_CHOICE, MULTI_SELECT, RANKING:
  "options": [
    {
      "text": string,
      "scores": { "DimensionName": number }  // use exact dimension names
    }
  ]
}

QUESTION TYPES
--------------
  instruction      Display-only text block. No scoring.
  contact_form     Collects respondent info. Uses contactFields.
  multiple_choice  Select one. Selected option scores added to totals.
  multi_select     Select many. All selected option scores summed.
  ranking          Drag to order. score × positionWeight[rank] summed.
  text             Open text. No scoring.

SCORING FORMULAS
----------------
  multiple_choice: answer.scores[dim]
  multi_select:    sum(selected[].scores[dim])
  ranking:         sum(options[order[i]].scores[dim] × positionWeights[i])

COMPLETE EXAMPLE
----------------
{
  "assessment": {
    "title": "Leadership Readiness Check",
    "description": "A 5-minute assessment across 3 leadership dimensions.",
    "status": "draft",
    "showResults": true
  },
  "dimensions": [
    {
      "name": "Strategic Thinking",
      "description": "Vision and long-term planning",
      "color": "#8b5cf6",
      "ranges": [
        {"min":0,"max":60,"label":"Emerging","description":"Early stage","recommendation":"Work with a coach on 3-year visioning."},
        {"min":61,"max":130,"label":"Developing","description":"Growing capability","recommendation":"Build a strategic planning rhythm."},
        {"min":131,"max":300,"label":"Advanced","description":"Clear strength","recommendation":"Teach others and expand influence."}
      ]
    }
  ],
  "sections": [
    {
      "title": "Core Priorities",
      "description": "",
      "orderIndex": 0,
      "activeDimensions": ["Strategic Thinking"]
    }
  ],
  "questions": [
    {
      "section": "Core Priorities",
      "type": "instruction",
      "title": "Welcome",
      "description": "This 3-question assessment reveals your leadership profile.",
      "required": false
    },
    {
      "section": "Core Priorities",
      "type": "contact_form",
      "title": "Your Information",
      "required": true,
      "contactFields": [
        {"label":"Full Name","type":"text","required":true},
        {"label":"Email Address","type":"email","required":true}
      ]
    },
    {
      "section": "Core Priorities",
      "type": "ranking",
      "title": "Rank these leadership priorities:",
      "required": true,
      "positionWeights": [10, 6, 3, 1],
      "options": [
        {"text":"Setting long-term vision","scores":{"Strategic Thinking":9}},
        {"text":"Building team culture","scores":{"Strategic Thinking":6}},
        {"text":"Managing daily operations","scores":{"Strategic Thinking":3}},
        {"text":"Handling urgent issues","scores":{"Strategic Thinking":1}}
      ]
    }
  ]
}`;
