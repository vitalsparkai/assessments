<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--primary:#2563eb;--ph:#1d4ed8;--ok:#059669;--err:#dc2626;--sb:#0f172a;--r:8px}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sb);color:#94a3b8;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:18px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:8px;color:#e2e8f0;font-weight:700;font-size:14px}
.sidebar-logo i{font-size:18px;color:var(--primary)}
.sidebar-nav{padding:10px;flex:1}
.si{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .12s,color .12s;margin-bottom:2px}
.si:hover,.si.on{background:rgba(255,255,255,.09);color:#e2e8f0}
.s-foot{padding:14px 16px;border-top:1px solid #1e293b;font-size:11px;color:#475569}
.main{flex:1;overflow:auto}
.content{padding:24px;max-width:1100px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.ph h1{font-size:20px;font-weight:700}
.ph-sub{font-size:13px;color:var(--muted);margin-top:3px}
.fx{display:flex}.ic{align-items:center}.jb{justify-content:space-between}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.f1{flex:1}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s;border:1px solid transparent;font-family:inherit;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bp{background:var(--primary);color:#fff;border-color:var(--primary)}.bp:hover:not(:disabled){background:var(--ph)}
.bs{background:transparent;color:var(--text);border-color:var(--border)}.bs:hover:not(:disabled){background:var(--bg)}
.bg{background:transparent;color:var(--muted);border-color:transparent}.bg:hover:not(:disabled){background:var(--bg);color:var(--text)}
.bd{background:transparent;color:var(--err);border-color:transparent}.bd:hover:not(:disabled){background:#fef2f2}
.bsm{padding:4px 9px;font-size:12px}.bic{padding:5px 7px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.ctit{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .15s,box-shadow .15s}
.acard:hover{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.07)}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bpub{background:#d1fae5;color:#065f46}.bdft{background:#f1f5f9;color:#475569}
.bbl{background:#dbeafe;color:#1e40af}.byw{background:#fef3c7;color:#92400e}.bpur{background:#ede9fe;color:#5b21b6}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color .12s,border-color .12s}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}.tab:hover:not(.on){color:var(--text)}
.fg{margin-bottom:14px}
.fg label,.fgl{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=tel],textarea,select{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:13.5px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:72px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--border);border-radius:2px;outline:none;border:none;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer}
input[type=color]{width:38px;height:36px;padding:2px;border:1px solid var(--border);border-radius:6px;cursor:pointer}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
/* SECTIONS */
.sec-wrap{margin-bottom:14px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bg);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sec-head:hover{background:#f1f5f9}
.sec-caret{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.sec-caret.open{transform:rotate(90deg)}
.sec-title{font-size:13.5px;font-weight:600;flex:1}
.sec-dimtags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dim-tag{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--border)}
.sec-body{padding:10px}
.sec-empty{text-align:center;padding:16px;color:var(--muted);font-size:13px}
.ungrouped{border:1px dashed var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ungrouped-head{padding:10px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg)}
/* QUESTION ITEMS */
.qi{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);margin-bottom:6px}
.qi-ico{width:28px;height:28px;border-radius:6px;background:#eff6ff;display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;font-size:14px}
.qi-inf{flex:1;min-width:0}
.qi-tit{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi-sub{font-size:11px;color:var(--muted)}
.qi-act{display:flex;gap:3px}
/* SCORE ROWS (option dimension scoring) */
.score-row{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--bg);border-radius:7px;margin-bottom:5px}
.score-row select{flex:1;min-width:0;font-size:13px;padding:5px 8px}
.score-row input[type=number]{width:70px;flex-shrink:0;font-size:13px;padding:5px 8px;text-align:center}
/* POSITION WEIGHTS */
.pw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.pw-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.pw-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.pw-item input{text-align:center;font-size:16px;font-weight:700;border:none;background:transparent;padding:2px;outline:none;color:var(--primary)}
/* OPTION BLOCK */
.opt-block{border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px;background:var(--surface)}
.opt-block-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.opt-block-num{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
.rrow{display:grid;grid-template-columns:68px 68px 110px 1fr 1fr auto;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px}
.rrow .fg{margin-bottom:0}
.cfr{display:flex;gap:7px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;background:var(--bg)}
.cfr input{flex:2}.cfr select{flex:1}
.ib{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:13px;color:#1e40af;margin-bottom:14px;display:flex;align-items:flex-start;gap:7px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.slbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.sval{font-size:24px;font-weight:700}.sval.grn{color:var(--ok)}.sval.red{color:var(--err)}
.tw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:none;user-select:none}
.tw input{display:none}
.tt{width:36px;height:20px;background:#cbd5e1;border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.tw input:checked+.tt{background:var(--primary)}
.tk{position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tw input:checked+.tt .tk{left:19px}
.tm{color:var(--muted)}.tsm{font-size:12.5px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty i{font-size:38px;margin-bottom:12px;display:block;color:#cbd5e1}
/* dim checkboxes in section modal */
.dim-checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px}
.dc-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .1s}
.dc-item:hover{background:var(--bg)}
.dc-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
.dc-label{font-size:13px;font-weight:500}
.dc-sub{font-size:11px;color:var(--muted)}
/* Modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:1000;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:680px;max-width:98vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mw{width:960px}
.mhd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mhd h2{font-size:15px;font-weight:600}
.mbd{padding:20px;overflow-y:auto;max-height:74vh}
.mft{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
/* Take */
.tw-wrap{min-height:100vh;display:flex;flex-direction:column}
.tw-bar{flex-shrink:0}
.tw-prog{height:4px;border-radius:2px;overflow:hidden}
.tw-pf{height:100%;border-radius:2px;transition:width .35s}
.tw-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:44px 20px}
.qcard{border-radius:14px;padding:36px;max-width:640px;width:100%}
.opt-btn{width:100%;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .12s;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1.5px solid;outline:none}
.opt-c{width:18px;height:18px;border-radius:50%;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt-ck{width:18px;height:18px;border-radius:4px;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.tw-nav{flex-shrink:0;padding:14px 24px}
.tw-ni{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;background:transparent;border:none;font-size:14px;cursor:pointer;font-family:inherit;border-radius:8px}
.tg:disabled{opacity:.35;cursor:not-allowed}.tg:hover:not(:disabled){background:rgba(0,0,0,.06)}
.tp{display:inline-flex;align-items:center;gap:5px;padding:10px 22px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff}
.tp:hover{opacity:.88}.tp:disabled{opacity:.45;cursor:not-allowed}
.pdots{display:flex;gap:5px;align-items:center}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid;border-radius:12px;cursor:grab;transition:all .15s;user-select:none;-webkit-user-select:none}
.rank-item:active{cursor:grabbing}
.rank-item.drag-over{border-style:dashed;opacity:.65}
.rank-item.dragging{opacity:.3}
.rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.rank-hdl{font-size:18px;opacity:.35;flex-shrink:0;line-height:1;pointer-events:none}
.rank-txt{flex:1;font-size:14px;font-weight:500;pointer-events:none}
.rank-arr{display:flex;flex-direction:column;gap:1px;pointer-events:none}
.rarr{background:none;border:none;cursor:pointer;padding:2px 4px;line-height:1;border-radius:3px;color:inherit;opacity:.5;font-size:13px;pointer-events:all}
.rarr:hover:not(:disabled){background:rgba(0,0,0,.08);opacity:1}
.rarr:disabled{opacity:.15;cursor:default}
.cw{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px}
.ci{max-width:660px;width:100%}
.dr{border-radius:12px;padding:20px;margin-bottom:10px;border:1px solid var(--border);background:var(--surface)}
.sbb{height:7px;background:var(--border);border-radius:4px;margin:8px 0 5px;overflow:hidden}
.sbf{height:100%;border-radius:4px;transition:width .7s}
.bpb{border:1px solid var(--border);border-radius:10px;overflow:hidden;position:sticky;top:20px}
.sw{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color .1s;display:inline-block}
.sw:hover,.sw.sl{border-color:#1e293b}
.swr{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;top:16px;right:16px;z-index:9999;padding:11px 15px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px rgba(0,0,0,.14);animation:ts .2s ease}
.tok{background:#022c22;color:#34d399}.terr{background:#450a0a;color:#f87171}.tinf{background:#1e3a5f;color:#93c5fd}
@keyframes ts{from{transform:translateX(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sp{animation:spin .7s linear infinite;display:inline-block}
@media(max-width:768px){.sgrid{grid-template-columns:1fr 1fr}.rrow{grid-template-columns:1fr 1fr 1fr}}
</style>

<script>
'use strict';

const STORE='ab_v7';
const SW=['#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#d97706','#059669','#0891b2','#0f172a','#334155'];
const DB0={primaryColor:'#2563eb',bgColor:'#f8fafc',textColor:'#1e293b',surfaceColor:'#ffffff',borderColor:'#e2e8f0',logoUrl:'',fontFamily:'system-ui, sans-serif',btnRadius:'8',cardRadius:'12'};
const QIC={instruction:'ti-info-circle',contact_form:'ti-user-circle',multiple_choice:'ti-circle-dot',multi_select:'ti-checkbox',ranking:'ti-sort-ascending-2',text:'ti-text-size'};
const QLA={instruction:'Instruction Block',contact_form:'Contact Form',multiple_choice:'Multiple Choice',multi_select:'Multi-Select',ranking:'Rank These',text:'Open Text'};

const uid=()=>crypto.randomUUID();
const now=()=>new Date().toISOString();
const fd=iso=>{
  if(!iso)return 'Unknown';
  // Supabase returns "2026-05-26 21:20:48+00" — normalize to ISO 8601
  const s=String(iso).replace(' ','T').replace(/\+00$/,'+00:00');
  const d=new Date(s);
  return isNaN(d)?String(iso):d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ══ DB ══ */
/* ── AUTH STATE ─────────────────────────────────────────────────── */
let _sb=null,_session=null,_tenantId=null,_userEmail='',_userName='';
let _syncTimer=null,_syncQueue=new Set();

/* ── SUPABASE HELPERS ────────────────────────────────────────────── */
function _hdrs(extra={}){
  return{apikey:SUPABASE_ANON_KEY,'Authorization':'Bearer '+(_session?.access_token||SUPABASE_ANON_KEY),'Content-Type':'application/json',...extra};
}
async function sbGet(table,qs=''){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${qs?'?'+qs:''}`,{headers:_hdrs({'Accept':'application/json'})});
  if(!r.ok)throw new Error(`GET ${table} ${r.status}`);return r.json();
}
async function sbUpsert(table,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:_hdrs({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(data)});
  if(!r.ok){const e=await r.text();throw new Error(`UPSERT ${table} ${r.status}: ${e}`);}
}
async function sbUpsertReturn(table,data){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:_hdrs({Prefer:'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(data)});
  if(!r.ok){const e=await r.text();throw new Error(`UPSERT ${table} ${r.status}: ${e}`);}
  const rows=await r.json();return Array.isArray(rows)?rows[0]:rows;
}
async function sbDel(table,id){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:'DELETE',headers:_hdrs()});
  if(!r.ok)throw new Error(`DELETE ${table} ${r.status}`);
}

/* ── FIELD MAPPING: Builder (camelCase) ↔ Supabase (snake_case) ── */
function asmToDb(a){return{id:a.id,tenant_id:_tenantId,title:a.title,description:a.description||'',status:a.status||'draft',brand:a.brand||{},webhook_url:a.webhookUrl||'',webhook_headers:a.webhookHeaders||'{"Content-Type":"application/json"}',show_results:a.showResults!==false,allow_retakes:a.allowRetakes!==false,created_at:a.createdAt||now()};}
function dbToAsm(r){return{id:r.id,title:r.title,description:r.description||'',status:r.status||'draft',brand:r.brand||{},webhookUrl:r.webhook_url||'',webhookHeaders:r.webhook_headers||'{"Content-Type":"application/json"}',showResults:r.show_results!==false,allowRetakes:r.allow_retakes!==false,createdAt:r.created_at};}

let db;

      sbGet('ab_dimensions',`assessment_id=eq.${a.id}&order=order_index`),
      sbGet('ab_sections',  `assessment_id=eq.${a.id}&order=order_index`),

/* ── SYNC TO SUPABASE (debounced background write) ───────────────── */
function sv(){
  // Local backup (instant)
  try{localStorage.setItem(STORE,JSON.stringify(db));}catch{}
  // Supabase sync (debounced 600ms)
  if(_session&&_tenantId&&S.asmId){
    _syncQueue.add(S.asmId);
    clearTimeout(_syncTimer);
    _syncTimer=setTimeout(flushSync,600);
  }
}
async function flushSync(){
  const ids=[..._syncQueue];_syncQueue.clear();
  for(const aId of ids){if(aId)await syncAsm(aId).catch(e=>console.warn('Sync failed:',e));}
}
async function syncAsm(aId){
  const asm=db.assessments.find(a=>a.id===aId);if(!asm)return;
  await Promise.all([
    sbUpsert('ab_assessments',asmToDb(asm)),
    ...((db.dimensions[aId]||[]).map(d=>sbUpsert('ab_dimensions',dimToDb(d,aId)))),
    ...((db.sections[aId]||[]).map(s=>sbUpsert('ab_sections',secToDb(s,aId)))),
    ...((db.questions[aId]||[]).map(q=>sbUpsert('ab_questions',qToDb(q,aId)))),
  ]);
}

function getActiveDims(secId){
  const sec=gSecs().find(s=>s.id===secId);
  const all=gDs();
  if(!sec||!sec.activeDimIds||!sec.activeDimIds.length)return all;
  const active=all.filter(d=>sec.activeDimIds.includes(d.id));
  return active.length?active:all;
}

// Sort questions for take flow: by section order then question order within section
function orderedQs(){
  const secs=gSecs();
  const sIdx=Object.fromEntries(secs.map((s,i)=>[s.id,i]));
  return [...gQs()].sort((a,b)=>{
    const si=(a.sectionId!=null?sIdx[a.sectionId]:9999)??9999;
    const sj=(b.sectionId!=null?sIdx[b.sectionId]:9999)??9999;
    if(si!==sj)return si-sj;
    return (a.orderIndex||0)-(b.orderIndex||0);
  });
}

// Questions grouped by section for editor
function qsBySec(){
  const secs=gSecs();
  const all=gQs().sort((a,b)=>(a.orderIndex||0)-(b.orderIndex||0));
  const grouped={};
  secs.forEach(s=>grouped[s.id]=[]);
  const ungrouped=[];
  all.forEach(q=>{
    if(q.sectionId&&grouped[q.sectionId])grouped[q.sectionId].push(q);
    else ungrouped.push(q);
  });
  return{secs,grouped,ungrouped};
}

/* ══ SCORING ══ */
function calcScores(qs,dims,answers){
  const s=Object.fromEntries(dims.map(d=>[d.id,0]));
  qs.forEach(q=>{
    if(q.type==='multiple_choice'&&answers[q.id]){
      const opt=(q.options||[]).find(o=>o.id===answers[q.id]);
      if(opt?.scores)Object.entries(opt.scores).forEach(([k,v])=>{if(s[k]!==undefined)s[k]+=Number(v);});
    }
    if(q.type==='multi_select'&&Array.isArray(answers[q.id])){
      answers[q.id].forEach(oid=>{const opt=(q.options||[]).find(o=>o.id===oid);if(opt?.scores)Object.entries(opt.scores).forEach(([k,v])=>{if(s[k]!==undefined)s[k]+=Number(v);});});
    }
    if(q.type==='ranking'&&Array.isArray(answers[q.id])&&answers[q.id].length){
      const order=answers[q.id];const n=order.length;
      const weights=q.positionWeights&&q.positionWeights.length===n?q.positionWeights:Array.from({length:n},(_,i)=>n-i);
      order.forEach((optId,idx)=>{
        const opt=(q.options||[]).find(o=>o.id===optId);
        const w=Number(weights[idx])||0;
        if(opt?.scores)Object.entries(opt.scores).forEach(([k,v])=>{if(s[k]!==undefined)s[k]+=Number(v)*w;});
      });
    }
  });
  return s;
}
function getRanks(dims,scores){return Object.fromEntries(dims.map(d=>{const s=scores[d.id]||0;const r=(d.ranges||[]).find(r=>s>=r.min&&s<=r.max);return[d.id,r||{label:'N/A',description:'',recommendation:''}];}));}
function getTied(scores){const vals=Object.values(scores);if(!vals.length)return[];const mx=Math.max(...vals);return Object.entries(scores).filter(([,v])=>v===mx).map(([id])=>id);}
function mxSc(qs,dId){let m=0;qs.forEach(q=>{
  if(q.type==='multiple_choice'){const sc=(q.options||[]).map(o=>Number(o.scores?.[dId]||0));if(sc.length)m+=Math.max(0,...sc);}
  if(q.type==='multi_select'){(q.options||[]).forEach(o=>{const s=Number(o.scores?.[dId]||0);if(s>0)m+=s;});}
  if(q.type==='ranking'){const opts=q.options||[];const n=opts.length;const weights=q.positionWeights&&q.positionWeights.length===n?q.positionWeights:Array.from({length:n},(_,i)=>n-i);const maxW=n?Math.max(...weights):0;const maxSc=Math.max(0,...opts.map(o=>Number(o.scores?.[dId]||0)));m+=maxSc*maxW;}
});return m||1;}

/* ══ RENDER ══ */
function seededShuffle(arr, seed) {
  // Simple seeded shuffle — consistent per question per session
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getOpts(q) {
  const opts = q.options || [];
  if (!q.shuffleOptions || !opts.length) return opts;
  if (!S.shuffledOrders[q.id]) {
    // Generate a seed from question ID characters
    const seed = q.id.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0) + Date.now() % 9999;
    S.shuffledOrders[q.id] = seededShuffle(opts.map(o => o.id), seed);
  }
  const order = S.shuffledOrders[q.id];
  return order.map(id => opts.find(o => o.id === id)).filter(Boolean);
}

    :`<div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Submitted</th><th>Name</th><th>Email</th><th>Top Dimension</th><th>Webhook</th><th>Actions</th></tr></thead><tbody>

function rQ(q,b,cr,br){
  const cs=`background:${esc(b.surfaceColor)};border:1px solid ${esc(b.borderColor)};border-radius:${cr}px;`;
  if(q.type==='instruction')return`<div class="qcard" style="${cs}"><h2 style="font-size:22px;font-weight:700;color:${esc(b.textColor)};margin-bottom:12px">${esc(q.title)}</h2><p style="font-size:15px;line-height:1.75;color:${esc(b.textColor)};opacity:.7">${esc(q.description)}</p></div>`;
  if(q.type==='contact_form'){
    return `<div class="qcard" style="${cs}"><h2 style="font-size:19px;font-weight:700;color:${esc(b.textColor)};margin-bottom:14px">${esc(q.title)}</h2>
    ${(q.contactFields||[]).map(f=>`<div style="margin-bottom:12px"><label style="display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${esc(b.textColor)};opacity:.5;margin-bottom:4px">${esc(f.label)}${f.required?' *':''}</label>
      <input type="${esc(f.type||'text')}" id="cf-${esc(f.id)}" value="${esc(S.contact[f.label]||'')}" placeholder="${esc(f.label)}" style="width:100%;padding:10px 12px;border:1px solid ${esc(b.borderColor)};border-radius:${Math.max(2,br-2)}px;font-size:14px;font-family:inherit;color:${esc(b.textColor)};background:${esc(b.bgColor)};outline:none" oninput="S.contact['${esc(f.label)}']=this.value"></div>`).join('')}</div>`;
  }
  if(q.type==='ranking'){
    const opts=getOpts(q);
    if(!Array.isArray(S.answers[q.id])||S.answers[q.id].length!==opts.length)S.answers[q.id]=opts.map(o=>o.id);

  }

/* ══ COMPLETE ══ */
function rComplete(){
  const asm=gAsm();if(!asm||!S.doneResp)return`<div style="text-align:center;padding:60px"><p>No results.</p></div>`;
  const b=gb(asm);const dims=gDs();const resp=S.doneResp;const qs=orderedQs();
  const cr=parseInt(b.cardRadius)||12;const br=parseInt(b.btnRadius)||8;
  return `<div class="cw" style="background:${esc(b.bgColor)};font-family:${esc(b.fontFamily)}">
    <div class="ci">
      ${b.logoUrl?`<div style="text-align:center;margin-bottom:22px"><img src="${esc(b.logoUrl)}" style="height:32px;object-fit:contain" onerror="this.style.display='none'" alt=""></div>`:''}
      <div style="background:${esc(b.surfaceColor)};border:1px solid ${esc(b.borderColor)};border-radius:${cr}px;padding:28px;margin-bottom:14px;text-align:center">
        <div style="width:52px;height:52px;border-radius:50%;background:${esc(b.primaryColor)}22;display:flex;align-items:center;justify-content:center;margin:0 auto 14px"><i class="ti ti-check" style="font-size:26px;color:${esc(b.primaryColor)}"></i></div>
        <h1 style="font-size:22px;font-weight:700;color:${esc(b.textColor)};margin-bottom:8px">Your Results Are In</h1>
        <p style="font-size:14px;color:${esc(b.textColor)};opacity:.65">Your personalized breakdown across each dimension.</p>
        ${(resp.tiedTop||[]).length>1?`<div style="margin-top:12px;padding:5px 16px;background:${esc(b.primaryColor)}18;border-radius:20px;display:inline-block;font-size:12px;color:${esc(b.primaryColor)};font-weight:700">Tied results across ${resp.tiedTop.length} dimensions</div>`:''}
      </div>
      ${dims.map(d=>{const score=resp.scores?.[d.id]||0;const mx=mxSc(qs,d.id);const pct=Math.min(100,Math.round((score/mx)*100));const rank=resp.ranks?.[d.id];const isTied=(resp.tiedTop||[]).includes(d.id);
        return `<div class="dr" style="border-color:${isTied?b.primaryColor:b.borderColor};${isTied?'box-shadow:0 0 0 2px '+b.primaryColor:''}">
          <div class="fx ic jb mb2"><div class="fx ic g2"><div style="width:10px;height:10px;border-radius:50%;background:${esc(d.color||b.primaryColor)}"></div><strong style="color:${esc(b.textColor)}">${esc(d.name)}</strong>${isTied?`<span style="background:${esc(b.primaryColor)};color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">\u2605 Top${(resp.tiedTop||[]).length>1?' (Tied)':''}</span>`:''}</div>${rank?`<span style="color:${esc(d.color||b.primaryColor)};font-size:13px;font-weight:700">${esc(rank.label)}</span>`:''}</div>
          <div class="sbb" style="background:${esc(b.borderColor)}"><div class="sbf" style="width:${pct}%;background:${esc(d.color||b.primaryColor)}"></div></div>
          <div style="font-size:11px;color:${esc(b.textColor)};opacity:.4;margin-bottom:10px">${score} pts (${pct}%)</div>
          ${rank?.description?`<p style="font-size:14px;color:${esc(b.textColor)};font-weight:500;margin-bottom:8px">${esc(rank.description)}</p>`:''}
          ${rank?.recommendation?`<div style="background:${esc(b.bgColor)};border-left:3px solid ${esc(d.color||b.primaryColor)};padding:9px 13px;border-radius:0 6px 6px 0;font-size:13px;color:${esc(b.textColor)};line-height:1.5"><strong>Next step:</strong> ${esc(rank.recommendation)}</div>`:''}
        </div>`;}).join('')}
      <div style="text-align:center;margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${S.preview?`<button onclick="goTo('ed')" style="background:${esc(b.primaryColor)};color:white;border:none;padding:11px 22px;border-radius:${br}px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit"><i class="ti ti-arrow-left"></i> Back to Editor</button>`:''}
        <button onclick="rstA()" style="background:transparent;color:${esc(b.textColor)};border:1px solid ${esc(b.borderColor)};padding:11px 22px;border-radius:${br}px;font-size:14px;cursor:pointer;font-family:inherit">Retake Assessment</button>

    </div>
  </div>`;
}

    optsHtml=`<div class="fg"><div class="fx ic jb mb2"><label style="margin-bottom:0">Contact Fields</label><button class="btn bs bsm" onclick="addCF()"><i class="ti ti-plus"></i> Add Field</button></div>
    ${cfs.map((f,i)=>`<div class="cfr"><input type="text" value="${esc(f.label)}" onchange="updCF(${i},'label',this.value)" placeholder="Label" style="flex:2"><select onchange="updCF(${i},'type',this.value)" style="flex:1"><option value="text" ${f.type==='text'?'selected':''}>Text</option><option value="email" ${f.type==='email'?'selected':''}>Email</option><option value="tel" ${f.type==='tel'?'selected':''}>Phone</option></select><label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;cursor:pointer"><input type="checkbox" ${f.required?'checked':''} onchange="updCF(${i},'required',this.checked)"> Req</label><button class="btn bd bic bsm" onclick="rmCF(${i})"><i class="ti ti-trash"></i></button></div>`).join('')}</div>`;

function rOptBlock(opt,oi,activeDims,qType){
  const scores=opt.scores||{};
  const scoreEntries=Object.entries(scores).filter(([k])=>k);
  return `<div class="opt-block">
    <div class="opt-block-head">
      <div class="opt-block-num">${oi+1}</div>
      <input type="text" value="${esc(opt.text)}" onchange="updOT(${oi},this.value)" style="flex:1;font-size:13.5px;font-weight:500" placeholder="${qType==='ranking'?'Item to rank...':'Option text...'}">
      <button class="btn bd bic bsm" onclick="rmO(${oi})"><i class="ti ti-trash"></i></button>
    </div>
    ${activeDims.length?`<div>
      ${scoreEntries.map(([dimId,score],si)=>{
        const dim=activeDims.find(d=>d.id===dimId);
        return `<div class="score-row">
          <select onchange="updODim(${oi},'${dimId}',this.value)" style="flex:1;min-width:0">
            ${activeDims.map(d=>`<option value="${d.id}" ${d.id===dimId?'selected':''}>${esc(d.name)}</option>`).join('')}

          <input type="number" value="${score}" min="0" max="999" onchange="updOScore(${oi},'${dimId}',this.value)" style="width:70px;text-align:center">
          <button class="btn bd bic bsm" onclick="rmODim(${oi},'${dimId}')"><i class="ti ti-x"></i></button>
        </div>`;}).join('')}
      <button class="btn bg bsm mt2" onclick="addODim(${oi})" style="font-size:12px"><i class="ti ti-plus"></i> Add Dimension</button>
    </div>`:`<p class="tm tsm" style="font-size:11px;margin-top:6px">No active dimensions for this section</p>`}
  </div>`;
}

/* ── RESPONSE MODAL ── */
function rRMod(){
  const resp=S.modal.data;const dims=gDs();const asm=gAsm();const qs=orderedQs();
  // Normalize field names — handle both camelCase (local db) and snake_case (Supabase direct)
  const createdAt  = resp.createdAt || resp.created_at;
  const webhookSt  = resp.webhookStatus || resp.webhook_status || 'not_configured';
  const tiedTop    = resp.tiedTop || resp.tied_top || [];
  // Parse scores/ranks/contact — may be string (if Supabase stored as text) or object
  const parseJ = v => { try { return typeof v==='string' ? JSON.parse(v) : (v||{}); } catch{ return {}; } };
  const scores = parseJ(resp.scores);
  const ranks  = parseJ(resp.ranks);
  const contact= parseJ(resp.contact);
  // Scores keyed by dim NAME in Supabase; tiedTop keyed by dim ID
  return `<div class="mov" onclick="bgC(event)"><div class="modal mw">
    <div class="mhd"><h2>Response Detail</h2><div class="fx g2">${asm?.webhookUrl?`<button class="btn bs bsm" onclick="rfFromM('${resp.id}')"><i class="ti ti-refresh"></i> Refire</button>`:''}<button class="btn bg bic" onclick="clM()"><i class="ti ti-x"></i></button></div></div>
    <div class="mbd">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div><p class="fgl mb2">Contact</p>${Object.entries(contact).map(([k,v])=>`<div class="fx mb2 g2"><span class="tm tsm" style="min-width:100px">${esc(k)}</span><strong class="tsm">${esc(String(v||''))}</strong></div>`).join('')||'<p class="tm tsm">No contact data</p>'}<p class="tm tsm mt2">Submitted: ${fd(createdAt)}</p></div>
        <div><p class="fgl mb2">Webhook</p><div class="fx ic g1 mb2"><i class="ti ${webhookSt==='success'?'ti-circle-check':'ti-minus'}" style="${webhookSt==='success'?'color:var(--ok)':'color:var(--muted)'}"></i><span class="tsm">${esc(webhookSt)}</span></div></div>
      </div>
      <p class="fgl mb2">Scores</p>
      ${dims.map(d=>{
        const score=Number(scores[d.name]||0);
        const rank=ranks[d.name];
        const isTied=tiedTop.includes(d.id);
        const mx=mxSc(qs,d.id);
        const pct=mx>0?Math.min(100,Math.round((score/mx)*100)):0;
        return `<div style="padding:12px;border-radius:8px;margin-bottom:8px;border-left:4px solid ${esc(d.color||'#94a3b8')};background:var(--bg)">
          <div class="fx ic jb mb2"><div class="fx ic g2"><div style="width:9px;height:9px;border-radius:50%;background:${esc(d.color||'#94a3b8')}"></div><strong>${esc(d.name)}</strong>${isTied?`<span class="bdg bbl">Top</span>`:''}</div><div class="fx g2 ic">${rank?`<span class="bdg bdft">${esc(rank.label||'')}</span>`:''}<span class="tm tsm">${score} pts</span></div></div>
          <div class="sbb"><div class="sbf" style="width:${pct}%;background:${esc(d.color||'#94a3b8')}"></div></div>
          ${rank?.recommendation?`<p class="tsm tm mt2"><strong>Rec:</strong> ${esc(rank.recommendation)}</p>`:''}
        </div>`;}).join('')}
    </div>
  </div></div>`;
}

function mvQSec(qId,dir,secId){

async function rlRs(){

  const asm = gAsm(); if(!asm) return;

  toast('Refreshing...');

const SCHEMA_SPEC = `ASSESSMENT BUILDER — JSON SCHEMA SPECIFICATION
=============================================
Use this spec to generate valid assessment JSON for import.
All dimension/section references use NAMES (strings), not internal IDs.

ROOT OBJECT
-----------
{

  "dimensions": Dimension[],
  "sections": Section[],
  "questions": Question[],

  "webhookHeaders": string (optional — JSON-stringified headers object)
}

DIMENSION
---------
{
  "name": string,           // Required. Used as key in all option scores.
  "description": string,    // What this dimension measures.
  "color": string,          // Hex color e.g. "#3b82f6"
  "ranges": [

      "label": string,      // e.g. "Emerging" | "Developing" | "Advanced"
      "description": string,
      "recommendation": string
    }
  ]
}
RANGE NOTE: Ranking questions multiply scores by position weights.
  Example: weight [10,6,3,1], top option score 8 → contributes 80 pts.
  Set range max values to accommodate the maximum weighted total across
  all questions. A safe ceiling = max_option_score × max_weight × num_ranking_questions.

SECTION
-------
{
  "title": string,              // Required. Referenced by questions.
  "description": string,
  "orderIndex": number,         // 0-based display order
  "activeDimensions": string[]  // Dimension names scoped to this section.
                                // Empty [] = all dimensions shown.
}

QUESTION
--------
{
  "section": string | null,     // Section title. null = ungrouped.
  "type": string,               // See QUESTION TYPES below.
  "title": string,              // Required.
  "description": string,
  "required": boolean,

          ${secClassified.map(d => {
            const score = scores[d.id]||0;

            const pct   = Math.min(100,Math.round((score/maxScore)*100));
            const badgeCol = rank.label.toLowerCase().includes('primary')||rank.label==='Personality Type'?'bbl':rank.label.toLowerCase().includes('highly')||rank.label.toLowerCase().includes('high')?'bdft':'bpur';

function runTestScores() {
  const dims = gDs().filter(d => !d.name.startsWith('Spectrum — '));
  const secs = gSecs();
  const scores = {};
  dims.forEach(d => {
    const el = document.getElementById('ts-' + d.id);
    const val = el ? Number(el.value)||0 : (S._test[d.id]||0);
    scores[d.id] = val;
    S._test[d.id] = val;
  });
  const ranks = getRanks(dims, scores);
  // Apply formula overrides
  secs.forEach(sec => {
    const formula = sec.classificationFormula || 'ranges';
    const fl = sec.formulaLabels || {};
    const secDims = dims.filter(d => (sec.activeDimIds||[]).includes(d.id));
    if (!secDims.length) return;
    if (formula === 'pt_delta') {
      const PT_MAX = {'Adventurer':28};
      const pcts = {};
      secDims.forEach(d => { pcts[d.id] = (scores[d.id]||0)/(PT_MAX[d.name]||32)*100; });
      const maxPct = Math.max(...Object.values(pcts));
      secDims.forEach(d => {
        const pct = pcts[d.id];
        const delta = fl.delta1 ?? 1.5; const t2 = fl.delta2 ?? 65; const t3 = fl.delta3 ?? 37;
        let label=null, desc='', rec='';
        if (pct >= maxPct - delta)      { label=fl.tier1||'Personality Type'; desc='Core expression of who you are'; rec='Own this type fully.'; }
        else if (pct >= t2)             { label=fl.tier2||'Highly Impacting Type'; desc='Significantly shapes behavior'; rec='Lean into this type where it serves you.'; }
        else if (pct >= t3)             { label=fl.tier3||'Secondary Type'; desc='Background influence'; rec='Notice when this activates.'; }
        ranks[d.id] = label ? {label,description:desc,recommendation:rec} : {label:'N/A',description:'',recommendation:''};
      });
    } else if (formula === 'relative_max') {
      const raw = {}; secDims.forEach(d => { raw[d.id]=scores[d.id]||0; });
      const mx = Math.max(...Object.values(raw));
      const delta = fl.delta1 ?? 4; const floor = (fl.delta2 ?? 40)/100;
      const sig = mx * floor;
      const belowMx = Object.values(raw).filter(v => v < mx && v > sig);
      const secMax = belowMx.length ? Math.max(...belowMx) : -1;
      secDims.forEach(d => {
        const s = raw[d.id]; let label=null;
        if (s >= mx - delta) label = fl.tier1||'Primary';
        else if (secMax>-1 && s >= secMax-delta && s < mx-delta) label = fl.tier2||'Secondary';
        ranks[d.id] = label ? {label, description:label+' '+d.name+' expression', recommendation:label===(fl.tier1||'Primary')?'Your dominant pattern.':'Secondary pattern — notice when it activates.'} : {label:'N/A',description:'',recommendation:''};
      });
    }
  });
  S._testResults = {scores, ranks};
  render();
}

function fillTestZero() {
  const dims = gDs().filter(d => !d.name.startsWith('Spectrum — '));
  dims.forEach(d => { S._test[d.id]=0; });
  S._testResults = null;
  render();
}

function updFL(secIdx, key, val) {
  const secs = gSecs();
  if (!secs[secIdx]) return;
  if (!secs[secIdx].formulaLabels) secs[secIdx].formulaLabels = {};
  secs[secIdx].formulaLabels[key] = val;
}

function updSecFormula(secIdx, val) {
  const secs = gSecs();
  if (!secs[secIdx]) return;
  secs[secIdx].classificationFormula = val;
  render();
}

function svAllFormulas() {
  const secs = gSecs();
  const aId = S.asmId;
  if (!aId) return;
  // Save each section back to db and Supabase
  const saves = secs.map(sec => {
    if (!db.sections[aId]) db.sections[aId] = [];
    const i = db.sections[aId].findIndex(s => s.id === sec.id);
    if (i >= 0) db.sections[aId][i] = sec;
    return sbUpsert('ab_sections', DB.secToDb(sec, aId));
  });
  Promise.all(saves).then(() => toast('Formulas saved!')).catch(e => toast('Save error: ' + e.message, 'err'));
}




/* ══ CSV PARSER ══ */
function parseCSV(text){
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
  if(!lines.length)return[];
  const headers=parseCSVRow(lines[0]);
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals=parseCSVRow(line);
    return Object.fromEntries(headers.map((h,i)=>[h.trim(),(vals[i]||'').trim()]));
  });
}
function parseCSVRow(line){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(ch===','&&!inQ){result.push(cur);cur='';}
    else cur+=ch;
  }
  result.push(cur);return result;
}
function csvQ(v){
  const s=String(v??'');
  return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s;
}
function dlFile(content,filename,mime='text/plain'){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

/* ══ JSON EXPORT ══ */
function buildExportJSON(asmId){
  const asm=db.assessments.find(a=>a.id===asmId);if(!asm)return null;
  const dims=(db.dimensions[asmId]||[]).sort((a,b)=>a.orderIndex-b.orderIndex);
  const secs=((db.sections||{})[asmId]||[]).sort((a,b)=>a.orderIndex-b.orderIndex);
  const allQs=db.questions[asmId]||[];
  const dimIdToName=Object.fromEntries(dims.map(d=>[d.id,d.name]));
  const secIdToTitle=Object.fromEntries(secs.map(s=>[s.id,s.title]));
  const secOrder=Object.fromEntries(secs.map((s,i)=>[s.id,i]));
  const sortedQs=[...allQs].sort((a,b)=>{
    const si=(a.sectionId!=null?secOrder[a.sectionId]:9999)??9999;
    const sj=(b.sectionId!=null?secOrder[b.sectionId]:9999)??9999;
    if(si!==sj)return si-sj;
    return(a.orderIndex||0)-(b.orderIndex||0);
  });
  return{
    assessment:{title:asm.title,description:asm.description,status:asm.status,showResults:asm.showResults},
    dimensions:dims.map(d=>({name:d.name,description:d.description,color:d.color,ranges:(d.ranges||[]).sort((a,b)=>a.min-b.min).map(r=>({min:r.min,max:r.max,label:r.label,description:r.description,recommendation:r.recommendation}))})),
    sections:secs.map(s=>({title:s.title,description:s.description,orderIndex:s.orderIndex,activeDimensions:(s.activeDimIds||[]).map(id=>dimIdToName[id]||id)})),
    questions:sortedQs.map(q=>({
      section:q.sectionId?secIdToTitle[q.sectionId]||null:null,
      type:q.type,title:q.title,description:q.description,required:q.required,orderIndex:q.orderIndex,
      ...(q.type==='ranking'?{positionWeights:q.positionWeights||[]}:{}),
      ...(q.contactFields?.length?{contactFields:q.contactFields}:{}),
      ...((q.options||[]).length?{options:(q.options||[]).map(o=>({text:o.text,scores:Object.fromEntries(Object.entries(o.scores||{}).map(([k,v])=>[dimIdToName[k]||k,v]))}))}:{}),
    })),
    webhookUrl:asm.webhookUrl,
    webhookHeaders:asm.webhookHeaders,
  };
}
function doExportJSON(asmId){
  const j=buildExportJSON(asmId);if(!j)return;
  const asm=db.assessments.find(a=>a.id===asmId);
  const fn=(asm?.title||'assessment').replace(/[^a-z0-9]/gi,'-').toLowerCase()+'.json';
  dlFile(JSON.stringify(j,null,2),fn,'application/json');
}

}

  });

    return{id:newId,aId:id,title:s.title,description:s.description||'',orderIndex:s.orderIndex??i,activeDimIds:(s.activeDimensions||[]).map(n=>dimNameToId[n]).filter(Boolean)};
  });

    type:q.type||'multiple_choice',title:q.title||'',description:q.description||'',
    required:q.required!==false,orderIndex:q.orderIndex??i,
    positionWeights:q.positionWeights||[],
    contactFields:(q.contactFields||[]).map(f=>({id:uid(),...f})),
    options:(q.options||[]).map(o=>({id:uid(),text:o.text||'',scores:Object.fromEntries(Object.entries(o.scores||{}).map(([n,v])=>[dimNameToId[n]||n,v]))})),
  }));

    else ranges.forEach(r=>rows.push([d.name,d.description||'',d.color||'',r.min,r.max,r.label,r.description||'',r.recommendation||'']));
  });

function doExportQsCSV(asmId){
  const dims=(db.dimensions[asmId]||[]).sort((a,b)=>a.orderIndex-b.orderIndex);
  const secs=((db.sections||{})[asmId]||[]).sort((a,b)=>a.orderIndex-b.orderIndex);
  const secOrder=Object.fromEntries(secs.map((s,i)=>[s.id,i]));
  const secIdToTitle=Object.fromEntries(secs.map(s=>[s.id,s.title]));
  const dimIdToName=Object.fromEntries(dims.map(d=>[d.id,d.name]));
  const sortedQs=[...(db.questions[asmId]||[])].sort((a,b)=>{
    const si=(a.sectionId!=null?secOrder[a.sectionId]:9999)??9999;
    const sj=(b.sectionId!=null?secOrder[b.sectionId]:9999)??9999;
    if(si!==sj)return si-sj;
    return(a.orderIndex||0)-(b.orderIndex||0);
  });
  if(!sortedQs.length){toast('No questions to export','err');return;}
  const dimNames=dims.map(d=>d.name);
  const headers=['section','type','title','description','required','position_weights','option_text',...dimNames];
  const rows=[headers];
  sortedQs.forEach(q=>{
    const sec=q.sectionId?secIdToTitle[q.sectionId]||'':'';
    const pw=q.positionWeights?.length?q.positionWeights.join('|'):'';
    if(!q.options||!q.options.length){
      rows.push([sec,q.type,q.title,q.description||'',q.required?'true':'false',pw,'',...dimNames.map(()=>'')]);
    }else{
      q.options.forEach(opt=>{
        const scores=dims.map(d=>String(opt.scores?.[d.id]??''));
        rows.push([sec,q.type,q.title,q.description||'',q.required?'true':'false',pw,opt.text,...scores]);
      });
    }
  });

  const fn=(asm?.title||'assessment').replace(/[^a-z0-9]/gi,'-').toLowerCase()+'-questions.csv';
  dlFile(rows.map(r=>r.map(csvQ).join(',')).join('\n'),fn,'text/csv');
}

function handleDimsCSVFile(input,asmId){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();

function importDimsCSV(text,asmId){
  const rows=parseCSV(text);if(!rows.length){toast('No data in CSV','err');return;}
  if(!db.dimensions[asmId])db.dimensions[asmId]=[];
  const existing=db.dimensions[asmId];
  const existingNames=new Set(existing.map(d=>d.name.toLowerCase()));
  const groups={};const order=[];
  rows.forEach(row=>{
    const name=(row.name||row.Name||'').trim();if(!name)return;
    const key=name.toLowerCase();
    if(!groups[key]){groups[key]={name,description:row.description||'',color:row.color||'#3b82f6',ranges:[]};order.push(key);}
    const mn=Number(row.range_min);const mx=Number(row.range_max);
    if(!isNaN(mn)&&!isNaN(mx)&&row.range_label){
      groups[key].ranges.push({id:uid(),min:mn,max:mx,label:row.range_label||'',description:row.range_description||'',recommendation:row.range_recommendation||''});
    }
  });
  let added=0,updated=0;
  order.forEach(key=>{
    const g=groups[key];const g_name_lower=g.name.toLowerCase();
    const ex=existing.find(d=>d.name.toLowerCase()===g_name_lower);
    if(ex){
      // Merge ranges
      g.ranges.forEach(r=>{if(!ex.ranges.find(er=>er.label===r.label))ex.ranges.push(r);});
      updated++;
    }else{
      existing.push({id:uid(),aId:asmId,name:g.name,description:g.description,color:g.color,orderIndex:existing.length,ranges:g.ranges});
      added++;
    }
  });
  sv();toast(`Dimensions: ${added} added, ${updated} updated`);render();
}
function handleQsCSVFile(input,asmId){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>importQsCSV(e.target.result,asmId);
  reader.readAsText(file);
}
function importQsCSV(text,asmId){
  const rows=parseCSV(text);if(!rows.length){toast('No data in CSV','err');return;}
  const fixed=['section','type','title','description','required','position_weights','option_text'];
  const allKeys=Object.keys(rows[0]);
  const dimCols=allKeys.filter(h=>!fixed.includes(h.toLowerCase().trim()));
  const dims=db.dimensions[asmId]||[];
  const secs=((db.sections||{})[asmId]||[]);
  const dimColToId={};
  dimCols.forEach(col=>{const m=dims.find(d=>d.name.toLowerCase()===col.toLowerCase().trim());if(m)dimColToId[col]=m.id;});
  const secTitleToId=Object.fromEntries(secs.map(s=>[s.title.toLowerCase(),s.id]));
  const groups={};const groupOrder=[];
  // Track last known question context for continuation rows
  let lastKey='';
  rows.forEach(row=>{
    const rawTitle=(row.title||'').trim();
    const rawType=(row.type||'').trim();
    const rawSec=(row.section||'').trim();
    // If title+type are blank, it's a continuation of the last question
    const key=rawTitle&&rawType?`${rawSec}|||${rawTitle}|||${rawType}`:lastKey;
    if(!key)return;
    if(!groups[key]){
      groups[key]={section:rawSec||groups[lastKey]?.section||'',type:rawType||'multiple_choice',title:rawTitle,description:row.description||'',required:(row.required||'true').toLowerCase()!=='false',positionWeights:row.position_weights||'',options:[]};
      groupOrder.push(key);
    }
    lastKey=key;
    const optText=(row.option_text||'').trim();
    if(optText){
      const scores={};
      dimCols.forEach(col=>{if(dimColToId[col]&&row[col]!=='')scores[dimColToId[col]]=Number(row[col])||0;});
      groups[key].options.push({id:uid(),text:optText,scores});
    }
  });
  if(!db.questions[asmId])db.questions[asmId]=[];
  const existing=db.questions[asmId];
  let added=0;
  groupOrder.forEach((key,i)=>{
    const g=groups[key];
    const secId=g.section?secTitleToId[g.section.toLowerCase()]||null:null;
    const weights=g.positionWeights?g.positionWeights.split('|').map(Number).filter(n=>!isNaN(n)):[];
    existing.push({id:uid(),aId:asmId,sectionId:secId,type:g.type,title:g.title,description:g.description,required:g.required,orderIndex:existing.length,positionWeights:weights,contactFields:[],options:g.options});
    added++;
  });
  sv();toast(`Imported ${added} question${added!==1?'s':''} \u2713`);render();
}

  container:    '#my-div',

  height:       'auto',

}

/* ══ AUTH FUNCTIONS ══════════════════════════════════════════════════ */
function signInGoogle(){
  if(!_sb){toast('Supabase not initialized','err');return;}
  _sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:APP_URL+'/auth/callback'}});
}

async function signOut(){
  await _sb.auth.signOut();
  db={assessments:[],questions:{},dimensions:{},sections:{},responses:{}};
  S.view='home';S.asmId=null;
  document.getElementById('app').innerHTML=rLogin();
}

/* ══ INIT ═════════════════════════════════════════════════════════════ */
async function initAuth(){
  // Fall back to sample data if Supabase not configured (local dev)
  if(!SUPABASE_URL||SUPABASE_URL==='${SUPABASE_URL}'){
    console.warn('Supabase not configured — running in local mode');
    try{const r=localStorage.getItem(STORE);if(r){db=JSON.parse(r);if(!db.sections)db.sections={};}else{db=mkSample();}}catch{db=mkSample();}
    render();return;
  }
  _sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,autoRefreshToken:true,persistSession:true}});
  _sb.auth.onAuthStateChange(async(event,session)=>{
    // Handle all events that carry a valid session
    if(session&&(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'||event==='INITIAL_SESSION')){
      _session=session;
      // On callback URL — do a full redirect to / so INITIAL_SESSION fires cleanly
      if(window.location.pathname.includes('callback')){
        window.location.href='/';
        return;
      }
      _userEmail=session.user.email||'';
      _userName=session.user.user_metadata?.full_name||session.user.user_metadata?.name||_userEmail;
      try{
        _tenantId=await ensureTenant();
        showLoading();
        await loadAll();
        render();
      }catch(e){
        console.error('App load error:',e);
        document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:system-ui,sans-serif;color:#64748b;text-align:center;padding:40px">
          <i class="ti ti-alert-circle" style="font-size:40px;color:#ef4444"></i>
          <h2 style="color:#1e293b;font-size:18px">Failed to load</h2>
          <p style="font-size:14px">${e.message}</p>
          <button onclick="location.reload()" style="margin-top:8px;padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">Retry</button>
        </div>`;
      }
    }else if(event==='SIGNED_OUT'||(!session&&event==='INITIAL_SESSION')){
      _session=null;_tenantId=null;
      document.getElementById('app').innerHTML=rLogin();
    }
  });
  // Also check for existing session on page load (handles refresh)
  const{data:{session}}=await _sb.auth.getSession();
  if(session){
    _session=session;
    _userEmail=session.user.email||'';
    _userName=session.user.user_metadata?.full_name||session.user.user_metadata?.name||_userEmail;
    try{
      _tenantId=await ensureTenant();
      showLoading();
      await loadAll();
      render();
    }catch(e){console.error('Initial load error:',e);}
  }else if(!window.location.pathname.includes('callback')){
    document.getElementById('app').innerHTML=rLogin();
  }
}

function showLoading(){
  document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#64748b;font-family:system-ui,sans-serif"><div style="width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite"></div><div style="font-size:14px">Loading your assessments...</div></div>`;
}


initAuth();
</script>
